});


// ----- Atlas (Phase 6, part 2): the chart of the voyage and one page per place, each with its own geometric pattern -----
let atlasOpen = false;

// A repeatable number from text, for places saved before they stored a seed.
function hashText(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 33) ^ str.charCodeAt(i)) | 0;
  return h;
}

// Records where the ship has been: a point every TRACK_STEP metres. Old points thin out when the list gets long.
function recordTrack() {
  const t = nav.track, n = t.length;
  if (n >= 2) {
    const dx = ship.x - t[n - 2], dz = ship.z - t[n - 1];
    if (dx * dx + dz * dz < NAV.trackStep * NAV.trackStep) return;
  }
  t.push(Math.round(ship.x), Math.round(ship.z));
  nav.trackDirty = true;
  if (t.length > NAV.trackMax * 2) {
    const thin = [];
    for (let i = 0; i < t.length; i += 4) thin.push(t[i], t[i + 1]);
    nav.track = thin;
  }
}

// ----- Pattern: an eight-, ten- or twelve-fold rosette built from the island's seed. Straight lines and arcs only. -----
function drawPattern(cv, seedI) {
  const c = cv.getContext('2d'), S = cv.width, r = mulberry32((seedI ^ 0x2545f491) >>> 0);
  const folds = [6, 8, 10, 12], n = folds[Math.floor(r() * 4)];
  const steps = { 6: [2], 8: [2, 3], 10: [3, 4], 12: [3, 4, 5] }[n];
  const k1 = steps[Math.floor(r() * steps.length)], k2 = steps[Math.floor(r() * steps.length)];
  const pal = NAV.palettes[Math.floor(r() * NAV.palettes.length)];
  const rot = r() * Math.PI * 2 / n;
  const cx = S / 2, cy = S / 2, R = S * 0.42;
  c.fillStyle = pal.bg;
  c.fillRect(0, 0, S, S);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const pt = (rad, i, off) => [cx + Math.cos(rot + off + i * Math.PI * 2 / n) * rad, cy + Math.sin(rot + off + i * Math.PI * 2 / n) * rad];
  const starLines = (rad, k, off) => {
    c.beginPath();
    for (let i = 0; i < n; i++) { const a = pt(rad, i, off), b = pt(rad, (i + k) % n, off); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
    c.stroke();
  };
  // Corner stars, so the page reads as a tile.
  c.strokeStyle = pal.line; c.lineWidth = S / 160;
  [[0, 0], [S, 0], [0, S], [S, S]].forEach((p) => {
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, b = (i + 3) * Math.PI / 4, rr = S * 0.16;
      c.moveTo(p[0] + Math.cos(a) * rr, p[1] + Math.sin(a) * rr); c.lineTo(p[0] + Math.cos(b) * rr, p[1] + Math.sin(b) * rr);
    }
    c.stroke();
  });
  // Soft fill of the inner rosette.
  c.fillStyle = pal.fill;
  c.beginPath();
  for (let i = 0; i < n; i++) { const a = pt(R * 0.62, i, Math.PI / n); if (i) c.lineTo(a[0], a[1]); else c.moveTo(a[0], a[1]); }
  c.closePath(); c.fill();
  // Rings.
  c.strokeStyle = pal.line; c.lineWidth = S / 120;
  c.beginPath(); c.arc(cx, cy, R * 1.04, 0, Math.PI * 2); c.stroke();
  c.lineWidth = S / 260;
  c.beginPath(); c.arc(cx, cy, R * 0.98, 0, Math.PI * 2); c.stroke();
  // Two crossing stars, the second turned half a step.
  c.lineWidth = S / 110; c.strokeStyle = pal.line;
  starLines(R * 0.98, k1, 0);
  c.strokeStyle = pal.accent; c.lineWidth = S / 140;
  starLines(R * 0.64, k2, Math.PI / n);
  // Petals: curves from one inner point to the next, bulging outwards.
  c.strokeStyle = pal.line; c.lineWidth = S / 200;
  for (let i = 0; i < n; i++) {
    const a = pt(R * 0.64, i, Math.PI / n), b = pt(R * 0.64, i + 1, Math.PI / n), m = pt(R * 0.98, i, Math.PI / n + Math.PI / n);
    c.beginPath(); c.moveTo(a[0], a[1]); c.quadraticCurveTo(m[0], m[1], b[0], b[1]); c.stroke();
  }
  // Centre.
  c.strokeStyle = pal.accent; c.lineWidth = S / 150;
  c.beginPath();
  for (let i = 0; i <= n; i++) { const a = pt(R * 0.3, i, 0); if (i) c.lineTo(a[0], a[1]); else c.moveTo(a[0], a[1]); }
  c.stroke();
  c.fillStyle = pal.line;
  c.beginPath(); c.arc(cx, cy, S * 0.025, 0, Math.PI * 2); c.fill();
  // Frame.
  c.strokeStyle = pal.line; c.lineWidth = S / 100;
  c.strokeRect(S * 0.01, S * 0.01, S * 0.98, S * 0.98);
}

// ----- Chart: a parchment map with your track, the places you found and your ship. North is up. -----
function niceStep(span) {
  const raw = span / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}

function drawChart() {
  const cv = atlasChartEl, c = cv.getContext('2d'), W = cv.width, H = cv.height, CC = NAV.chart;
  const xs = [0, ship.x], zs = [0, ship.z];
  for (let i = 0; i < nav.track.length; i += 2) { xs.push(nav.track[i]); zs.push(nav.track[i + 1]); }
  nav.found.forEach((f) => { xs.push(f.x); zs.push(f.z); });
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), z0 = Math.min.apply(null, zs), z1 = Math.max.apply(null, zs);
  const cxm = (x0 + x1) / 2, czm = (z0 + z1) / 2;
  let span = Math.max(x1 - x0, (z1 - z0) * W / H, CC.minSpan) * 1.25;
  const sx = W / span, X = (x) => W / 2 + (x - cxm) * sx, Z = (z) => H / 2 + (z - czm) * sx;
  const grad = c.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.8);
  grad.addColorStop(0, CC.paper); grad.addColorStop(1, CC.paperEdge);
  c.fillStyle = grad; c.fillRect(0, 0, W, H);
  // Grid.
  const step = niceStep(span);
  c.strokeStyle = CC.grid; c.lineWidth = 1;
  c.beginPath();
  for (let gx = Math.ceil((cxm - span / 2) / step) * step; gx < cxm + span / 2; gx += step) { c.moveTo(X(gx), 0); c.lineTo(X(gx), H); }
  for (let gz = Math.ceil((czm - span * H / W / 2) / step) * step; gz < czm + span * H / W / 2; gz += step) { c.moveTo(0, Z(gz)); c.lineTo(W, Z(gz)); }
  c.stroke();
  // Track.
  if (nav.track.length >= 4) {
    c.strokeStyle = CC.track; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round';
    c.setLineDash([9, 6]);
    c.beginPath();
    for (let i = 0; i < nav.track.length; i += 2) { if (i) c.lineTo(X(nav.track[i]), Z(nav.track[i + 1])); else c.moveTo(X(nav.track[0]), Z(nav.track[1])); }
    c.lineTo(X(ship.x), Z(ship.z));
    c.stroke();
    c.setLineDash([]);
  }
  // Start: a small cross.
  c.strokeStyle = CC.ink; c.lineWidth = 3;
  c.beginPath(); c.moveTo(X(0) - 8, Z(0)); c.lineTo(X(0) + 8, Z(0)); c.moveTo(X(0), Z(0) - 8); c.lineTo(X(0), Z(0) + 8); c.stroke();
  c.fillStyle = CC.ink; c.font = '500 22px ' + CC.font; c.textBaseline = 'middle';
  c.fillText(NAV.text.chartStart, X(0) + 14, Z(0) - 14);
  // Places found.
  nav.found.forEach((f) => {
    c.fillStyle = CC.places[f.type % CC.places.length]; c.strokeStyle = CC.ink; c.lineWidth = 2.5;
    c.beginPath(); c.arc(X(f.x), Z(f.z), 11, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = CC.ink; c.font = '600 24px ' + CC.font;
    c.fillText(f.name, X(f.x) + 18, Z(f.z));
  });
  // Ship: a pointed marker facing the heading.
  const hr = ship.heading * SHIP_DEG, fx = Math.sin(hr), fz = -Math.cos(hr), px = X(ship.x), pz = Z(ship.z);
  c.fillStyle = CC.ship; c.strokeStyle = CC.ink; c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(px + fx * 16, pz + fz * 16);
  c.lineTo(px - fx * 11 - fz * 10, pz - fz * 11 + fx * 10);
  c.lineTo(px - fx * 11 + fz * 10, pz - fz * 11 - fx * 10);
  c.closePath(); c.fill(); c.stroke();
  // North arrow and scale bar.
  c.fillStyle = CC.ink; c.strokeStyle = CC.ink; c.lineWidth = 3;
  c.beginPath(); c.moveTo(W - 40, 70); c.lineTo(W - 40, 30); c.stroke();
  c.beginPath(); c.moveTo(W - 40, 20); c.lineTo(W - 48, 38); c.lineTo(W - 32, 38); c.closePath(); c.fill();
  c.font = '600 22px ' + CC.font; c.textAlign = 'center'; c.fillText(CONFIG.ui.compassNames[0], W - 40, 88); c.textAlign = 'left';
  const barM = niceStep(span / 2.5), barPx = barM * sx;
  c.lineWidth = 4; c.beginPath(); c.moveTo(24, H - 28); c.lineTo(24 + barPx, H - 28); c.stroke();
  c.font = '500 20px ' + CC.font;
  c.fillText(barM >= 1000 ? (barM / 1000) + ' km' : barM + ' m', 24, H - 46);
  // Frame.
  c.strokeStyle = CC.ink; c.lineWidth = 4; c.strokeRect(2, 2, W - 4, H - 4);
}

function renderAtlas() {
  drawChart();
  atlasPagesEl.textContent = '';
  atlasNoteEl.textContent = nav.found.length ? '' : NAV.text.noPages;
  for (let i = nav.found.length - 1; i >= 0; i--) {
    const f = nav.found[i];
    const card = document.createElement('div');
    card.className = 'atlas-page';
    const cv = document.createElement('canvas');
    cv.width = 240; cv.height = 240;
    cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', f.name + ', ' + NAV.typeNames[f.type]);
    drawPattern(cv, f.s);
    const a = document.createElement('span'); a.className = 'j-name'; a.textContent = f.name;
    const b = document.createElement('span'); b.className = 'j-type'; b.textContent = NAV.typeNames[f.type];
    card.appendChild(cv); card.appendChild(a); card.appendChild(b);
    atlasPagesEl.appendChild(card);
  }
}

// ===== PHASE 6C: STAR COMPASS + KAMAL SIGHTING =====
let starCompassTimer = 0;
let sightTargetId = 'pole';
let sightTargetsBuilt = false;
const sightDirection = new THREE.Vector3();
const sightTargetVectors = {
  pole: () => celToWorld(0, 0, 1, sightDirection),
};
function getSightTarget(id) {
  if (id === 'pole') {
    const d = sightTargetVectors.pole();
    return { name: NAV.text.poleStar, direction: d.clone(), altitude: Math.asin(Math.max(-1, Math.min(1, d.y))) * RAD_TO_DEG, bearing: (Math.atan2(d.x, -d.z) * RAD_TO_DEG + 360) % 360, pole: true };
  }
  const P = CONFIG.sky.stars.patterns.find((item) => item.name === id) || CONFIG.sky.stars.patterns[0];
  const c = celestialVec(P.ra, P.dec);
  const d = celToWorld(c[0], c[1], c[2], sightDirection).clone().normalize();
  return { name: P.name, direction: d, altitude: Math.asin(Math.max(-1, Math.min(1, d.y))) * RAD_TO_DEG, bearing: (Math.atan2(d.x, -d.z) * RAD_TO_DEG + 360) % 360, pole: false };
}
function updateStarCompass(dt) {
  starCompassTimer += dt;
  if (starCompassTimer < 0.2) return;
  starCompassTimer = 0;
  const visible = sailing && !photoMode && sunDir.y < 0.035;
  document.body.classList.toggle('is-night', visible);
  const showSight = visible && hudIsShown && !settingsOpen && !journalOpen && !atlasOpen && !shipCustomOpen && !sightOpen;
  sightBtn.classList.toggle('is-shown', showSight);
  setInert(sightBtn, !showSight);
  starCompassDialEl.style.transform = 'rotate(' + (-ship.heading) + 'deg)';
}
function buildSightTargets() {
  if (sightTargetsBuilt) return;
  const targets = [{ value: 'pole', label: NAV.text.poleStar }].concat(CONFIG.sky.stars.patterns.map((p) => ({ value: p.name, label: p.name })));
  fillChoice(sightTargetControlEl, targets, (value) => {
    sightTargetId = value;
    setChoice(sightTargetControlEl, value);
    resetSightSlider();
  });
  sightTargetsBuilt = true;
  setChoice(sightTargetControlEl, sightTargetId);
}

function saveCosmeticPrefs() {
  try { window.localStorage.setItem(COSMETICS.storageKey, JSON.stringify(cosmeticPrefs)); } catch (e) { /* cosmetic saving is optional */ }
}
function grantCosmeticUnlocks(count, silent) {
  const newly = [];
  const groups = [
    { list: COSMETICS.hulls, field: 'unlockedHulls' },
    { list: COSMETICS.trims, field: 'unlockedTrims' },
    { list: COSMETICS.patterns, field: 'unlockedPatterns' },
  ];
  groups.forEach((group) => group.list.forEach((item) => {
    if (count >= item.unlockAt && !cosmeticPrefs[group.field].includes(item.id)) {
      cosmeticPrefs[group.field].push(item.id);
      newly.push(item.label);
    }
  }));
  if (newly.length || silent) saveCosmeticPrefs();
  return newly;
}

function hexColor(color) { return '#' + Number(color).toString(16).padStart(6, '0'); }
function renderCosmeticChoices(container, items, selectedField, unlockField, colorSwatches) {

// ===== SETTINGS SHEET =====
// Fills a radio-style group with text options. Arrow keys move and select, as in a native radio group.
function fillChoice(container, options, onPick) {
  container.textContent = '';
  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-opt';
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', 'false');
    btn.dataset.value = opt.value;
    btn.textContent = opt.label;
    btn.tabIndex = -1;
    btn.addEventListener('click', () => onPick(opt.value));
    container.appendChild(btn);
  });
  container.addEventListener('keydown', (e) => {
    let step = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') step = 1;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') step = -1;
    if (step === 0) return;
    e.preventDefault();
    const items = Array.from(container.querySelectorAll('[role="radio"]'));
    const i = items.indexOf(document.activeElement);
    const next = items[(i + step + items.length) % items.length];
    next.focus();
    next.click();
  });
}

// Marks one option in a group as the chosen one.
function setChoice(container, value) {
  container.querySelectorAll('[role="radio"]').forEach((btn) => {
    const on = btn.dataset.value === value;
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    btn.tabIndex = on ? 0 : -1;
  });
}

// Makes every choice group match the real state of the app.
function syncSettings() {
  setChoice(qualityControlEl, String(qualityIndex));
  setChoice(timeControlEl, currentPreset);
  setChoice(weatherControlEl, weather.mode);
  setChoice(frameControlEl, showFrameRate ? 'on' : 'off');
  setChoice(soundControlEl, audio.on ? 'on' : 'off');
  setChoice(volumeControlEl, String(audio.volume));
  setChoice(reducedMotionControlEl, reducedMotionEnabled ? 'on' : 'off');
  setChoice(steeringModeControlEl, dragSteerEnabled ? 'drag' : 'split');
  if (languageStatusEl) languageStatusEl.textContent = 'English · translation-ready';
}

// Player picks a Graphics level. This ends the first-run check for good and saves the choice.
function chooseQuality(index) {

// Builds the choice groups from CONFIG.ui. Runs once at start-up.
function buildSettings() {
  const s = CONFIG.ui.settings;
  fillChoice(
    qualityControlEl,
    s.qualityLabels.map((label, i) => ({ value: String(i), label })),
    (v) => chooseQuality(Number(v))
  );
  fillChoice(
    timeControlEl,
    s.timeOrder.map((key) => ({ value: key, label: s.timeLabels[key] })),
    (v) => chooseTime(v)
  );
  fillChoice(
    weatherControlEl,
    s.weatherOrder.map((key) => ({ value: key, label: s.weatherLabels[key] })),
    (v) => chooseWeather(v)
  );
  fillChoice(
    frameControlEl,
    [{ value: 'off', label: s.off }, { value: 'on', label: s.on }],
    (v) => chooseFrameRate(v === 'on')
  );
  fillChoice(
    soundControlEl,
    [{ value: 'off', label: s.off }, { value: 'on', label: s.on }],
    (v) => chooseSound(v === 'on')
  );
  fillChoice(
    volumeControlEl,
    s.volumeLabels.map((label, i) => ({ value: String(i), label })),
    (v) => chooseVolume(Number(v))
  );
  fillChoice(reducedMotionControlEl, [{ value: 'off', label: s.off }, { value: 'on', label: s.on }], (v) => chooseReducedMotion(v === 'on'));
  fillChoice(steeringModeControlEl, [{ value: 'split', label: 'Split' }, { value: 'drag', label: 'Drag' }], (v) => chooseSteeringMode(v));
  document.documentElement.classList.toggle('reduced-motion-enabled', reducedMotionEnabled);
  if (!document.fullscreenEnabled) fullscreenRowEl.hidden = true;
  updateFullscreenLabel();
  syncSettings();
}

// Closes the settings sheet. Focus goes back to Menu unless restoreFocus is false.
function closeSettings(restoreFocus = true) {

  wakeHud();

// Keeps Tab inside the open sheet, cycling from last to first and back.
function trapFocus(e) {
  const items = Array.from(settingsSheetEl.querySelectorAll('button'))
    .filter((el) => el.tabIndex >= 0 && !el.disabled && !el.closest('[hidden]'));
  if (items.length === 0) return;
  const first = items[0];
  const last = items[items.length - 1];
  const inside = settingsSheetEl.contains(document.activeElement);
  if (e.shiftKey) {
    if (!inside || document.activeElement === first) {
      e.preventDefault();
      last.focus();
    }
  } else if (!inside || document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

// Escape closes the sheet. Tab is trapped while the sheet is open.
function onKeyDown(e) {
  if (!settingsOpen) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeSettings();
  } else if (e.key === 'Tab') {
    trapFocus(e);
  }
}

// Asks for landscape after full screen is on. Browsers that refuse are fine: the request is ignored.
function tryLockLandscape() {
  try {
    const orientation = window.screen && window.screen.orientation;
    if (!orientation || typeof orientation.lock !== 'function') return;
    const p = orientation.lock('landscape');
    if (p && p.catch) p.catch(() => {});
  } catch (e) {
    // Not supported here: ignore.
  }
}

// Enter or leave full screen. Only shown when the browser allows it.
function toggleFullscreen() {
  if (document.fullscreenElement) {
    const left = document.exitFullscreen();
    if (left && left.catch) left.catch(() => {});
    return;
  }
  const entered = document.documentElement.requestFullscreen();
  if (entered && entered.then) {
    entered.then(tryLockLandscape).catch(() => {});
  }
}

// Keeps the Fullscreen button text in step with the real state.
function updateFullscreenLabel() {
  fullscreenBtn.textContent = document.fullscreenElement ? CONFIG.ui.settings.exit : CONFIG.ui.settings.enter;
}

// ===== PHASE 8: SURVIVAL MODE =====
function clampSurvival(v) { return Math.max(0, Math.min(100, v)); }
function setSurvivalStatus(message, seconds = 6, notify = false) {
  survivalState.statusText = message || '';
  survivalState.statusUntil = survivalState.elapsed + seconds;
  survivalState.hudRecent = Math.max(survivalState.hudRecent, Math.min(seconds, 8));
  if (notify && message) showToast(message);
}
function damageSurvival(stat, amount, message, cooldown = 2.5) {
  if (gameMode !== 'survival' || !survivalState.active || !['hull', 'sails', 'water', 'provisions'].includes(stat)) return false;
  const now = survivalState.elapsed;
  if (now - (survivalState.lastHit[stat] || -999) < cooldown) return false;
  survivalState.lastHit[stat] = now;
  const before = survivalState[stat];
  survivalState[stat] = clampSurvival(before - amount);
  if (survivalState[stat] !== before) {
    survivalState.hudRecent = CONFIG.survival.hudRecentSeconds;
    setSurvivalStatus(message, 7, true);
    return true;
  }
  return false;
}
function resetSurvival() {
  survivalState.active = true; survivalState.elapsed = 0;
  survivalState.hull = 100; survivalState.sails = 100; survivalState.water = 100; survivalState.provisions = 100;
  survivalState.inventory = { driftwood: 2, cloth: 1, rope: 1 };
  survivalState.reefed = false; survivalState.completed = false;
  survivalState.rogueWait = mixJS(CONFIG.survival.rogueWaitMin, CONFIG.survival.rogueWaitMax, 0.38);
  survivalState.rogueTelegraph = 0; survivalState.hudRecent = CONFIG.survival.hudRecentSeconds;
  survivalState.hudTimer = 0; survivalState.hudBucket = {}; survivalState.lastHit = {};
  survivalState.statusText = ''; survivalState.statusUntil = 0; survivalState.inHaven = false; survivalState.inCalm = false;
  survivalState.currentKey = ''; survivalState.lastWaterLow = false; survivalState.lastProvisionsLow = false;
  survivalState.lastRainToast = 0; survivalState.lastDamage = 0;
  survivalObjectiveEl.hidden = false;
  survivalHudEl.hidden = false;
  setWeatherMode('changing');
  updateSurvivalHud(true);
  setSurvivalStatus(CONFIG.survival.text.objectiveHint, 7, false);
}
function disableSurvivalHud() {
  survivalState.active = false;
  survivalObjectiveEl.hidden = true;
  survivalHudEl.hidden = true;
  survivalRepairHullBtn.hidden = true; survivalRepairSailsBtn.hidden = true; survivalReefBtn.hidden = true;
}
function updateModeSelectionUI() {

  peacefulModeBtn.setAttribute('aria-pressed', isSurvival ? 'false' : 'true');
  survivalModeBtn.setAttribute('aria-pressed', isSurvival ? 'true' : 'false');
  difficultySelectEl.hidden = !isSurvival;

  Object.keys(buttons).forEach((key) => buttons[key].setAttribute('aria-pressed', key === survivalDifficulty ? 'true' : 'false'));

  }

  gameMode = mode;
  updateModeSelectionUI();
}
function selectSurvivalDifficulty(level) {

function updateSurvivalHud(force) {
  if (gameMode !== 'survival' || !survivalState.active) return;
  const S = CONFIG.survival, v = survivalState;
  const names = ['hull', 'sails', 'water', 'provisions'];
  let low = false;
  names.forEach((key) => {
    const el = survivalGaugeEls[key], value = clampSurvival(v[key]), rounded = Math.round(value);
    el.value.textContent = rounded + '%';
    el.bar.style.width = rounded + '%';
    el.bar.classList.toggle('is-warn', value <= 62 && value > 30);
    el.bar.classList.toggle('is-critical', value <= 30);
    if (value <= S.hudLow) low = true;
    // Wake the panel when a gauge crosses a 20-point bucket, but not every frame while it drains.
    const bucket = Math.floor(value / 20);
    if (v.hudBucket[key] !== undefined && bucket !== v.hudBucket[key]) v.hudRecent = S.hudRecentSeconds;
    v.hudBucket[key] = bucket;
  });
  const near = nav.near;
  const canUse = !!(ship.anchored && near && nav.nearD <= NAV.discoverRange);
  const repairAvailable = canUse && ((v.inventory.driftwood > 0 && v.hull < 99.5) || (v.inventory.cloth > 0 && v.inventory.rope > 0 && v.sails < 99.5));
  const sheltered = canUse && near.type === 1;
  const visible = low || v.hudRecent > 0 || repairAvailable || sheltered || wxNow.wind > 1.18 || wxNow.chop > 0.25;
  survivalHudEl.hidden = !visible;
  survivalDifficultyLabelEl.textContent = S.difficulties[survivalDifficulty].label;
  survivalInventoryEl.textContent = fmtText(S.text.inventory, { wood: v.inventory.driftwood, cloth: v.inventory.cloth, rope: v.inventory.rope });
  survivalRepairHullBtn.hidden = !(canUse && v.inventory.driftwood > 0 && v.hull < 99.5);
  survivalRepairSailsBtn.hidden = !(canUse && v.inventory.cloth > 0 && v.inventory.rope > 0 && v.sails < 99.5);
  survivalRepairHullBtn.disabled = !(canUse && v.inventory.driftwood > 0 && v.hull < 99.5);
  survivalRepairSailsBtn.disabled = !(canUse && v.inventory.cloth > 0 && v.inventory.rope > 0 && v.sails < 99.5);
  survivalRepairHullBtn.textContent = fmtText(S.text.repairHull, { n: v.inventory.driftwood });
  survivalRepairSailsBtn.textContent = fmtText(S.text.repairSails, { cloth: v.inventory.cloth, rope: v.inventory.rope });
  survivalReefBtn.hidden = !(wxNow.wind > 1.18 || wxNow.chop > 0.25 || v.reefed);
  survivalReefBtn.textContent = v.reefed ? S.text.shakeOut : S.text.reef;
  refreshSurvivalObjective();
  if (v.statusText && v.elapsed >= v.statusUntil) { v.statusText = ''; survivalStatusEl.textContent = ''; }
  else survivalStatusEl.textContent = v.statusText;
}
function refreshSurvivalObjective() {
  if (gameMode !== 'survival' || !survivalState.active) return;
  const S = CONFIG.survival, dx = S.goal.x - ship.x, dz = S.goal.z - ship.z;
  const dist = Math.hypot(dx, dz);
  const bearing = CONFIG.ui.compassNames[Math.round((((Math.atan2(dx, -dz) * 180 / Math.PI) % 360) + 360) % 360 / 45) % 8];
  const distance = dist >= 1000 ? (dist / 1000).toFixed(1) + ' km' : Math.round(dist) + ' m';
  survivalObjectiveTitleEl.textContent = S.text.objectiveTitle;
  survivalObjectiveMetaEl.textContent = survivalState.completed ? S.text.objectiveReached : fmtText(S.text.objectiveTo, { distance, bearing });
  survivalObjectiveHintEl.textContent = survivalState.completed ? S.text.objectiveEndless : S.text.objectiveHint;
}
function applySurvivalCurrent(dt) {
  if (!islands.length || ship.anchored) return;
  let target = null, best = Infinity;
  for (let i = 0; i < islands.length; i++) {
    const I = islands[i];
    if (I.type !== 5 || I.parent) continue;
    const d = Math.hypot(ship.x - I.cx, ship.z - I.cz);
    if (d < best) { best = d; target = I; }
  }
  const radius = CONFIG.survival.currentRadius;
  if (!target || best > radius) {
    if (survivalState.currentKey) setSurvivalStatus(CONFIG.survival.text.currentClear, 3, false);
    survivalState.currentKey = '';
    return;
  }
  if (survivalState.currentKey !== target.key) {
    survivalState.currentKey = target.key;
    setSurvivalStatus(CONFIG.survival.text.current, 6, true);
  }
  const dx = ship.x - target.cx, dz = ship.z - target.cz, d = Math.max(1, Math.hypot(dx, dz));
  const fall = 1 - best / radius, strength = CONFIG.survival.currentStrength * fall;
  // A gentle tangential pull plus a little outward push close to the stacks; never pulls into the rock.
  ship.x += (-dz / d * strength + (best < 58 ? dx / d * 1.2 : 0)) * dt;
  ship.z += ( dx / d * strength + (best < 58 ? dz / d * 1.2 : 0)) * dt;
}
function grantSurvivalSupplies(type) {
  if (gameMode !== 'survival' || !survivalState.active) return '';
  const v = survivalState, S = CONFIG.survival;
  if (type === 0) {
    v.provisions = clampSurvival(v.provisions + 18); v.inventory.driftwood += 1;
    setSurvivalStatus(S.text.supplyCay, 6, false); return S.text.supplyCay;
  }
  if (type === 1) {
    v.water = clampSurvival(v.water + 22); v.provisions = clampSurvival(v.provisions + 10);
    setSurvivalStatus(S.text.supplyAtoll, 6, false); return S.text.supplyAtoll;
  }
  if (type === 2) {
    v.inventory.rope += 1; v.inventory.cloth += 1;
    setSurvivalStatus(S.text.supplyLighthouse, 6, false); return S.text.supplyLighthouse;
  }
  if (type === 3) {
    v.water = clampSurvival(v.water + 24);
    setSurvivalStatus(S.text.supplyCliff, 6, false); return S.text.supplyCliff;
  }
  if (type === 4) {
    v.inventory.driftwood += 1; v.inventory.cloth += 1;
    setSurvivalStatus(S.text.supplyRuins, 6, false); return S.text.supplyRuins;
  }
  v.inventory.rope += 1; v.provisions = clampSurvival(v.provisions + 5);
  setSurvivalStatus(S.text.supplyArch, 6, false); return S.text.supplyArch;
}
function repairSurvivalHull() {
  const v = survivalState;
  if (gameMode !== 'survival' || !v.active || !ship.anchored || !nav.near || nav.nearD > NAV.discoverRange || v.inventory.driftwood < 1 || v.hull >= 99.5) return;
  v.inventory.driftwood--; v.hull = clampSurvival(v.hull + 30);
  setSurvivalStatus(CONFIG.survival.text.hullRepaired, 7, true); updateSurvivalHud(true);
}
function repairSurvivalSails() {
  const v = survivalState;
  if (gameMode !== 'survival' || !v.active || !ship.anchored || !nav.near || nav.nearD > NAV.discoverRange || v.inventory.cloth < 1 || v.inventory.rope < 1 || v.sails >= 99.5) return;
  v.inventory.cloth--; v.inventory.rope--; v.sails = clampSurvival(v.sails + 35);
  setSurvivalStatus(CONFIG.survival.text.sailsRepaired, 7, true); updateSurvivalHud(true);
}
function toggleReefedSails() {
  if (gameMode !== 'survival' || !survivalState.active) return;
  survivalState.reefed = !survivalState.reefed;
  setSurvivalStatus(survivalState.reefed ? CONFIG.survival.text.reefed : CONFIG.survival.text.sailWear, 6, true);
  updateSurvivalHud(true);
}
function updateSurvival(dt) {
  const v = survivalState, S = CONFIG.survival;
  if (gameMode !== 'survival' || !v.active || !sailing) return;
  v.elapsed += dt;
  const difficulty = S.difficulties[survivalDifficulty] || S.difficulties.calm;
  const drain = difficulty.drain;
  v.water = clampSurvival(v.water - S.waterDrain * drain * dt);
  v.provisions = clampSurvival(v.provisions - S.provisionsDrain * drain * dt);
  if (wxNow.rain > 0.08 && ship.speed > 1.0) {
    const gain = S.rainCollection * wxNow.rain * dt;
    v.water = clampSurvival(v.water + gain);
    if (v.elapsed - v.lastRainToast > 35 && gain > 0.01) {
      v.lastRainToast = v.elapsed;
      setSurvivalStatus(S.text.rainCaught, 4, false);
    }
  }
  const near = nav.near;
  const safeHaven = !!(ship.anchored && near && near.type === 1 && nav.nearD <= NAV.discoverRange);
  if (safeHaven) {
    v.hull = clampSurvival(v.hull + S.havenRepairHull * dt);
    v.sails = clampSurvival(v.sails + S.havenRepairSails * dt);
    v.water = clampSurvival(v.water + S.havenWater * dt);
    v.provisions = clampSurvival(v.provisions + S.havenProvisions * dt);
    if (!v.inHaven) setSurvivalStatus(S.text.haven, 7, true);
  } else if (v.inHaven) setSurvivalStatus(S.text.havenLeft, 3, false);
  v.inHaven = safeHaven;

  const inCalm = wind.strength < S.calmWindThreshold && !ship.anchored;
  if (inCalm && !v.inCalm) setSurvivalStatus(S.text.deadCalm, 6, true);
  else if (!inCalm && v.inCalm) setSurvivalStatus(S.text.windReturned, 4, false);
  v.inCalm = inCalm;

  if (!ship.anchored && wxNow.wind > 1.18 && ship.speed > 1) {
    const reefFactor = v.reefed ? 0.22 : 1;
    v.sails = clampSurvival(v.sails - Math.max(0, wxNow.wind - 1.12) * S.stormSailWear * reefFactor * drain * dt);
    if (!v.reefed && v.sails < 58 && v.elapsed > v.statusUntil) setSurvivalStatus(S.text.sailWear, 4, false);
  }

  // Rare rogue waves occur only in dangerous sea states; every strike is telegraphed first.
  const severeSea = wxNow.chop > 0.38 && wind.strength > 1.18;
  if (v.rogueTelegraph > 0) {
    v.rogueTelegraph -= dt;
    if (v.rogueTelegraph <= 0) {
      damageSurvival('hull', S.rogueHullDamage, S.text.rogueHit, 0);
      damageSurvival('sails', S.rogueSailDamage, S.text.rogueHit, 0);
      v.rogueWait = mixJS(S.rogueWaitMin, S.rogueWaitMax, 0.35 + Math.random() * 0.3);
    }
  } else if (severeSea) {
    v.rogueWait -= dt;
    if (v.rogueWait <= S.rogueTelegraph) {
      v.rogueTelegraph = S.rogueTelegraph;
      setSurvivalStatus(S.text.rogueWarning, S.rogueTelegraph + 1, true);
    }
  }
  // Threat cooldown pauses in calmer weather. Empty stores are a sustained warning, not a silent state.
  if (v.water <= 0 && !v.lastWaterLow) { v.lastWaterLow = true; setSurvivalStatus(S.text.waterLow, 8, true); }
  if (v.water > 10) v.lastWaterLow = false;
  if (v.provisions <= 0 && !v.lastProvisionsLow) { v.lastProvisionsLow = true; setSurvivalStatus(S.text.provisionsLow, 8, true); }
  if (v.provisions > 10) v.lastProvisionsLow = false;
  if ((v.water <= 0 || v.provisions <= 0) && v.elapsed - v.lastDamage >= 18) {
    v.lastDamage = v.elapsed;
    setSurvivalStatus(S.text.storesEmpty, 8, true);
  }

  const goalDist = Math.hypot(S.goal.x - ship.x, S.goal.z - ship.z);
  if (!v.completed && goalDist <= S.goal.radius + 165) {
    v.completed = true;
    setSurvivalStatus(S.text.objectiveEndless, 12, true);
    refreshSurvivalObjective();
  }

  v.hudRecent = Math.max(0, v.hudRecent - dt);
  v.hudTimer -= dt;
  if (v.hudTimer <= 0) { v.hudTimer = 0.3; updateSurvivalHud(false); }
}


peacefulModeBtn.addEventListener('click', () => selectGameMode('peaceful'));
survivalModeBtn.addEventListener('click', () => selectGameMode('survival'));
calmDifficultyBtn.addEventListener('click', () => selectSurvivalDifficulty('calm'));

// ===== AUTO GRAPHICS (first run only) =====
// Averages the frame rate for a few seconds after Start. If it is too low, Graphics drops one step, once.
function runAutoProbe(now) {
  if (!autoProbe) return;
  autoProbe.frames++;
  const elapsed = now - autoProbe.start;
  if (elapsed < CONFIG.ui.autoQualityWindowMs) return;
  const average = (autoProbe.frames * 1000) / elapsed;
  autoProbe = null;
  if (average < CONFIG.ui.autoQualityFps && qualityIndex > 0) {
    setQuality(qualityIndex - 1);
    prefs.quality = qualityIndex;
    savePrefs();
    syncSettings();
    showToast(CONFIG.ui.toastAutoQuality);
  }
}

// ===== PHOTO MODE =====
// Hides all UI and shows the photo buttons over a bottom scrim.
function enterPhotoMode() {
  if (photoMode) return;
  photoMode = true;
  clearTimeout(hudTimer);
  document.body.classList.add('is-photo');
  wakePhotoBar();
  photoSaveBtn.focus({ preventScroll: true });
}

// Leaves photo mode and brings the normal interface back.
function exitPhotoMode() {
  if (!photoMode) return;
  photoMode = false;
  clearTimeout(photoIdleTimer);
  document.body.classList.remove('is-photo', 'is-photo-idle');
  wakeHud();
  menuBtn.focus({ preventScroll: true });
}

function openPhotoMode() {
  closeSettings(false);
  closeShipCustomization(false);
  closeSight(false);
  enterPhotoMode();
}

// Shows the photo buttons and restarts their idle timer.
function wakePhotoBar() {
  document.body.classList.remove('is-photo-idle');
  clearTimeout(photoIdleTimer);
  photoIdleTimer = setTimeout(() => document.body.classList.add('is-photo-idle'), CONFIG.ui.photoIdleMs);
}

// Asks the render loop to save the next frame. The save happens right after render, in the same frame.
function savePhoto() {
  photoSaveRequested = true;
}

// File name in the form sea-YYYYMMDD-HHMMSS.png, using the local time.
function photoFileName() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
    + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  return CONFIG.ui.photoPrefix + '-' + stamp + '.png';
}

// Starts a file download for a blob, then tidies up the temporary link and address.
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ===== TITLE / START =====
// Makes the title interactive and brings in the heading tape; there is no separate loading screen.
function revealTitle() {
  setInert(titleEl, false);
  titleEl.classList.add('is-in');
  tapeMountEl.classList.add('is-in');
  tapeScrimEl.classList.add('is-in');
  updatePortraitHint();
}

// Fades the title out, removes it, shows the Menu button, and starts the first-run check if needed.
function startSailing() {
  if (sailing) return;
  sailing = true;
  if (gameMode === 'survival') resetSurvival(); else disableSurvivalHud();
  setInert(titleEl, true);
  setInert(menuBtn, false);
  setInert(journalBtn, false);
  setInert(atlasBtn, false);
  setInert(shipBtn, false);
  titleEl.classList.remove('is-in');
  titleEl.style.transitionDuration = CONFIG.ui.titleOutMs + 'ms';
  setTimeout(() => { titleEl.style.display = 'none'; }, CONFIG.ui.titleOutMs);
  updatePortraitHint();
  if (prefs.quality === null) autoProbe = { start: performance.now(), frames: 0 };
  enableChaseCamera();
  unlockAudio();
  wakeHud();
}

// ===== START-UP =====
// Everything here runs once, before the first frame. Saved values are already applied above.

buildCompassLetters();

setFrameRate(prefs.frameRate === true);

// ===== WIRE UP =====

menuBtn.addEventListener('focusin', wakeHud);
menuBtn.addEventListener('blur', wakeHud);
settingsScrimEl.addEventListener('click', () => closeSettings());
settingsCloseBtn.addEventListener('click', () => closeSettings());

document.addEventListener('fullscreenchange', updateFullscreenLabel);
photoOpenBtn.addEventListener('click', openPhotoMode);

photoDoneBtn.addEventListener('click', exitPhotoMode);
photoBarEl.addEventListener('focusin', wakePhotoBar);
window.addEventListener('pointermove', onActivity, { passive: true });
window.addEventListener('pointerdown', onActivity, { passive: true });
document.addEventListener('keydown', onKeyDown);

// ===== LOOP =====
let lastTime = performance.now();
let elapsedTime = 0;

// Coming back to the tab: restart the clock and the frame counters so the waves and readout do not jump.
function onVisibilityChange() {
  if (document.hidden) {
    steerInput.keyLeft = false; steerInput.keyRight = false; onSteerPointerUp();
    return;
  }
  const now = performance.now();
  lastTime = now;
  fpsFrames = 0;
  fpsLastTime = now;
  if (autoProbe) autoProbe = { start: now, frames: 0 };
}
document.addEventListener('visibilitychange', onVisibilityChange);

// Runs once per display frame: advance time, move the camera and grid, draw, save a photo if asked,
// update the heading tape, update the frame-rate readout and run the first-run check.
function frame(now) {
  requestAnimationFrame(frame);

  // Paused: nothing to draw while the tab is hidden or the picture is lost. Keep the clock in step.
  if (document.hidden || contextLost) {
    lastTime = now;
    return;
  }

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;  // clamp so a backgrounded tab does not make the waves jump

  elapsedTime += dt;
  timeUniform.value = elapsedTime;

  updateEnvironment(dt, false);
  updateShip(dt);
  updateAudio(dt);
  updateNavigator(dt);
  updateSurvival(dt);
  updatePlantUniforms();
  updateLandmarks(dt);
  updateWorld(dt, false);
  updateCamera(dt);
  followCamera();
  skyMesh.position.copy(camera.position);   // the sky dome travels with the camera, so it never runs out
  renderer.render(scene, camera);

  // Photo capture: must run right after render, in the same frame, or the drawing buffer is empty.
  if (photoSaveRequested) {
    photoSaveRequested = false;
    const name = photoFileName();
    renderer.domElement.toBlob((blob) => {
      if (!blob) {
        showToast(CONFIG.ui.toastPhotoFailed);
        return;
      }
      downloadBlob(blob, name);
      showToast(CONFIG.ui.toastPhotoSaved);
    }, 'image/png');
  }

  updateCompass();
  updateStarCompass(dt);
  updateFps(now);
  runAutoProbe(now);
  updateAdaptiveResolution(now);

}
// Set the sky, light and weather, then build the islands around the start, before the first frame.
updateEnvironment(0, true);
updateWorld(0, true);

// Test hook: a test page can set window.__windwardDebug = {} before load to look inside the game.
if (window.__windwardDebug && typeof window.__windwardDebug === 'object') {
  Object.assign(window.__windwardDebug, {
    camera: camera, scene: scene, renderer: renderer, ship: ship, followTarget: followTarget, islands: islands,
    setQuality: setQuality, updateWorld: updateWorld, islandBedAt: islandBedAt, waveHeightAt: waveHeightAt,
    startSailing: startSailing, updateShip: updateShip, planCell: planCell, lookTarget: lookTarget, oceanMaterial: oceanMaterial, islandMaterial: islandMaterial,
    shelterAtJS: shelterAtJS, getQuality: () => qualityIndex, plantMaterial: plantInstMaterial, groundH: groundH, sunDir: sunDir, lmNight: lmNight, lmBeams: lmBeams, lmBuoyList: lmBuoyList, setTimePreset: setTimePreset, horizonColor: horizonColor, topColor: topColor,
    env: env, weather: weather, wxNow: wxNow, startWeather: startWeather, setWeatherMode: setWeatherMode, skyMaterial: skyMaterial,
    moonDir: moonDir, lightColor: lightColor, wind: wind, updateEnvironment: updateEnvironment, getWaveScale: () => waveScale,
    audio: audio, updateAudio: updateAudio, playCreak: playCreak, updateSurf: updateSurf, playThunder: playThunder, getRig: () => shipRig, shipGroup: shipGroup,
    nav: nav, dropAnchor: dropAnchor, weighAnchor: weighAnchor, nearestShore: nearestShore, discover: discover, updateNavigator: updateNavigator, openJournal: openJournal, openAtlas: openAtlas, drawPattern: drawPattern, drawChart: drawChart, unlockAudio: unlockAudio, shoalDepth: shoalDepth, gameMode: () => gameMode, survivalState: survivalState, updateSurvival: updateSurvival, resetSurvival: resetSurvival, repairSurvivalHull: repairSurvivalHull, repairSurvivalSails: repairSurvivalSails, getReducedMotion: () => reducedMotionEnabled, getDragSteer: () => dragSteerEnabled,
  });
}
revealTitle();
requestAnimationFrame(frame);

})();
