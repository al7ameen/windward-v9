// ----- Mesh builder -----
// Collects triangles with the attributes the hull shader needs: normal, colour, material id, AO and UV.
function MB() {
  this.pos = []; this.nrm = []; this.col = []; this.mat = []; this.ao = []; this.uv = []; this.idx = [];
}
MB.prototype.vert = function (p, n, c, m, u, v, ao) {
  this.pos.push(p[0], p[1], p[2]);
  this.nrm.push(n[0], n[1], n[2]);
  this.col.push(c.r, c.g, c.b);
  this.mat.push(m);
  this.ao.push(ao === undefined ? 1 : ao);
  this.uv.push(u || 0, v || 0);
  return this.pos.length / 3 - 1;
};
MB.prototype.tri = function (a, b, c) { this.idx.push(a, b, c); };
MB.prototype.quad = function (a, b, c, d) { this.idx.push(a, b, c, a, c, d); };

// Flat four-corner face. The normal comes from the corners and is flipped to face the hint direction.
MB.prototype.flat = function (p0, p1, p2, p3, hint, c, m, uvs, ao) {
  const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
  const vx = p3[0] - p0[0], vy = p3[1] - p0[1], vz = p3[2] - p0[2];
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const nl = Math.hypot(nx, ny, nz);
  if (nl < 1e-9) { nx = hint[0]; ny = hint[1]; nz = hint[2]; }
  else { nx /= nl; ny /= nl; nz /= nl; }
  if (nx * hint[0] + ny * hint[1] + nz * hint[2] < 0) { nx = -nx; ny = -ny; nz = -nz; }
  const n = [nx, ny, nz];
  const t = uvs || [[0, 0], [1, 0], [1, 1], [0, 1]];
  const a = Array.isArray(ao) ? ao : [ao, ao, ao, ao];
  const i0 = this.vert(p0, n, c, m, t[0][0], t[0][1], a[0]);
  const i1 = this.vert(p1, n, c, m, t[1][0], t[1][1], a[1]);
  const i2 = this.vert(p2, n, c, m, t[2][0], t[2][1], a[2]);
  const i3 = this.vert(p3, n, c, m, t[3][0], t[3][1], a[3]);
  this.quad(i0, i1, i2, i3);
};

// A strip of flat quads between two matching polylines A and B.
MB.prototype.ribbon = function (A, B, hint, c, m, uvf, aoA, aoB) {
  for (let i = 0; i < A.length - 1; i++) {
    const uvs = uvf ? [uvf(A[i], 0), uvf(A[i + 1], 0), uvf(B[i + 1], 1), uvf(B[i], 1)] : null;
    const a0 = aoA === undefined ? 1 : aoA, b0 = aoB === undefined ? a0 : aoB;
    this.flat(A[i], A[i + 1], B[i + 1], B[i], hint, c, m, uvs, [a0, a0, b0, b0]);
  }
};

// Solid box between two corners. UVs are in metres on each face.
MB.prototype.box = function (x0, x1, y0, y1, z0, z1, c, m, ao) {
  const f = (p0, p1, p2, p3, h, uv) => this.flat(p0, p1, p2, p3, h, c, m, uv, ao === undefined ? 1 : ao);
  f([x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1], [1, 0, 0], [[z0, y0], [z0, y1], [z1, y1], [z1, y0]]);
  f([x0, y0, z1], [x0, y1, z1], [x0, y1, z0], [x0, y0, z0], [-1, 0, 0], [[z1, y0], [z1, y1], [z0, y1], [z0, y0]]);
  f([x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [0, 1, 0], [[x0, z0], [x0, z1], [x1, z1], [x1, z0]]);
  f([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0], [[x0, z0], [x1, z0], [x1, z1], [x0, z1]]);
  f([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], [0, 0, 1], [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
  f([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [0, 0, -1], [[x1, y0], [x0, y0], [x0, y1], [x1, y1]]);
};

// Round tapered tube from a to b with smooth normals. Radius r0 at a, r1 at b. cap closes the ends.
MB.prototype.tube = function (a, b, r0, r1, sides, c, m, cap) {
  const ax = b[0] - a[0], ay = b[1] - a[1], az = b[2] - a[2];
  const len = Math.hypot(ax, ay, az) || 1e-6;
  const dx = ax / len, dy = ay / len, dz = az / len;
  let ux, uy, uz;
  if (Math.abs(dy) < 0.9) { ux = -dz; uy = 0; uz = dx; } else { ux = 0; uy = dz; uz = -dy; }
  const ul = Math.hypot(ux, uy, uz) || 1;
  ux /= ul; uy /= ul; uz /= ul;
  const vx = dy * uz - dz * uy, vy = dz * ux - dx * uz, vz = dx * uy - dy * ux;
  const base = this.pos.length / 3;
  for (let s = 0; s <= sides; s++) {
    const ang = (s / sides) * Math.PI * 2;
    const cs = Math.cos(ang), sn = Math.sin(ang);
    const nx = cs * ux + sn * vx, ny = cs * uy + sn * vy, nz = cs * uz + sn * vz;
    this.vert([a[0] + nx * r0, a[1] + ny * r0, a[2] + nz * r0], [nx, ny, nz], c, m, s / sides * 2, 0);
    this.vert([b[0] + nx * r1, b[1] + ny * r1, b[2] + nz * r1], [nx, ny, nz], c, m, s / sides * 2, len);
  }
  for (let s = 0; s < sides; s++) {
    const i = base + s * 2;
    this.quad(i, i + 1, i + 3, i + 2);
  }
  if (cap) {
    for (const end of [0, 1]) {
      const cen = end ? b : a, r = end ? r1 : r0, nn = end ? [dx, dy, dz] : [-dx, -dy, -dz];
      const ci = this.vert(cen, nn, c, m, 0, 0);
      const first = this.pos.length / 3;
      for (let s = 0; s < sides; s++) {
        const ang = (s / sides) * Math.PI * 2;
        const cs = Math.cos(ang), sn = Math.sin(ang);
        this.vert([cen[0] + (cs * ux + sn * vx) * r, cen[1] + (cs * uy + sn * vy) * r, cen[2] + (cs * uz + sn * vz) * r], nn, c, m, 0, 0);
      }
      for (let s = 0; s < sides; s++) this.tri(ci, first + s, first + (s + 1) % sides);
    }
  }
};

// Low-poly ellipsoid with smooth normals.
MB.prototype.ball = function (cn, rx, ry, rz, seg, c, m) {
  const base = this.pos.length / 3;
  const lon = seg * 2;
  for (let i = 0; i <= seg; i++) {
    const th = (i / seg) * Math.PI;
    for (let j = 0; j <= lon; j++) {
      const ph = (j / lon) * Math.PI * 2;
      const nx = Math.sin(th) * Math.cos(ph), ny = Math.cos(th), nz = Math.sin(th) * Math.sin(ph);
      this.vert([cn[0] + nx * rx, cn[1] + ny * ry, cn[2] + nz * rz], [nx, ny, nz], c, m, j / lon, i / seg);
    }
  }
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < lon; j++) {
      const a = base + i * (lon + 1) + j;
      this.quad(a, a + lon + 1, a + lon + 2, a + 1);
    }
  }
};

// A rope: a thin three-sided prism.
MB.prototype.rope = function (a, b, r) { this.tube(a, b, r, r, 3, SHIP_COL.rope, M_ROPE, false); };

// Joins another builder's triangles onto this one.
MB.prototype.append = function (o) {
  const off = this.pos.length / 3;
  for (const k of ['pos', 'nrm', 'col', 'mat', 'ao', 'uv']) for (let i = 0; i < o[k].length; i++) this[k].push(o[k][i]);
  for (let i = 0; i < o.idx.length; i++) this.idx.push(o.idx[i] + off);
};

// Smooth normals over the whole builder, turned to point away from a centre (used for the hull shell).
MB.prototype.smooth = function (cx, cy, cz) {
  const pos = this.pos, nrm = this.nrm;
  nrm.fill(0);
  for (let t = 0; t < this.idx.length; t += 3) {
    const a = this.idx[t] * 3, b = this.idx[t + 1] * 3, c = this.idx[t + 2] * 3;
    const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
    const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
    for (const k of [a, b, c]) { nrm[k] += fx; nrm[k + 1] += fy; nrm[k + 2] += fz; }
  }
  for (let i = 0; i < nrm.length; i += 3) {
    let x = nrm[i], y = nrm[i + 1], z = nrm[i + 2];
    const l = Math.hypot(x, y, z) || 1;
    x /= l; y /= l; z /= l;
    if (x * (pos[i] - cx) + y * (pos[i + 1] - cy) + z * (pos[i + 2] - cz) < 0) { x = -x; y = -y; z = -z; }
    nrm[i] = x; nrm[i + 1] = y; nrm[i + 2] = z;
  }
};

MB.prototype.toGeometry = function () {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nrm, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
  g.setAttribute('aMat', new THREE.Float32BufferAttribute(this.mat, 1));
  g.setAttribute('aAO', new THREE.Float32BufferAttribute(this.ao, 1));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(this.uv, 2));
  g.setIndex(this.idx);
  return g;
};

// ----- Hull shape -----
// g runs from 0 (bow) to 1 (stern). v runs from 0 (keel) to 1 (deck edge). The bow is at +z.
function shipPlan(g) {
  if (g < 0.5) return Math.pow(Math.sin(SHIP_HALF_PI * (g / 0.5)), 0.78);
  return 1 + (SHIP.transomWidth - 1) * Math.pow((g - 0.5) / 0.5, 1.6);
}
function shipBowness(g) { return Math.pow(Math.max(0, 0.5 - g) * 2, 2); }
function shipDeckY(g) { return SHIP.freeboard + SHIP.sheer * Math.pow(Math.abs(g - 0.5) * 2, 2); }
// The keel rises towards the bow (forefoot cut-away) and a little at the stern.
function shipDraftAt(g) {
  const bow = Math.pow(Math.max(0, 1 - g / 0.28), 2) * SHIP.forefoot;
  const stern = Math.pow(Math.max(0, (g - 0.78) / 0.22), 2) * 0.3;
  return SHIP.draft * (1 - bow - stern);
}
function shipHalfAt(g, v) {
  const round = Math.pow(Math.sin(v * SHIP_HALF_PI), 1 - SHIP.bilge);
  const flare = 1 + SHIP.bowFlare * 0.4 * shipBowness(g) * v;
  const tumble = 1 - SHIP.tumblehome * Math.pow(v, 3);
  return SHIP_HALF_B * shipPlan(g) * round * flare * tumble;
}
function shipHeightAt(g, v) { const d = shipDraftAt(g); return -d + v * (shipDeckY(g) + d); }
function shipZ(g) { return SHIP_HALF_L - g * SHIP.length; }
// Raked stem at the bow and overhanging counter at the stern.
function shipZShift(g, v) {
  const bow = SHIP.stemRake * Math.pow(v, 1.6) * Math.pow(Math.max(0, 1 - g / 0.22), 2);
  const stern = SHIP.sternOverhang * Math.pow(v, 1.3) * Math.pow(Math.max(0, (g - 0.84) / 0.16), 2);
  return bow - stern;
}
function hullPoint(g, v, side) { return [side * shipHalfAt(g, v), shipHeightAt(g, v), shipZ(g) + shipZShift(g, v)]; }
// Half width of the hull at the waterline (y = 0), used for the foam ring.
function shipWaterHalf(g) {
  const d = shipDraftAt(g);
  return shipHalfAt(g, d / (shipDeckY(g) + d));
}
// Station position for a ship-frame z (inverse of shipZ, ignoring the small shifts).
function shipGAtZ(z) { return clamp01((SHIP_HALF_L - z) / SHIP.length); }


// ----- Mast layout -----
// Each mast stands on the deck, leaning aft by its rake. mastPt gives a point on it in ship coordinates:
// y is the distance up the mast, zo is an offset aft-ward (negative) or forward (positive) from its axis.
function makeMast(key) {
  const cfg = SHIP.masts[key];
  const g = cfg.at;
  return { key: key, cfg: cfg, z: shipZ(g), y: shipDeckY(g), rake: cfg.rake * SHIP_DEG, g: g };
}
const MAST_FORE = makeMast('fore');
const MAST_MAIN = makeMast('main');
function mastPt(m, y, zo, x) {
  zo = zo || 0;
  return [x || 0, m.y + y * Math.cos(m.rake) + zo * Math.sin(m.rake), m.z - y * Math.sin(m.rake) + zo * Math.cos(m.rake)];
}

// ----- Hull shell, deck and bulwarks -----
function buildHull(q, shell, body) {
  const n = q.shipSections, L = q.shipLevels;
  const hullC = SHIP_COL.hull;
  const rings = [];
  const edges = [];   // per station: deck edge points {g, deckY, P (port), S (starboard)}

  for (let i = 0; i < n; i++) {
    const g = i / (n - 1);
    const deckY = shipDeckY(g);
    const ring = [];
    const addV = (p) => ring.push(shell.vert(p, [p[0] < 0 ? -1 : 1, 0, 0], hullC, M_SHELL, p[2], deckY - p[1],
      0.7 + 0.3 * clamp01((p[1] + SHIP.draft) / SHIP.draft)));
    for (let j = L; j >= 0; j--) addV(hullPoint(g, j / L, PORT));
    for (let j = 1; j <= L; j++) addV(hullPoint(g, j / L, STBD));
    rings.push(ring);
    edges.push({ g: g, deckY: deckY, P: hullPoint(g, 1, PORT), S: hullPoint(g, 1, STBD) });
  }
  for (let i = 0; i < n - 1; i++) {
    const A = rings[i], B = rings[i + 1];
    for (let k = 0; k < A.length - 1; k++) shell.quad(A[k], A[k + 1], B[k + 1], B[k]);
  }

  // Raked transom: flat rows of planking across the stern.
  for (let j = 0; j < L; j++) {
    const v0 = j / L, v1 = (j + 1) / L;
    const a = hullPoint(1, v0, PORT), b = hullPoint(1, v1, PORT), c = hullPoint(1, v1, STBD), d = hullPoint(1, v0, STBD);
    const dy0 = shipDeckY(1) - a[1], dy1 = shipDeckY(1) - b[1];
    body.flat(a, b, c, d, [0, 0, -1], hullC, M_SHELL, [[a[0], dy0], [b[0], dy1], [c[0], dy1], [d[0], dy0]], 0.9);
  }

  // Deck: planks with a slight crown, five columns across.
  const C = 4, crown = 0.07;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const e = edges[i];
    const row = [];
    for (let c = 0; c <= C; c++) {
      const t = c / C;
      const x = e.P[0] + (e.S[0] - e.P[0]) * t;
      const y = e.deckY + crown * (1 - Math.pow(2 * t - 1, 2)) * clamp01(e.P[0] / 1.2);
      const edge = (c === 0 || c === C) ? 0.62 : (c === 1 || c === C - 1) ? 0.88 : 1;
      row.push(body.vert([x, y, e.P[2]], [0, 1, 0], SHIP_COL.deck, M_DECK, x, e.P[2], edge));
    }
    rows.push(row);
  }
  for (let i = 0; i < n - 1; i++) for (let c = 0; c < C; c++) body.quad(rows[i][c], rows[i][c + 1], rows[i + 1][c + 1], rows[i + 1][c]);

  // Bulwarks: outer face continues the hull paint, inner face is white, a varnished cap rail on top.
  const H = SHIP.bulwarkHeight, T = SHIP.bulwarkThickness;
  for (const side of [PORT, STBD]) {
    const key = side === PORT ? 'P' : 'S';
    const oB = [], oT = [], iB = [], iT = [], cO = [], cI = [], cOb = [];
    for (let i = 0; i < n; i++) {
      const E = edges[i][key];
      const xi = side * Math.max(Math.abs(E[0]) - T, 0);
      oB.push(E); oT.push([E[0], E[1] + H, E[2]]);
      iB.push([xi, E[1], E[2]]); iT.push([xi, E[1] + H, E[2]]);
      cOb.push([E[0] + side * 0.035, E[1] + H, E[2]]);
      cO.push([E[0] + side * 0.035, E[1] + H + 0.07, E[2]]);
      cI.push([xi - side * 0.035, E[1] + H + 0.07, E[2]]);
    }
    body.ribbon(oB, oT, [side, 0, 0], hullC, M_SHELL, (p, b) => [p[2], b ? -H : 0], 0.85, 1);
    body.ribbon(iB, iT, [-side, 0, 0], SHIP_COL.cabin, M_PAINT, null, 0.55, 0.95);
    body.ribbon(cOb, cO, [side, 0, 0], SHIP_COL.varnish, M_WOOD, null, 1);
    body.ribbon(cO, cI, [0, 1, 0], SHIP_COL.varnish, M_WOOD, null, 1);
    body.ribbon(oT, iT, [0, 1, 0], SHIP_COL.varnish, M_WOOD, null, 1);
  }
  // Taffrail across the stern.
  const eS = edges[n - 1];
  const sB = [eS.P, eS.S], sT = [[eS.P[0], eS.P[1] + H, eS.P[2]], [eS.S[0], eS.S[1] + H, eS.S[2]]];
  body.ribbon(sB, sT, [0, 0, -1], hullC, M_SHELL, (p, b) => [p[0], b ? -H : 0], 0.9, 1);
  body.ribbon(sT, [[sT[0][0], sT[0][1] + 0.07, sT[0][2]], [sT[1][0], sT[1][1] + 0.07, sT[1][2]]], [0, 0, -1], SHIP_COL.varnish, M_WOOD, null, 1);
  body.tube([sT[0][0], sT[0][1] + 0.075, sT[0][2] + 0.02], [sT[1][0], sT[1][1] + 0.075, sT[1][2] + 0.02], 0.055, 0.055, 5, SHIP_COL.varnish, M_WOOD, true);

  // Stem post, keel and wales: heavy timbers along the hull's centreline and sides.
  const stemBot = hullPoint(0, 0, 0), stemTop = hullPoint(0, 1, 0);
  body.tube(stemBot, [stemTop[0], stemTop[1] + H + 0.05, stemTop[2]], 0.1, 0.1, 6, SHIP_COL.varnish, M_WOOD, true);
  for (let i = 0; i < n - 1; i++) {
    const a = hullPoint(i / (n - 1), 0, 0), b = hullPoint((i + 1) / (n - 1), 0, 0);
    body.tube([a[0], a[1] - 0.02, a[2]], [b[0], b[1] - 0.02, b[2]], 0.09, 0.09, 5, SHIP_COL.keel, M_WOOD, false);
  }
  return edges;
}

// ----- Deck fittings -----
function deckAt(z) { return shipDeckY(shipGAtZ(z)); }

function buildCabin(body, q) {
  const cab = SHIP.cabin;
  const zA = shipZ(cab.start), zB = shipZ(cab.end);   // zA is the forward end
  const hw = cab.halfWidth, hgt = cab.height;
  const steps = 8;
  const zs = [];
  for (let i = 0; i <= steps; i++) zs.push(zA + (zB - zA) * (i / steps));
  for (const side of [PORT, STBD]) {
    const bot = zs.map((z) => [side * hw, deckAt(z) - 0.02, z]);
    const top = zs.map((z) => [side * hw, deckAt(z) + hgt, z]);
    body.ribbon(bot, top, [side, 0, 0], SHIP_COL.cabin, M_PAINT, (p) => [p[2], p[1]], 0.7, 1);
    // Varnished cap rail around the roof edge.
    const edge = zs.map((z) => [side * (hw + 0.02), deckAt(z) + hgt + 0.02, z]);
    for (let i = 0; i < steps; i++) body.tube(edge[i], edge[i + 1], 0.045, 0.045, 5, SHIP_COL.varnish, M_WOOD, false);
    // Windows: dark glass in varnished frames.
    for (let w = 0; w < cab.windows; w++) {
      const zc = zA + (zB - zA) * ((w + 0.5) / cab.windows);
      const y0 = deckAt(zc) + hgt * 0.38, y1 = y0 + cab.windowHeight;
      const x = side * (hw + 0.012);
      const z0 = zc + cab.windowWidth * 0.5, z1 = zc - cab.windowWidth * 0.5;
      body.flat([x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1], [side, 0, 0], SHIP_COL.glass, M_GLASS, null, 1);
      const fx = side * (hw + 0.02), f = 0.035;
      body.box(Math.min(fx, fx + side * 0.02), Math.max(fx, fx + side * 0.02), y1, y1 + f, z1 - f, z0 + f, SHIP_COL.varnish, M_WOOD);
      body.box(Math.min(fx, fx + side * 0.02), Math.max(fx, fx + side * 0.02), y0 - f, y0, z1 - f, z0 + f, SHIP_COL.varnish, M_WOOD);
      body.box(Math.min(fx, fx + side * 0.02), Math.max(fx, fx + side * 0.02), y0, y1, z1 - f, z1, SHIP_COL.varnish, M_WOOD);
      body.box(Math.min(fx, fx + side * 0.02), Math.max(fx, fx + side * 0.02), y0, y1, z0, z0 + f, SHIP_COL.varnish, M_WOOD);
    }
  }
  // Arched coach-roof: columns across, rows along the sheer.
  const cols = 6, rise = cab.roofRise;
  const roofRows = zs.map((z) => {
    const r = [];
    for (let c = 0; c <= cols; c++) {
      const t = c / cols, x = hw * (1 - 2 * t);
      r.push([x, deckAt(z) + hgt + rise * (1 - Math.pow(2 * t - 1, 2)), z]);
    }
    return r;
  });
  for (let i = 0; i < steps; i++) {
    for (let c = 0; c < cols; c++) {
      body.flat(roofRows[i][c], roofRows[i][c + 1], roofRows[i + 1][c + 1], roofRows[i + 1][c], [0, 1, 0], SHIP_COL.roof, M_WOOD,
        [[roofRows[i][c][0], roofRows[i][c][2]], [roofRows[i][c + 1][0], roofRows[i][c + 1][2]], [roofRows[i + 1][c + 1][0], roofRows[i + 1][c + 1][2]], [roofRows[i + 1][c][0], roofRows[i + 1][c][2]]], 1);
    }
  }
  // Forward and aft walls.
  for (const [z, hint] of [[zA, [0, 0, 1]], [zB, [0, 0, -1]]]) {
    const y0 = deckAt(z) - 0.02, y1 = deckAt(z) + hgt;
    body.flat([hw, y0, z], [hw, y1, z], [-hw, y1, z], [-hw, y0, z], hint, SHIP_COL.cabin, M_PAINT, null, 0.8);
  }
  // Companion door on the aft wall, with brass handles.
  const dz = zB - 0.012, dy0 = deckAt(zB) + 0.05, dy1 = dy0 + hgt * 0.78;
  body.flat([0.42, dy0, dz], [0.42, dy1, dz], [-0.42, dy1, dz], [-0.42, dy0, dz], [0, 0, -1], SHIP_COL.varnish, M_WOOD, [[0, 0], [0, 1], [1, 1], [1, 0]], 1);
  body.box(-0.03, 0.03, dy0, dy1, dz - 0.02, dz, SHIP_COL.trim, M_WOOD);
  if (q.props) {
    for (const x of [0.12, -0.12]) body.ball([x, dy0 + (dy1 - dy0) * 0.5, dz - 0.04], 0.03, 0.03, 0.03, 4, SHIP_COL.brass, M_BRASS);
    // Skylight on the roof.
    const zs2 = zA + (zB - zA) * 0.4, ys = deckAt(zs2) + hgt + rise;
    body.box(-0.38, 0.38, ys, ys + 0.14, zs2 - 0.45, zs2 + 0.45, SHIP_COL.varnish, M_WOOD);
    body.flat([0.3, ys + 0.15, zs2 - 0.38], [0.3, ys + 0.15, zs2 + 0.38], [-0.3, ys + 0.15, zs2 + 0.38], [-0.3, ys + 0.15, zs2 - 0.38], [0, 1, 0], SHIP_COL.glass, M_GLASS, null, 1);
    // Life ring on the starboard cabin side.
    const zr = zB + 0.6, yr = deckAt(zr) + hgt * 0.55, xr = STBD * (hw + 0.07);
    for (let k = 0; k < 12; k++) {
      const a0 = (k / 12) * Math.PI * 2, a1 = ((k + 1) / 12) * Math.PI * 2;
      body.tube([xr, yr + Math.sin(a0) * 0.3, zr + Math.cos(a0) * 0.3], [xr, yr + Math.sin(a1) * 0.3, zr + Math.cos(a1) * 0.3],
        0.065, 0.065, 5, k % 3 === 0 ? SHIP_COL.flag : SHIP_COL.cabin, M_CLOTH, false);
    }
  }
}

function buildHatches(body, q) {
  for (const h of SHIP.hatches) {
    const zc = shipZ(h.at), y = shipDeckY(h.at);
    const x0 = -h.width / 2, x1 = h.width / 2, z0 = zc - h.length / 2, z1 = zc + h.length / 2, hh = 0.2, t = 0.08;
    body.box(x0, x1, y, y + hh, z0, z0 + t, SHIP_COL.varnish, M_WOOD);
    body.box(x0, x1, y, y + hh, z1 - t, z1, SHIP_COL.varnish, M_WOOD);
    body.box(x0, x0 + t, y, y + hh, z0 + t, z1 - t, SHIP_COL.varnish, M_WOOD);
    body.box(x1 - t, x1, y, y + hh, z0 + t, z1 - t, SHIP_COL.varnish, M_WOOD);
    body.flat([x1 - t, y + hh - 0.03, z0 + t], [x1 - t, y + hh - 0.03, z1 - t], [x0 + t, y + hh - 0.03, z1 - t], [x0 + t, y + hh - 0.03, z0 + t],
      [0, 1, 0], SHIP_COL.varnish, M_GRATE, [[0, 0], [0, h.length * 3], [h.width * 3, h.length * 3], [h.width * 3, 0]], 0.8);
  }
}

function buildHelm(body, q) {
  const hm = SHIP.helm;
  const z = shipZ(hm.at) + shipZShift(hm.at, 1) * 0.3;
  const y0 = shipDeckY(hm.at);
  const hubY = y0 + 1.0;
  body.tube([0, y0, z + 0.15], [0, hubY - 0.05, z + 0.15], 0.14, 0.1, 8, SHIP_COL.varnish, M_WOOD, true);
  body.ball([0, hubY, z + 0.08], 0.09, 0.09, 0.09, 6, SHIP_COL.brass, M_BRASS);
  const segs = 14, r = hm.radius, wz = z + 0.04;
  for (let k = 0; k < segs; k++) {
    const a0 = (k / segs) * Math.PI * 2, a1 = ((k + 1) / segs) * Math.PI * 2;
    body.tube([Math.cos(a0) * r, hubY + Math.sin(a0) * r, wz], [Math.cos(a1) * r, hubY + Math.sin(a1) * r, wz], 0.03, 0.03, 5, SHIP_COL.varnish, M_WOOD, false);
  }
  for (let k = 0; k < hm.spokes; k++) {
    const a = (k / hm.spokes) * Math.PI * 2;
    body.tube([0, hubY, wz], [Math.cos(a) * r * 1.22, hubY + Math.sin(a) * r * 1.22, wz], 0.022, 0.03, 4, SHIP_COL.varnish, M_WOOD, true);
  }
  // Binnacle with a compass.
  body.box(-0.16, 0.16, y0, y0 + 0.55, z - 0.55, z - 0.25, SHIP_COL.varnish, M_WOOD);
  body.ball([0, y0 + 0.62, z - 0.4], 0.14, 0.1, 0.14, 6, SHIP_COL.glass, M_GLASS);
}

function buildBow(body, q, edges) {
  const bs = SHIP.bowsprit;
  const rootZ = SHIP_HALF_L - 1.3;
  const root = [0, deckAt(rootZ) + 0.28, rootZ];
  const tip = [0, deckAt(rootZ) + 0.28 + bs.height + 0.35, SHIP_HALF_L + bs.length];
  body.tube([root[0], root[1], root[2] - 1.2], tip, 0.14, 0.07, 8, SHIP_COL.varnish, M_WOOD, true);
  SHIP_BOWSPRIT.tip = tip; SHIP_BOWSPRIT.root = root;
  body.ball(tip, 0.08, 0.08, 0.08, 5, SHIP_COL.brass, M_BRASS);
  // Bobstay and whisker stays.
  const waterStem = hullPoint(0, 0.35, 0);
  body.rope(tip, [waterStem[0], waterStem[1] + 0.3, waterStem[2] + 0.1], 0.018);
  const railY = deckAt(root[2] - 1.3) + SHIP.bulwarkHeight;
  const hw = shipHalfAt(shipGAtZ(root[2] - 1.3), 1);
  for (const s of [PORT, STBD]) body.rope(tip, [s * hw, railY, root[2] - 1.3], 0.014);

  if (!q.props) return;
  // Windlass and bitts on the foredeck.
  const wz = SHIP_HALF_L - 1.75, wy = deckAt(wz);
  body.tube([-0.85, wy + 0.5, wz], [0.85, wy + 0.5, wz], 0.16, 0.16, 8, SHIP_COL.varnish, M_WOOD, true);
  body.tube([-0.7, wy, wz], [-0.7, wy + 0.5, wz], 0.08, 0.08, 5, SHIP_COL.varnish, M_WOOD, false);
  body.tube([0.7, wy, wz], [0.7, wy + 0.5, wz], 0.08, 0.08, 5, SHIP_COL.varnish, M_WOOD, false);
  for (const x of [-0.88, 0.88]) body.ball([x, wy + 0.5, wz], 0.12, 0.12, 0.12, 5, SHIP_COL.brass, M_BRASS);
  body.tube([0.5, wy + 0.5, wz], [0.5, wy + 0.5 + 0.55, wz], 0.025, 0.025, 4, SHIP_COL.brass, M_BRASS, true);
  // Two barrels with iron hoops.
  for (const [bx, bz] of [[STBD * 1.0, wz - 0.9], [STBD * 1.0, wz - 1.55]]) {
    const by = deckAt(bz);
    body.tube([bx, by, bz], [bx, by + 0.28, bz], 0.28, 0.34, 10, SHIP_COL.barrel, M_WOOD, false);
    body.tube([bx, by + 0.28, bz], [bx, by + 0.56, bz], 0.34, 0.28, 10, SHIP_COL.barrel, M_WOOD, true);
    for (const hy of [0.1, 0.46]) body.tube([bx, by + hy, bz], [bx, by + hy + 0.03, bz], 0.32 + (hy < 0.2 ? 0 : 0.0), 0.32, 10, SHIP_COL.trim, M_BRASS, false);
  }
  // Anchor hanging on the starboard bow.
  const ap = hullPoint(0.1, 0.85, STBD);
  const ax = ap[0] - 0.12, ay = ap[1] - 0.5, az = ap[2];
  body.tube([ax, ay + 0.9, az], [ax, ay - 0.5, az], 0.04, 0.04, 5, SHIP_COL.iron, M_BRASS, true);
  body.tube([ax - 0.04, ay + 0.75, az - 0.35], [ax - 0.04, ay + 0.75, az + 0.35], 0.03, 0.03, 4, SHIP_COL.iron, M_BRASS, true);
  body.tube([ax, ay - 0.5, az], [ax, ay - 0.35, az - 0.4], 0.035, 0.02, 4, SHIP_COL.iron, M_BRASS, true);
  body.tube([ax, ay - 0.5, az], [ax, ay - 0.35, az + 0.4], 0.035, 0.02, 4, SHIP_COL.iron, M_BRASS, true);
  body.tube([ax, ay + 0.9, az], [ap[0] + 0.15, ap[1] + 0.3, ap[2]], 0.025, 0.025, 4, SHIP_COL.varnish, M_WOOD, false);
  // Navigation lamps on the rails: red to port, green to starboard.
  const lz = SHIP_HALF_L - 3.4, ly = deckAt(lz) + SHIP.bulwarkHeight + 0.2;
  const lhw = shipHalfAt(shipGAtZ(lz), 1);
  body.ball([PORT * lhw, ly, lz], 0.09, 0.11, 0.09, 5, SHIP_COL.lampRed, M_LAMP);
  body.ball([STBD * lhw, ly, lz], 0.09, 0.11, 0.09, 5, SHIP_COL.lampGreen, M_LAMP);
  // Stern lantern on a post.
  const sz = -SHIP_HALF_L - 0.2, sy = shipDeckY(1) + SHIP.bulwarkHeight;
  body.tube([0, sy, sz + 0.1], [0, sy + 0.55, sz + 0.1], 0.03, 0.03, 4, SHIP_COL.brass, M_BRASS, true);
  body.ball([0, sy + 0.66, sz + 0.1], 0.11, 0.14, 0.11, 5, SHIP_COL.lamp, M_LAMP);
}
const SHIP_BOWSPRIT = { tip: null, root: null };

// Name board across the stern, filled from the canvas texture.
function buildNameBoard(body) {
  const v0 = 0.74, v1 = 0.9;
  const mk = (v, s) => {
    const p = hullPoint(1, v, 0);
    return [s * 1.2, p[1], p[2] - 0.012];
  };
  const a = mk(v0, PORT), b = mk(v1, PORT), c = mk(v1, STBD), d = mk(v0, STBD);
  body.flat(a, b, c, d, [0, 0, -1], SHIP_COL.cabin, M_NAME, [[0, 0], [0, 1], [1, 1], [1, 0]], 1);
  const f = 0.04, ft = [a, b, c, d];
  for (let i = 0; i < 4; i++) {
    const p = ft[i], r = ft[(i + 1) % 4];
    body.tube([p[0], p[1], p[2] - 0.01], [r[0], r[1], r[2] - 0.01], f, f, 4, SHIP_COL.brass, M_BRASS, false);
  }
}


// ----- Sails -----
// One sail is a subdivided quad. Corners: p00 (tack, bottom of the luff), p10 (clew), p01 (top of the luff), p11 (peak).
// Extra attributes let the shader bulge the cloth and lean its normal to match, so it looks like real cloth.
function sailGeometry(p00, p10, p01, p11, divs, billow, code) {
  const pos = [], uv = [], tu = [], tv = [], dim = [], bil = [], flg = [], idx = [];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const nrm = (a, f) => { const l = len(a); return l < 1e-5 ? f : [a[0] / l, a[1] / l, a[2] / l]; };
  const foot = sub(p10, p00), head = sub(p11, p01), luff = sub(p01, p00), leech = sub(p11, p10);
  const W = (len(foot) + len(head)) / 2, Hh = (len(luff) + len(leech)) / 2;
  const fu = nrm(foot, [0, 0, -1]), fv = nrm(luff, [0, 1, 0]);
  for (let j = 0; j <= divs; j++) {
    const v = j / divs;
    for (let i = 0; i <= divs; i++) {
      const u = i / divs;
      const b = lerp3(p00, p10, u), t = lerp3(p01, p11, u);
      const p = lerp3(b, t, v);
      pos.push(p[0], p[1], p[2]);
      uv.push(u, v);
      const du = nrm(lerp3(foot, head, v), fu), dv = nrm(lerp3(luff, leech, u), fv);
      tu.push(du[0], du[1], du[2]); tv.push(dv[0], dv[1], dv[2]);
      dim.push(W, Hh); bil.push(billow); flg.push(code);
    }
  }
  const row = divs + 1;
  for (let j = 0; j < divs; j++) for (let i = 0; i < divs; i++) {
    const a = j * row + i, b = a + 1, c = a + row, d = c + 1;
    idx.push(a, c, d, a, d, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const n = []; for (let i = 0; i < pos.length / 3; i++) n.push(1, 0, 0);
  g.setAttribute('normal', new THREE.Float32BufferAttribute(n, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aTU', new THREE.Float32BufferAttribute(tu, 3));
  g.setAttribute('aTV', new THREE.Float32BufferAttribute(tv, 3));
  g.setAttribute('aDim', new THREE.Float32BufferAttribute(dim, 2));
  g.setAttribute('aBillow', new THREE.Float32BufferAttribute(bil, 1));
  g.setAttribute('aFlag', new THREE.Float32BufferAttribute(flg, 1));
  g.setIndex(idx);
  return g;
}
function sailMesh(p00, p10, p01, p11, divs, billow, code) {
  const m = new THREE.Mesh(sailGeometry(p00, p10, p01, p11, divs, billow, code), shipSailMaterial);
  m.frustumCulled = false;
  return m;
}

// ----- Masts, booms and gaffs -----
// Builds one mast with its sheeted boom, gaff, mainsail and topsail. The mast group leans aft; the sheet group
// inside it turns about the mast to trim the sails to the wind.
function buildMast(m, q) {
  const c = m.cfg, h = c.height, top = c.topmast, sides = q.shipSides;
  const group = new THREE.Group();
  group.position.set(0, m.y, m.z);
  group.rotation.x = -m.rake;

  const st = new MB();
  const mastC = SHIP_COL.mast;
  st.tube([0, -0.4, 0], [0, h, 0], SHIP.masts.radius, SHIP.masts.radius * 0.62, sides, mastC, M_WOOD, true);
  st.tube([0, h - 1.4, 0.03], [0, h + top, 0.03], 0.085, 0.035, sides, mastC, M_WOOD, true);
  st.tube([0, h - 0.4, 0], [0, h + 0.14, 0], 0.13, 0.13, sides, SHIP_COL.trim, M_WOOD, true);
  st.tube([0, -0.05, 0], [0, 0.34, 0], SHIP.masts.radius * 1.6, SHIP.masts.radius * 1.2, sides, SHIP_COL.trim, M_WOOD, true);
  // Crosstrees: spreaders out to each side and trestle trees fore and aft.
  const cy = h - 0.35;
  st.tube([-0.8, cy, 0], [0.8, cy, 0], 0.04, 0.04, 5, SHIP_COL.varnish, M_WOOD, true);
  st.tube([0, cy - 0.04, -0.4], [0, cy - 0.04, 0.4], 0.04, 0.04, 5, SHIP_COL.varnish, M_WOOD, true);
  // Truck on the top with a brass ball.
  st.ball([0, h + top + 0.08, 0.03], 0.07, 0.09, 0.07, 5, SHIP_COL.brass, M_BRASS);
  st.tube([0, h + top, 0.03], [0, h + top + 0.45, 0.03], 0.02, 0.01, 4, SHIP_COL.brass, M_BRASS, true);
  const boomH = c.boomHeight, rise = c.boom * SHIP.boomRise, throatH = h * c.throatShare;
  if (q.props) {
    // Hoops around the mast, where the luff of the sail is laced on.
    for (let y = boomH + 0.45; y < throatH - 0.3; y += 0.85) {
      const r = SHIP.masts.radius * (1 - 0.38 * y / h) + 0.045;
      for (let k = 0; k < 8; k++) {
        const a0 = (k / 8) * Math.PI * 2, a1 = ((k + 1) / 8) * Math.PI * 2;
        st.tube([Math.cos(a0) * r, y, Math.sin(a0) * r], [Math.cos(a1) * r, y, Math.sin(a1) * r], 0.016, 0.016, 3, SHIP_COL.trim, M_WOOD, false);
      }
    }
    // Belaying pins on a ring rail around the foot of the mast.
    for (let k = 0; k < 8; k++) {
      const a0 = (k / 8) * Math.PI * 2, a1 = ((k + 1) / 8) * Math.PI * 2, r = 0.34;
      st.tube([Math.cos(a0) * r, 0.78, Math.sin(a0) * r], [Math.cos(a1) * r, 0.78, Math.sin(a1) * r], 0.035, 0.035, 4, SHIP_COL.varnish, M_WOOD, false);
      st.tube([Math.cos(a0) * r, 0.62, Math.sin(a0) * r], [Math.cos(a0) * r, 0.95, Math.sin(a0) * r], 0.022, 0.022, 4, SHIP_COL.brass, M_BRASS, false);
    }
  }
  const mastMesh = new THREE.Mesh(st.toGeometry(), shipHullMaterial);
  mastMesh.frustumCulled = false;
  group.add(mastMesh);

  // Sheet group: boom, gaff, lifts and both sails.
  const sheet = new THREE.Group();
  group.add(sheet);
  const sb = new MB();
  const boomEnd = [0, boomH + rise, -c.boom];
  sb.tube([0, boomH, -0.2], boomEnd, 0.085, 0.055, sides, SHIP_COL.varnish, M_WOOD, true);
  sb.ball([0, boomH, -0.2], 0.1, 0.1, 0.1, 5, SHIP_COL.brass, M_BRASS);
  const gaffEnd = [0, throatH + c.gaffRise, -c.gaff];
  sb.tube([0, throatH, -0.2], gaffEnd, 0.065, 0.04, sides, SHIP_COL.varnish, M_WOOD, true);
  sb.ball(boomEnd, 0.07, 0.07, 0.07, 4, SHIP_COL.brass, M_BRASS);
  sb.ball(gaffEnd, 0.06, 0.06, 0.06, 4, SHIP_COL.brass, M_BRASS);
  sb.rope(boomEnd, [0, h - 0.5, -0.15], 0.014);                         // topping lift
  sb.rope([0, throatH + c.gaffRise * 0.8, -c.gaff * 0.8], [0, h - 0.1, -0.2], 0.012);   // peak halyard
  sb.rope([0, throatH + 0.1, -0.22], [0, h - 0.1, -0.12], 0.012);
  const sheetMesh = new THREE.Mesh(sb.toGeometry(), shipHullMaterial);
  sheetMesh.frustumCulled = false;
  sheet.add(sheetMesh);

  const divs = q.sailDivisions;
  sheet.add(sailMesh([0, boomH + 0.1, -0.22], [0, boomH + rise + 0.12, -c.boom + 0.12],
    [0, throatH - 0.06, -0.22], [0, throatH + c.gaffRise - 0.06, -c.gaff + 0.12], divs, SHIP.sails.billow[m.key], 0));
  sheet.add(sailMesh([0, throatH + 0.14, -0.2], [0, throatH + c.gaffRise + 0.14, -c.gaff + 0.2],
    [0, h + top - 0.3, -0.12], [0, h + top - 0.3, -0.12], Math.max(4, Math.round(divs * 0.7)), SHIP.sails.billow.top, 0));
  return { group: group, sheet: sheet };
}

// A headsail: a triangle hung from a stay. Its group turns about the stay to trim the sail.
function buildHeadsail(tack, head, clew, divs, billow) {
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const d = sub(head, tack), dl = Math.hypot(d[0], d[1], d[2]);
  const Y = [d[0] / dl, d[1] / dl, d[2] / dl];
  const Z = [0, -Y[2], Y[1]];   // X cross Y, with X = (1, 0, 0)
  const q = sub(clew, tack);
  const cl = [0, Y[0] * q[0] + Y[1] * q[1] + Y[2] * q[2], Z[1] * q[1] + Z[2] * q[2]];
  const group = new THREE.Group();
  group.position.set(tack[0], tack[1], tack[2]);
  group.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(new THREE.Vector3(1, 0, 0), new THREE.Vector3(Y[0], Y[1], Y[2]), new THREE.Vector3(Z[0], Z[1], Z[2])));
  const pivot = new THREE.Group();
  group.add(pivot);
  pivot.add(sailMesh([0, 0, 0], cl, [0, dl, 0], [0, dl, 0], divs, billow, 2));
  return { group: group, pivot: pivot };
}

// ----- Standing rigging, built into the ship-frame mesh -----
function buildRigging(body, q) {
  const H = SHIP.bulwarkHeight;
  for (const m of [MAST_FORE, MAST_MAIN]) {
    const c = m.cfg, h = c.height, top = c.topmast;
    const cy = h - 0.35;
    for (const s of [PORT, STBD]) {
      const g = shipGAtZ(m.z);
      const cx = s * (shipHalfAt(g, 1) + 0.02), cyy = shipDeckY(g) + H + 0.02;
      const lines = [];
      for (const k of [-1, 0, 1]) {
        const tip = mastPt(m, cy, k * 0.18, s * 0.8);
        const chain = [cx, cyy, m.z + k * 0.5];
        body.rope(tip, chain, 0.02);
        lines.push([tip, chain]);
        body.ball(chain, 0.05, 0.05, 0.05, 4, SHIP_COL.brass, M_BRASS);
      }
      for (let r = 1; r <= q.ratlines; r++) {
        const t = 0.1 + 0.8 * r / (q.ratlines + 1);
        body.tube(lerp3(lines[0][1], lines[0][0], t), lerp3(lines[2][1], lines[2][0], t), 0.012, 0.012, 3, SHIP_COL.rope, M_ROPE, false);
      }
      body.rope(mastPt(m, h + top - 0.55, 0, 0), mastPt(m, cy, 0, s * 0.8), 0.014);
    }
  }
  // Stays: fore topmast to the bowsprit tip, fore mast to the stem, main topmast to the foremast.
  const tip = SHIP_BOWSPRIT.tip;
  const foreTop = mastPt(MAST_FORE, MAST_FORE.cfg.height + MAST_FORE.cfg.topmast - 0.3, 0.06);
  body.rope(foreTop, tip, 0.02);
  const stayZ = SHIP_HALF_L - 0.9;
  const stayTack = [0, deckAt(stayZ) + SHIP.bulwarkHeight + 0.25, stayZ];
  body.tube([0, deckAt(stayZ), stayZ], stayTack, 0.05, 0.04, 5, SHIP_COL.varnish, M_WOOD, true);
  body.ball(stayTack, 0.07, 0.07, 0.07, 4, SHIP_COL.brass, M_BRASS);
  body.rope(mastPt(MAST_FORE, MAST_FORE.cfg.height - 0.4, 0.14), stayTack, 0.018);
  body.rope(mastPt(MAST_MAIN, MAST_MAIN.cfg.height + MAST_MAIN.cfg.topmast - 0.3, 0.06), mastPt(MAST_FORE, MAST_FORE.cfg.height - 0.9, 0.1), 0.018);
  return { stayTack: stayTack, foreTop: foreTop };
}

// ----- Flags -----
function flagMesh(len, hgt, tri) {
  return sailMesh([0, 0, 0], [0, tri ? hgt / 2 : 0, -len], [0, hgt, 0], tri ? [0, hgt / 2, -len] : [0, hgt, -len], 5, 0, 1);
}

// ----- Name board texture -----
let shipNameTex = null;
function makeNameTexture() {
  if (shipNameTex) return shipNameTex;
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#10283a'; cx.fillRect(0, 0, 512, 128);
  cx.strokeStyle = '#d9b25a'; cx.lineWidth = 4; cx.strokeRect(8, 8, 496, 112);
  cx.fillStyle = '#e8c872'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  let size = 64;
  const text = String(CONFIG.ui.title).toUpperCase().split('').join(' ');
  cx.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif';
  while (cx.measureText(text).width > 440 && size > 20) { size -= 4; cx.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif'; }
  cx.fillText(text, 256, 68);
  shipNameTex = new THREE.CanvasTexture(cv);
  shipNameTex.anisotropy = 4;
  return shipNameTex;
}


// ----- Shaders -----
// Sail vertex shader: the cloth bulges away from the wind when filled, flaps when it is pointed into the wind,
// and the normal is tilted to match the bulge so the shading follows the curve.
const SAIL_VERT = `
  attribute float aBillow;
  attribute float aFlag;
  attribute vec2 aUV;
  attribute vec3 aTU;
  attribute vec3 aTV;
  attribute vec2 aDim;
  uniform float uTime;
  uniform vec2 uWindDir;
  uniform float uWindStrength;
  uniform float uSailDepth;
  uniform float uFlutter;
  uniform float uFlagFlutter;
  varying vec3 vN;
  varying vec3 vW;
  varying vec2 vUV;
  varying vec2 vDim;
  varying float vFlag;
  varying float vFill;

  void main() {
    const float PI = 3.14159265;
    vec3 nL = normal;
    vec3 n = normalize(mat3(modelMatrix) * nL);
    vec3 W = normalize(vec3(uWindDir.x, 0.0, uWindDir.y));
    float facing = dot(n, W);
    float fill = smoothstep(0.06, 0.45, abs(facing));
    float side = facing >= 0.0 ? 1.0 : -1.0;
    bool isFlag = aFlag > 0.5 && aFlag < 1.5;

    float bu = sin(PI * aUV.x), bv = sin(PI * aUV.y);
    float dbu = PI * cos(PI * aUV.x), dbv = PI * cos(PI * aUV.y);
    float amp = isFlag ? 0.0 : aBillow * uSailDepth * uWindStrength * fill;
    float D = side * amp * bu * bv;
    float sU = side * amp * dbu * bv / max(aDim.x, 0.3);
    float sV = side * amp * bu * dbv / max(aDim.y, 0.3);

    // Gentle flutter all the time, a quick flap when the sail is luffing.
    float ph = uTime * 1.3 + aUV.y * 2.5 + aUV.x * 1.7;
    float luff = (1.0 - fill) * aBillow;
    float flapAmp = (uFlutter * 0.25 + luff * uFlutter * 3.0) * bu * (0.3 + 0.7 * aUV.x);
    D += flapAmp * sin(ph * (1.0 + luff * 1.6));
    sU += flapAmp * 1.6 * cos(ph * (1.0 + luff * 1.6)) / max(aDim.x, 0.3);

    if (isFlag) {
      float fa = uFlagFlutter * (0.1 + 0.9 * aUV.x) * (0.4 + uWindStrength);
      float wph = uTime * 4.0 - aUV.x * 6.0;
      D += fa * sin(wph) * 0.5;
      sU += fa * (0.1 + 0.9 * aUV.x) * -6.0 * cos(wph) * 0.5 / max(aDim.x, 0.3);
    }

    vec3 pl = position + nL * D;
    vec3 nn = normalize(nL - aTU * sU - aTV * sV);
    vec4 wp = modelMatrix * vec4(pl, 1.0);
    vW = wp.xyz;
    vN = normalize(mat3(modelMatrix) * nn);
    vUV = aUV;
    vDim = aDim;
    vFlag = aFlag;
    vFill = fill;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const SAIL_FRAG = SKY_CHUNK + `
  uniform vec3 uSailColour;
  uniform vec3 uFlagColour;
  uniform vec3 uPatternAccent;
  uniform float uSailPattern;
  uniform float uFlagPattern;
  uniform float uDetail;
  varying vec3 vN;
  varying vec3 vW;
  varying vec2 vUV;
  varying vec2 vDim;
  varying float vFlag;
  varying float vFill;

  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float lineMask(float s, float w) {
    float aa = fwidth(s) * 1.2;
    float e = min(fract(s), 1.0 - fract(s));
    return (1.0 - smoothstep(w, w + aa + 0.015, e)) * (1.0 - smoothstep(0.3, 0.9, aa));
  }

  void main() {
    vec3 n = normalize(vN);
    if (!gl_FrontFacing) n = -n;
    vec3 V = normalize(cameraPosition - vW);
    vec3 L = uLightDir;
    vec2 m = vUV * vDim;
    bool isFlag = vFlag > 0.5 && vFlag < 1.5;
    vec3 base = uSailColour;

    if (isFlag) {
      // Palestinian flag: green top stripe, white middle stripe, black bottom stripe,
      // and a red hoist-side triangle. Colours are specified in linear RGB for this shader.
      float fy = vUV.y;
      base = fy > (2.0 / 3.0)
        ? vec3(0.0, 0.195, 0.048)
        : (fy > (1.0 / 3.0) ? vec3(1.0, 1.0, 1.0) : vec3(0.0, 0.0, 0.0));
      float redExtent = (2.0 / 3.0) * min(fy, 1.0 - fy);
      if (vUV.x <= redExtent) base = vec3(0.62, 0.0056, 0.0194);
    } else {
      // Cloth panels, stitched seams, reef bands, boltrope border and corner patches.
      float pc = vFlag > 1.5 ? m.y : m.x;
      float pid = floor(pc / 0.62);
      float seam = lineMask(pc / 0.62, 0.012);
      base *= 0.94 + 0.08 * h21(vec2(pid, 1.7));
      float stitch = step(0.5, fract((vFlag > 1.5 ? m.x : m.y) * 9.0));
      base *= 1.0 - seam * (0.07 + 0.05 * stitch);
      float edge = min(min(m.x, vDim.x - m.x), min(m.y, vDim.y - m.y));
      float border = 1.0 - smoothstep(0.035, 0.07, edge);
      base = mix(base, base * vec3(0.78, 0.68, 0.52), border);
      if (vFlag < 0.5) {
        float reef = lineMask(vUV.y * vDim.y / 0.9 + 0.2, 0.02) * step(vUV.y, 0.62);
        base *= 1.0 - reef * 0.08;
      }
      float cd = min(min(max(m.x, m.y), max(vDim.x - m.x, m.y)), min(max(m.x, vDim.y - m.y), max(vDim.x - m.x, vDim.y - m.y)));
      float cpatch = 1.0 - smoothstep(0.42, 0.46, cd);
      base *= 1.0 - cpatch * 0.07;
      if (uDetail > 1.5) base *= 0.97 + 0.03 * sin(m.x * 180.0) * sin(m.y * 180.0) * (1.0 - smoothstep(4.0, 14.0, length(cameraPosition - vW)));
    }

    // Cosmetic motifs are analytic shader patterns: woven stripes, an eight-point geometric star,
    // or a radial rosette. They never use external texture assets or creature-shaped symbols.
    float patternStyle = isFlag ? 0.0 : uSailPattern; // keep the Palestinian flag design clear; patterns apply to sails only.
    if (patternStyle > 0.5) {
      float motif = 0.0;
      if (patternStyle < 1.5) {
        float stripe = abs(fract(vUV.x * 6.0) - 0.5);
        motif = 1.0 - smoothstep(0.035, 0.095, stripe);
      } else {
        vec2 tile = fract(vUV * vec2(4.0, 3.0)) - 0.5;
        float radius = length(tile);
        float angle = atan(tile.y, tile.x);
        float targetRadius = patternStyle < 2.5
          ? 0.28 + 0.10 * cos(4.0 * angle)
          : 0.25 + 0.085 * cos(8.0 * angle);
        float petals = 1.0 - smoothstep(0.018, 0.055, abs(radius - targetRadius));
        float ring = 1.0 - smoothstep(0.018, 0.05, abs(radius - 0.43));
        motif = max(petals, ring * 0.55);
      }
      base = mix(base, uPatternAccent, motif * 0.72);
    }

    base *= 1.0 - 0.18 * uWet;   // wet cloth is darker
    float ndl = dot(n, L);
    float lit = max(ndl, 0.0);
    float through = max(-ndl, 0.0) * 0.6;
    vec3 skyAmb = mix(uHorizonColor, uTopColor, 0.4) * 0.6;
    float sunUp = 1.0;
    vec3 sunC = uLightColor;
    float behind = pow(max(dot(-V, L), 0.0), 3.0) * 0.4;
    float fold = 1.0 - 0.14 * (1.0 - vFill);
    vec3 light = skyAmb * 0.9 + sunC * (lit * 0.85 + through * vec3(1.0, 0.9, 0.75).r + behind) * sunUp;
    vec3 col = base * light * fold;
    gl_FragColor = vec4(finishColor(col), 1.0);
  }
`;

const SHIP_VERT = `

  attribute float aAO;
  attribute vec2 aUV;
  varying vec3 vN;
  varying vec3 vW;
  varying vec3 vL;
  varying vec3 vCol;

const SHIP_HULL_FRAG = SKY_CHUNK + `
  uniform sampler2D uNameTex;
  uniform float uDetail;
  uniform float uTime;
  varying vec3 vN;
  varying vec3 vW;
  varying vec3 vL;
  varying vec3 vCol;
  varying float vMat;
  varying float vAO;
  varying vec2 vUV;

  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  float lineMask(float s, float w) {
    float aa = fwidth(s) * 1.2;
    float e = min(fract(s), 1.0 - fract(s));
    return (1.0 - smoothstep(w, w + aa + 0.015, e)) * (1.0 - smoothstep(0.3, 0.9, aa));
  }

  // One lighting model for every surface: hemisphere ambient, wrapped sun, a restrained GGX microfacet
  // highlight, the established Blinn accent, and the same procedural sky reflection used by the environment.
  vec3 lightSurf(vec3 base, vec3 N, float shin, float specAmt, float f0, float refl, float ao, vec3 tint) {
    vec3 V = normalize(cameraPosition - vW);
    vec3 L = uLightDir;
    float sunUp = 1.0;
    float ndl = dot(N, L);
    float wrap = clamp((ndl + 0.2) / 1.2, 0.0, 1.0);
    vec3 skyAmb = mix(uHorizonColor, uTopColor, 0.45) * 0.6;
    vec3 sea = vec3(0.03, 0.11, 0.14) + uHorizonColor * 0.08;
    vec3 amb = mix(sea, skyAmb, N.y * 0.5 + 0.5);
    vec3 sunC = uLightColor;
    vec3 col = base * (amb * ao * 1.3 + sunC * wrap * wrap * 0.95 * sunUp * (0.55 + 0.45 * ao));
    vec3 H = normalize(L + V);
    float ndv = max(dot(N, V), 0.0);
    float ndlPos = max(ndl, 0.0);
    float ndh = max(dot(N, H), 0.0);
    float vdh = max(dot(V, H), 0.0);

    // Convert the existing shininess control into perceptual roughness, then use GGX/Trowbridge-Reitz.
    // Blend it gently with the original highlight so the schooner's established material palette is preserved.
    float roughness = clamp(sqrt(2.0 / (shin + 2.0)), 0.08, 0.82);
    float alpha = roughness * roughness;
    float alpha2 = alpha * alpha;
    float dTerm = ndh * ndh * (alpha2 - 1.0) + 1.0;
    float distribution = alpha2 / max(3.14159265 * dTerm * dTerm, 0.0001);
    float geomK = (roughness + 1.0);
    geomK = geomK * geomK * 0.125;
    float geomV = ndv / max(ndv * (1.0 - geomK) + geomK, 0.0001);
    float geomL = ndlPos / max(ndlPos * (1.0 - geomK) + geomK, 0.0001);
    float fresnelDirect = f0 + (1.0 - f0) * pow(1.0 - vdh, 5.0);
    float ggx = distribution * geomV * geomL * fresnelDirect / max(4.0 * ndv * ndlPos, 0.001);
    float blinn = pow(ndh, shin) * (shin + 8.0) / 40.0;
    float specular = mix(blinn, ggx * roughness * 0.30, 0.28);
    col += sunC * specular * specAmt * sunUp * ndlPos * tint;
    float F = f0 + (1.0 - f0) * pow(1.0 - ndv, 5.0);
    vec3 R = reflect(-V, N);
    vec3 rc = R.y > 0.0 ? skyColor(R) : mix(sea * 1.5, uHorizonColor * 0.45, exp(R.y * 4.0));
    col += rc * F * refl * ao * tint;
    col += skyAmb * pow(1.0 - ndv, 3.0) * 0.1;
    return col;
  }

  void main() {
    vec3 N = normalize(vN);
    int m = int(vMat + 0.5);
    vec3 base = vCol;
    vec3 tint = vec3(1.0);
    float shin = 40.0, spec = 0.4, f0 = 0.04, refl = 0.2;
    float ao = vAO;
    bool detail = uDetail > 0.5;

    if (m == 0) {
      // Hull planking and paint: copper below, boot-top band, topsides, cream stripe and gilt line.
      float d = vUV.y;
      float y = vL.y;
      float s = d / 0.2;
      float pid = floor(s);
      float seam = detail ? lineMask(s, 0.018) : 0.0;
      float joint = detail ? lineMask(vUV.x / 2.1 + h21(vec2(pid, 3.1)) * 3.0, 0.006) * 0.6 : 0.0;
      float cop = 1.0 - smoothstep(-0.2, -0.1, y);
      float boot = smoothstep(-0.2, -0.1, y) * (1.0 - smoothstep(0.14, 0.2, y));
      float stripe = smoothstep(0.38, 0.4, d) * (1.0 - smoothstep(0.6, 0.62, d));
      float gilt = smoothstep(0.65, 0.67, d) * (1.0 - smoothstep(0.69, 0.71, d));
      vec3 copper = vec3(0.42, 0.13, 0.05);
      float patina = detail ? vnoise(vec2(vUV.x * 1.4, y * 2.0)) : 0.5;
      copper = mix(copper, vec3(0.09, 0.2, 0.15), smoothstep(0.55, 0.9, patina) * 0.55);
      float plate = detail ? lineMask(vUV.x / 0.9, 0.02) + lineMask(y / 0.45, 0.02) : 0.0;
      base = mix(base, vec3(0.9, 0.82, 0.62), stripe);
      base = mix(base, vec3(0.85, 0.6, 0.18), gilt);
      base = mix(base, vec3(0.12, 0.014, 0.01), boot);
      base = mix(base, copper * (1.0 - 0.25 * clamp(plate, 0.0, 1.0)), cop);
      base *= 1.0 - (seam * 0.22 + joint * 0.12) * (1.0 - cop);
      float wet = 1.0 - smoothstep(0.0, 1.1, y + 0.12 * vnoise(vec2(vUV.x * 1.5, uTime * 0.6)));
      base *= 1.0 - 0.28 * wet;
      shin = mix(90.0, 130.0, wet); spec = mix(1.0, 1.6, wet) * (1.0 - cop * 0.4); f0 = mix(0.05, 0.08, wet) + cop * 0.12;
      refl = mix(0.5, 0.8, wet) * (1.0 - cop * 0.35);
      tint = mix(vec3(1.0), copper * 2.2, cop);
      if (detail) { N = normalize(N + vec3(0.0, (seam - 0.5 * joint) * 0.0, 0.0)); }
    } else if (m == 1) {
      // Scrubbed deck planks.
      float s = vUV.x / 0.21;
      float pid = floor(s);
      float seam = lineMask(s, 0.03);
      float joint = lineMask(vUV.y / 1.9 + h21(vec2(pid, 5.0)) * 4.0, 0.012) * 0.8;
      float grain = detail ? vnoise(vec2(vUV.x * 22.0, vUV.y * 1.3)) : 0.5;
      base *= (0.88 + 0.22 * h21(vec2(pid, 7.3))) * (0.92 + 0.14 * grain);
      base *= 1.0 - 0.5 * clamp(seam + joint, 0.0, 1.0);
      base *= 1.0 - 0.38 * uWet;
      shin = mix(14.0, 70.0, uWet); spec = 0.15 + 0.6 * uWet; refl = 0.05 + 0.35 * uWet;
    } else if (m == 2) {
      // Varnished wood.
      float gr = detail ? vnoise(vec2(vL.x * 34.0 + vL.z * 34.0, vL.y * 5.0 + vL.z * 5.0)) : 0.5;
      base *= 0.86 + 0.28 * gr;
      shin = 70.0; spec = 1.0; f0 = 0.045; refl = 0.42;
    } else if (m == 3) {
      // White paint.
      shin = 40.0; spec = 0.5 + 0.4 * uWet; refl = 0.15 + 0.2 * uWet;
    } else if (m == 4) {
      // Brass and iron.
      shin = 90.0; spec = 1.6; f0 = 0.45; refl = 0.85; tint = mix(vec3(1.0), vCol * 2.0, 0.7);
    } else if (m == 5) {
      // Glass: dark, with strong sky reflection.
      shin = 120.0; spec = 1.4; f0 = 0.14; refl = 1.1; base *= 0.5;
    } else if (m == 6) {
      // Rope.
      base *= 0.82 + 0.3 * vnoise(vec2(vL.x * 50.0 + vL.z * 50.0, vL.y * 50.0));
      shin = 6.0; spec = 0.04; refl = 0.0;
    } else if (m == 7) {
      base = texture2D(uNameTex, vUV).rgb;
      base *= base;
      shin = 50.0; spec = 0.7; refl = 0.15;
    } else if (m == 8) {
      float night = 1.0 - smoothstep(0.02, 0.35, uSunDir.y);
      vec3 em = base * (0.5 + 2.6 * night);
      gl_FragColor = vec4(finishColor(em), 1.0);
      return;
    } else if (m == 9) {
      vec2 c = vUV * 2.0;
      float bars = step(0.28, fract(c.x)) * step(0.28, fract(c.y));
      base = mix(vec3(0.01), base, bars);
      shin = 30.0; spec = 0.3 * bars; refl = 0.0;
    } else {
      shin = 14.0; spec = 0.1; refl = 0.03;
    }
    gl_FragColor = vec4(finishColor(lightSurf(base, N, shin, spec, f0, refl, ao, tint)), 1.0);
  }
`;

// ----- Foam shaders: the wake ribbon, the foam ring around the hull and the bow spray -----
const FOAM_NOISE = `
  float fh(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float fn(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(fh(i), fh(i + vec2(1.0, 0.0)), f.x), mix(fh(i + vec2(0.0, 1.0)), fh(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  float ffbm(vec2 p) { return fn(p) * 0.55 + fn(p * 2.3 + 7.1) * 0.3 + fn(p * 5.1 + 3.3) * 0.15; }
  vec3 foamLit(vec3 c) {
    return c * min(uHorizonColor * 0.55 + uTopColor * 0.1 + uLightColor * 0.45, vec3(1.15));
  }
`;

// The wake: one continuous ribbon of five columns, laid behind the stern. Noise breaks it into foam patches.
const WAKE_VERT = `
  attribute vec2 aUV;
  attribute float aAmp;
  varying vec2 vUV;
  varying float vAmp;
  varying vec3 vW;
  void main() {
    vUV = aUV;
    vAmp = aAmp;
    vW = position;
    gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
  }
`;
const WAKE_FRAG = SKY_CHUNK + FOAM_NOISE + `
  uniform vec3 uFoamColour;
  uniform float uTime;
  varying vec2 vUV;
  varying float vAmp;
  varying vec3 vW;
  void main() {
    float x = abs(vUV.x), age = vUV.y;
    float core = pow(max(1.0 - x, 0.0), 1.5);
    float arm = exp(-pow((x - 0.8) / 0.16, 2.0)) * (1.0 - age * 0.6);
    vec2 p = vW.xz * 0.9;
    float nz = ffbm(p + vec2(0.0, uTime * 0.12));
    float cutoff = 0.32 + 0.3 * age;
    float mask = smoothstep(cutoff, cutoff + 0.28, nz);
    float foam = (core * 0.85 + arm * 0.7) * (0.25 + 0.95 * mask) * pow(1.0 - age, 1.3);
    float a = clamp(foam * vAmp, 0.0, 1.0);
    gl_FragColor = vec4(finishColor(foamLit(uFoamColour)), a);
  }
`;
const SPRAY_VERT = `

    vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
    vec3 wp = position + (right * aCorner.x + up * aCorner.y) * aSize;
    vC = aCorner;
    vA = aAlpha;
    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }
`;
const SPRAY_FRAG = SKY_CHUNK + FOAM_NOISE + `
  uniform vec3 uFoamColour;
  varying vec2 vC;
  varying float vA;
  void main() {
    float d = length(vC);
    float a = (1.0 - smoothstep(0.35, 1.0, d)) * vA;
    gl_FragColor = vec4(finishColor(foamLit(uFoamColour)), a);
  }
`;
const WASH_VERT = `
  attribute vec2 aInfo;
  varying vec2 vInfo;
  varying vec3 vL;
  void main() {
    vInfo = aInfo;
    vL = position;
    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
  }
`;
const WASH_FRAG = SKY_CHUNK + FOAM_NOISE + `
  uniform vec3 uFoamColour;
  uniform float uTime;
  uniform float uSpeed;
  varying vec2 vInfo;
  varying vec3 vL;
  void main() {
    float x = vInfo.x, w = vInfo.y;
    vec2 p = vec2(vL.z * 1.4 + uTime * 0.7, vL.x * 2.2);
    float nz = ffbm(p) * 0.6 + ffbm(p * 1.9 - uTime * 0.9) * 0.4;
    float edge = pow(1.0 - x, 1.5);
    float foam = edge * w * (0.3 + 0.7 * smoothstep(0.3, 0.7, nz)) * (0.55 + 0.45 * uSpeed) * 1.5;
    float shade = (1.0 - smoothstep(0.0, 0.55, x)) * 0.32;
    vec3 col = mix(vec3(0.01, 0.045, 0.055), foamLit(uFoamColour), clamp(foam * 1.4, 0.0, 1.0));
    gl_FragColor = vec4(finishColor(col), clamp(foam + shade * (1.0 - foam), 0.0, 0.95));
  }
`;

const wakeCfg = SHIP.wake;
const wakeStrips = wakeCfg.segments;
const wakeRows = wakeStrips + 1;
const WAKE_COLS = 5;
const wakeLifeDist = wakeStrips * wakeCfg.spacing;
const wakePos = new Float32Array(wakeRows * WAKE_COLS * 3);
const wakeUV = new Float32Array(wakeRows * WAKE_COLS * 2);
const wakeAmp = new Float32Array(wakeRows * WAKE_COLS);
const wakeIdx = [];
for (let r = 0; r < wakeRows - 1; r++) for (let c = 0; c < WAKE_COLS - 1; c++) {
  const a = r * WAKE_COLS + c, b = a + 1, d = a + WAKE_COLS, e = d + 1;
  wakeIdx.push(a, d, e, a, e, b);
}
const stripX = new Float32Array(wakeStrips);
const stripZ = new Float32Array(wakeStrips);
const stripRX = new Float32Array(wakeStrips);
const stripRZ = new Float32Array(wakeStrips);
const stripDist = new Float32Array(wakeStrips).fill(-1);
let wakeHead = 0, travelled = 0, lastStripDist = 0;

const wakeGeo = new THREE.BufferGeometry();
const wakePosAttr = new THREE.BufferAttribute(wakePos, 3);
const wakeUVAttr = new THREE.BufferAttribute(wakeUV, 2);
const wakeAmpAttr = new THREE.BufferAttribute(wakeAmp, 1);
for (const a of [wakePosAttr, wakeUVAttr, wakeAmpAttr]) a.setUsage(THREE.DynamicDrawUsage);
wakeGeo.setAttribute('position', wakePosAttr);
wakeGeo.setAttribute('aUV', wakeUVAttr);
wakeGeo.setAttribute('aAmp', wakeAmpAttr);
wakeGeo.setIndex(wakeIdx);
const wakeMaterial = new THREE.ShaderMaterial({
  vertexShader: WAKE_VERT, fragmentShader: WAKE_FRAG,
  uniforms: Object.assign(sharedSkyUniforms(), { uFoamColour: { value: SHIP_COL.foam }, uTime: timeUniform }),
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
});
const wakeMesh = new THREE.Mesh(wakeGeo, wakeMaterial);
wakeMesh.frustumCulled = false;

// Bow and hull spray: soft billboard droplets.
const sprayPerSide = wakeCfg.sprayPerSide;
const sprayN = sprayPerSide * 2;
const sprayPos = new Float32Array(sprayN * 4 * 3);
const sprayCorner = new Float32Array(sprayN * 4 * 2);
const spraySize = new Float32Array(sprayN * 4);
const sprayAlpha = new Float32Array(sprayN * 4);
const sprayIdx = [];
for (let i = 0; i < sprayN; i++) {
  const b = i * 4;
  sprayCorner.set([-1, -1, 1, -1, 1, 1, -1, 1], i * 8);
  sprayIdx.push(b, b + 1, b + 2, b, b + 2, b + 3);
}
const sprayGeo = new THREE.BufferGeometry();
const sprayPosAttr = new THREE.BufferAttribute(sprayPos, 3);
const spraySizeAttr = new THREE.BufferAttribute(spraySize, 1);
const sprayAlphaAttr = new THREE.BufferAttribute(sprayAlpha, 1);
for (const a of [sprayPosAttr, spraySizeAttr, sprayAlphaAttr]) a.setUsage(THREE.DynamicDrawUsage);
sprayGeo.setAttribute('position', sprayPosAttr);
sprayGeo.setAttribute('aCorner', new THREE.BufferAttribute(sprayCorner, 2));
sprayGeo.setAttribute('aSize', spraySizeAttr);
sprayGeo.setAttribute('aAlpha', sprayAlphaAttr);
sprayGeo.setIndex(sprayIdx);
const sprayMesh = new THREE.Mesh(sprayGeo, new THREE.ShaderMaterial({
  vertexShader: SPRAY_VERT, fragmentShader: SPRAY_FRAG,
  uniforms: Object.assign(sharedSkyUniforms(), { uFoamColour: { value: SHIP_COL.foam } }),
  transparent: true, depthWrite: false,
}));
sprayMesh.frustumCulled = false;
scene.add(sprayMesh);

// Foam ring and contact shadow around the waterline, attached to the ship.
const washMaterial = new THREE.ShaderMaterial({
  vertexShader: WASH_VERT, fragmentShader: WASH_FRAG,
  uniforms: Object.assign(sharedSkyUniforms(), { uFoamColour: { value: SHIP_COL.foam }, uTime: timeUniform, uSpeed: { value: 0 } }),
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
});
function buildWashRing(q) {
  const n = q.shipSections;
  const inner = [], outer = [], info = [];
  const pt = (g, s) => {
    const hw = shipWaterHalf(g), z = shipZ(g) + shipZShift(g, 0.3), bow = shipBowness(g);
    const spread = 0.4 + 1.0 * bow + 0.6 * clamp01((g - 0.78) / 0.22);
    return {
      i: [s * Math.max(hw - 0.15, 0), 0.05, z],
      o: [s * (hw + spread), 0.05, z + 0.6 * bow],
      w: 0.55 + 0.9 * bow + 0.5 * clamp01((g - 0.85) / 0.15),
    };
  };
  for (let i = 0; i < n; i++) { const p = pt(i / (n - 1), PORT); inner.push(p.i); outer.push(p.o); info.push(p.w); }
  for (let i = n - 1; i >= 0; i--) { const p = pt(i / (n - 1), STBD); inner.push(p.i); outer.push(p.o); info.push(p.w); }
  const pos = [], inf = [], idx = [];
  for (let i = 0; i < inner.length; i++) {
    pos.push(inner[i][0], inner[i][1], inner[i][2], outer[i][0], outer[i][1], outer[i][2]);
    inf.push(0, info[i], 1, info[i]);
  }
  const N = inner.length;
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = a + 1, c = ((i + 1) % N) * 2, d = c + 1;
    idx.push(a, b, d, a, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aInfo', new THREE.Float32BufferAttribute(inf, 2));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, washMaterial);
  m.frustumCulled = false;
  m.renderOrder = 1;
  return m;
}

// ----- The ship group and its meshes -----
const shipGroup = new THREE.Group();
scene.add(shipGroup);
let shipRig = null;

function disposeTree(o) { o.traverse((c) => { if (c.geometry) c.geometry.dispose(); }); }

// Builds the whole ship. Called once at start-up and again when the graphics level changes.
function buildShipMeshes() {
  const q = currentQuality();
  while (shipGroup.children.length) {
    const c = shipGroup.children[0];
    shipGroup.remove(c);
    disposeTree(c);
  }
  shipHullMaterial.uniforms.uNameTex.value = makeNameTexture();
  shipHullMaterial.uniforms.uDetail.value = q.shipDetail;
  shipSailMaterial.uniforms.uDetail.value = q.shipDetail;

  const shell = new MB(), body = new MB();
  const edges = buildHull(q, shell, body);
  shell.smooth(0, 0.3, 0);
  buildCabin(body, q);
  buildHatches(body, q);
  buildHelm(body, q);
  buildBow(body, q, edges);
  buildNameBoard(body);
  const rig = buildRigging(body, q);
  // Ensign staff, leaning aft over the taffrail.
  const sy = shipDeckY(1) + SHIP.bulwarkHeight + 0.08, sz = -SHIP_HALF_L - SHIP.sternOverhang + 0.1;
  const staffTop = [0, sy + 1.6, sz - 0.5];
  body.tube([0, sy, sz], staffTop, 0.04, 0.025, 5, SHIP_COL.varnish, M_WOOD, true);
  body.ball(staffTop, 0.05, 0.05, 0.05, 4, SHIP_COL.brass, M_BRASS);
  shell.append(body);
  const hull = new THREE.Mesh(shell.toGeometry(), shipHullMaterial);
  hull.frustumCulled = false;
  shipGroup.add(hull);

  const fore = buildMast(MAST_FORE, q), main = buildMast(MAST_MAIN, q);
  shipGroup.add(fore.group, main.group);

  const divs = q.sailDivisions;
  const jibTack = [SHIP_BOWSPRIT.tip[0], SHIP_BOWSPRIT.tip[1] - 0.08, SHIP_BOWSPRIT.tip[2] - 0.2];
  const jib = buildHeadsail(jibTack, rig.foreTop, [0, jibTack[1] + 0.8, jibTack[2] - SHIP.sails.jibFoot], divs, SHIP.sails.billow.jib);
  const stayHead = mastPt(MAST_FORE, MAST_FORE.cfg.height - 0.55, 0.2);
  const stay = buildHeadsail(rig.stayTack, stayHead, [0, rig.stayTack[1] + 0.5, rig.stayTack[2] - SHIP.sails.stayFoot], divs, SHIP.sails.billow.stay);
  shipGroup.add(jib.group, stay.group);

  const ensign = new THREE.Group();
  ensign.position.set(staffTop[0], staffTop[1] - 0.62, staffTop[2]);
  ensign.add(flagMesh(SHIP.flag.length, SHIP.flag.height, false));
  const burgee = new THREE.Group();
  const bp = mastPt(MAST_MAIN, MAST_MAIN.cfg.height + MAST_MAIN.cfg.topmast + 0.4, 0);
  burgee.position.set(bp[0], bp[1], bp[2]);
  burgee.add(flagMesh(1.1, 0.3, true));
  shipGroup.add(ensign, burgee);
  shipGroup.add(buildWashRing(q));

  const old = shipRig;
  shipRig = { fore: fore, main: main, jib: jib, stay: stay, ensign: ensign, burgee: burgee,
    yaw: old ? old.yaw : 0, side: old ? old.side : 1 };
}


// ----- Wake update -----
function wakeRowSet(r, x, z, rx, rz, age, hw, amp, t, count) {
  for (let c = 0; c < WAKE_COLS; c++) {
    const o = c / (WAKE_COLS - 1) * 2 - 1;
    const px = x + rx * hw * o, pz = z + rz * hw * o;
    const k = r * WAKE_COLS + c;
    wakePos[k * 3] = px;
    wakePos[k * 3 + 1] = waveHeightAt(px, pz, t, count) + wakeCfg.lift;
    wakePos[k * 3 + 2] = pz;
    wakeUV[k * 2] = o;
    wakeUV[k * 2 + 1] = age / wakeLifeDist;
    wakeAmp[k] = amp * (1 - Math.abs(o) * Math.abs(o) * 0.0);
  }
}

function updateWake(t, count, sternX, sternZ, fwdX, fwdZ, rightX, rightZ, speed, dt) {
  travelled += speed * dt;
  const spacing = wakeCfg.spacing;
  if (travelled - lastStripDist >= spacing) {
    lastStripDist = travelled;
    const s = wakeHead;
    stripX[s] = sternX; stripZ[s] = sternZ; stripRX[s] = rightX; stripRZ[s] = rightZ;
    stripDist[s] = travelled;
    wakeHead = (wakeHead + 1) % wakeStrips;
  }
  const speed01 = clamp01(speed / (SHIP.baseSpeed * 0.9));
  const base = wakeCfg.width, spread = wakeCfg.spread, str = wakeCfg.strength * (0.5 + 0.5 * speed01);
  // Row 0 sits at the stern; the rest follow the laid records, newest first.
  wakeRowSet(0, sternX, sternZ, rightX, rightZ, 0, base, str, t, count);
  let lx = sternX, lz = sternZ, lrx = rightX, lrz = rightZ, lage = 0;
  for (let r = 1; r < wakeRows; r++) {
    const s = ((wakeHead - r) % wakeStrips + wakeStrips) % wakeStrips;
    let amp, x = lx, z = lz, rx = lrx, rz = lrz, age = lage;
    if (stripDist[s] < 0) { amp = 0; }
    else {
      age = travelled - stripDist[s];
      x = stripX[s]; z = stripZ[s]; rx = stripRX[s]; rz = stripRZ[s];
      amp = age > wakeLifeDist ? 0 : str * (1 - age / wakeLifeDist);
    }
    wakeRowSet(r, x, z, rx, rz, Math.min(age, wakeLifeDist), base + Math.min(age, wakeLifeDist) * spread, amp, t, count);
    lx = x; lz = z; lrx = rx; lrz = rz; lage = age;
  }
  wakePosAttr.needsUpdate = true; wakeUVAttr.needsUpdate = true; wakeAmpAttr.needsUpdate = true;

  // Spray: droplets thrown off the hull near the bow, rising and arcing outward. Big swell throws more, higher.
  const on = currentQuality().spray;
  const rough = clamp01((waveScale - 1) * 0.9);
  const bowX = sternX + fwdX * SHIP.length, bowZ = sternZ + fwdZ * SHIP.length;
  const bowY = waveHeightAt(bowX, bowZ, t, count);
  for (let side = 0; side < 2; side++) {
    const sg = side === 0 ? 1 : -1;
    for (let i = 0; i < sprayPerSide; i++) {
      const id = side * sprayPerSide + i;
      const seed = (i + 0.5) / sprayPerSide;
      const p = (t * wakeCfg.sprayRate + seed * 1.37 + side * 0.31) % 1;
      const back = seed * 3.2;
      const gg = clamp01(back / SHIP.length);
      const out = shipWaterHalf(gg) + 0.1 + p * 0.9;
      const px = bowX - fwdX * back + rightX * sg * out;
      const pz = bowZ - fwdZ * back + rightZ * sg * out;
      const py = bowY + 0.15 + (0.35 + 1.4 * speed01) * (1 + rough * 1.2) * 4 * p * (1 - p) * (1.2 - seed * 0.6);
      const a = on ? Math.sin(p * Math.PI) * wakeCfg.spray * Math.max(speed01, rough) * (1 - seed * 0.5) : 0;
      for (let c = 0; c < 4; c++) {
        const k = id * 4 + c;
        sprayPos[k * 3] = px; sprayPos[k * 3 + 1] = py; sprayPos[k * 3 + 2] = pz;
        spraySize[k] = 0.1 + 0.16 * p;
        sprayAlpha[k] = a;
      }
    }
  }
  sprayPosAttr.needsUpdate = true; spraySizeAttr.needsUpdate = true; sprayAlphaAttr.needsUpdate = true;
}

// ----- Motion: the sea under the ship, the ship's heading and speed, and steering -----
const shipWaves = [];
for (let i = 0; i < 8; i++) {
  const w = CONFIG.ocean.waves[i];
  const len = Math.hypot(w.dirX, w.dirZ) || 1;
  const k = (2 * Math.PI) / w.wavelength;
  const a = w.amplitude * CONFIG.ocean.waveHeight;
  shipWaves.push({ dx: w.dirX / len, dz: w.dirZ / len, k: k, a: a,
    c: w.speed * CONFIG.ocean.waveSpeed, q: w.steepness / (k * a * 4.0 + 0.0001) });
}
const shipDisp = { x: 0, y: 0, z: 0 };
let shipShelterK = 1;   // swell scale near islands, set by waveHeightAt before it sums the waves
let waveScale = 1;      // weather swell; MUST match the ocean's uWaveScale (the environment update sets both)
function gerstnerSum(rx, rz, t, count) {
  let dx = 0, dy = 0, dz = 0;
  for (let i = 0; i < count; i++) {
    const w = shipWaves[i];
    const phase = w.k * (w.dx * rx + w.dz * rz - w.c * t);
    const cs = Math.cos(phase);
    dx += w.q * w.a * w.dx * cs; dz += w.q * w.a * w.dz * cs; dy += w.a * Math.sin(phase);
  }
  shipDisp.x = dx * shipShelterK; shipDisp.y = dy * shipShelterK * waveScale; shipDisp.z = dz * shipShelterK;
}
function waveHeightAt(x, z, t, count) {
  shipShelterK = shelterAtJS(x, z);
  let rx = x, rz = z;
  for (let it = 0; it < 2; it++) { gerstnerSum(rx, rz, t, count); rx = x - shipDisp.x; rz = z - shipDisp.z; }
  gerstnerSum(rx, rz, t, count);
  return shipDisp.y;
}

const ship = { x: 0, z: 0, heading: SHIP.startHeading, speed: 0, heave: 0, pitch: 0, roll: 0, luff: 0, anchored: false };
const followTarget = { x: 0, y: 0, z: 0, heading: SHIP.startHeading };
const steerInput = { keyLeft: false, keyRight: false, touchLeft: false, touchRight: false, dragActive: false, dragStartX: 0 };

function shipWindFactor(angleDeg) {
  const p = SHIP.polar;
  if (angleDeg <= p[0][0]) return p[0][1];
  for (let i = 1; i < p.length; i++) {
    if (angleDeg <= p[i][0]) {
      const a0 = p[i - 1][0], f = (angleDeg - a0) / (p[i][0] - a0);
      return p[i - 1][1] + (p[i][1] - p[i - 1][1]) * f;
    }
  }
  return p[p.length - 1][1];
}

// How far the sails are let out for an angle between the wind and the bow (degrees in, degrees out).
function sheetAngle(alpha) {
  const p = SHIP.sheetTable;
  if (alpha <= p[0][0]) return p[0][1];
  for (let i = 1; i < p.length; i++) {
    if (alpha <= p[i][0]) {
      const f = (alpha - p[i - 1][0]) / (p[i][0] - p[i - 1][0]);
      return p[i - 1][1] + (p[i][1] - p[i - 1][1]) * f;
    }
  }
  return p[p.length - 1][1];
}

function updateShip(dt) {
  const t = timeUniform.value;
  const count = currentQuality().waveCount;
  let turnIn = (steerInput.keyRight || steerInput.touchRight ? 1 : 0) - (steerInput.keyLeft || steerInput.touchLeft ? 1 : 0);
  if (ship.anchored && turnIn !== 0) weighAnchor();   // steering lifts the anchor
  if (ship.anchored) turnIn = 0;
  ship.heading = ((ship.heading + turnIn * SHIP.turnRate * dt) % 360 + 360) % 360;

  const hr = ship.heading * SHIP_DEG;
  const fx = Math.sin(hr), fz = -Math.cos(hr);
  const rx = Math.cos(hr), rz = Math.sin(hr);

  // Wind comes FROM the opposite way to the direction it blows towards.
  const fromX = -wind.dir.x, fromZ = -wind.dir.y;
  const cosA = fx * fromX + fz * fromZ;
  const alpha = Math.acos(Math.max(-1, Math.min(1, cosA))) * SHIP_RAD;
  ship.luff = ship.anchored ? 0.12 : (alpha < CONFIG.audio.flap.luffStart ? 1 - alpha / CONFIG.audio.flap.luffStart : 0);   // 0..1, how much the sails are shaking (sound reads it)
  let target = SHIP.baseSpeed * shipWindFactor(alpha) * (1 + (wind.strength - 1) * CONFIG.weather.speedFromWind);
  if (gameMode === 'survival' && survivalState.active) {
    if (wind.strength < CONFIG.survival.calmWindThreshold) target *= 0.48;
    if (survivalState.reefed) target *= 0.74;
    if (survivalState.sails <= 0) target *= 0.58;
    if (survivalState.water <= 0 || survivalState.provisions <= 0) target *= 0.82;
    if (survivalState.hull <= 0) target *= 0.35;
  }
  ship.speed += ((ship.anchored ? 0 : target) - ship.speed) * (1 - Math.exp(-(ship.anchored ? 2.2 : SHIP.accel) * dt));
  // Shallow water: the ship never gets further onto an island. A move is allowed only if the hull stays clear of the sea floor,
  // or if it ends in deeper water than it started in (so a ship that touches while turning can still sail out, but never deeper in).
  const nx = ship.x + fx * ship.speed * dt, nz = ship.z + fz * ship.speed * dt;
  if (islands.length) {
    const dNow = shoalDepth(ship.x, ship.z, fx, fz, rx, rz);
    const dNew = shoalDepth(nx, nz, fx, fz, rx, rz);
    if (dNew > 0 && dNew >= dNow) {
      if (gameMode === 'survival' && survivalState.active && ship.speed > 1.8) damageSurvival('hull', 4, CONFIG.survival.text.hullHit, 3.5);
      ship.speed = 0;
      const nowMs = performance.now();
      if (nowMs - lastShoalToast > 5000) { lastShoalToast = nowMs; showToast(CONFIG.ui.toastShoal); }
    } else {
      ship.x = nx;
      ship.z = nz;
    }
    // Already touching the sea floor (turned into the shallows, or spawned there): ease the ship out, away from the nearest island.
    if (shoalDepth(ship.x, ship.z, fx, fz, rx, rz) > 0) {
      let near = null, nd = 1e18;
      for (let i = 0; i < islands.length; i++) {
        const I = islands[i], ddx = ship.x - I.cx, ddz = ship.z - I.cz, d2 = ddx * ddx + ddz * ddz;
        if (d2 < nd) { nd = d2; near = I; }
      }
      if (near) {
        const dist = Math.sqrt(nd) + 0.001, ox = (ship.x - near.cx) / dist, oz = (ship.z - near.cz) / dist;
        const px = ship.x + ox * 4 * dt, pz = ship.z + oz * 4 * dt;
        if (shoalDepth(px, pz, fx, fz, rx, rz) < shoalDepth(ship.x, ship.z, fx, fz, rx, rz)) { ship.x = px; ship.z = pz; }
      }
    }
  } else {
    ship.x = nx;
    ship.z = nz;
  }
  if (gameMode === 'survival' && survivalState.active && !ship.anchored) applySurvivalCurrent(dt);

  const L = SHIP_HALF_L, B = SHIP_HALF_B;
  const yBow = waveHeightAt(ship.x + fx * L, ship.z + fz * L, t, count);
  const yStern = waveHeightAt(ship.x - fx * L, ship.z - fz * L, t, count);
  const yPort = waveHeightAt(ship.x + rx * B * -1, ship.z + rz * B * -1, t, count);
  const yStbd = waveHeightAt(ship.x + rx * B, ship.z + rz * B, t, count);
  const avg = (yBow + yStern + yPort + yStbd) * 0.25;
  const low = Math.min(yBow, yStern, yPort, yStbd);
  const heaveT = Math.min(avg, low + SHIP.draft * 0.8);
  const pitchT = -Math.atan2(yBow - yStern, SHIP.length);

  // Sail trim: the boom swings to the lee side, further out the more the wind is behind.
  const ws = fromX * rx + fromZ * rz;           // > 0: wind from starboard
  if (Math.abs(ws) > 0.05 && shipRig) shipRig.side = ws > 0 ? -1 : 1;
  const side = shipRig ? shipRig.side : 1;
  const trim = sheetAngle(alpha) * SHIP_DEG * side;
  // Heel: the wind leans the ship away from the wind, most on a beam reach.
  const heel = -side * -1 * SHIP.heelMax * SHIP_DEG * Math.min(wind.strength, CONFIG.weather.heelWindMax) * Math.sin(Math.min(alpha, 150) * SHIP_DEG) * (alpha < 25 ? alpha / 25 : 1);
  const rollT = -Math.atan2(yStbd - yPort, SHIP.beam) + heel;

  const k = 1 - Math.exp(-SHIP.motionResponse * dt);
  ship.heave += (heaveT - ship.heave) * k;
  ship.pitch += (pitchT - ship.pitch) * k;
  ship.roll += (rollT - ship.roll) * k;

  shipGroup.position.set(ship.x, ship.heave, ship.z);
  shipGroup.rotation.set(ship.pitch, Math.PI - hr, ship.roll, 'YXZ');

  if (shipRig) {
    shipRig.yaw += (trim - shipRig.yaw) * (1 - Math.exp(-SHIP.sheetResponse * dt));
    const flap = alpha < 35 ? Math.sin(t * 6.5) * 0.06 * (1 - alpha / 35) : 0;
    const yw = shipRig.yaw + flap;
    shipRig.main.sheet.rotation.y = yw;
    shipRig.fore.sheet.rotation.y = yw * 0.92;
    shipRig.jib.pivot.rotation.y = yw * 0.8 + flap;
    shipRig.stay.pivot.rotation.y = yw * 0.65 + flap;
    // Flags stream downwind, worked out in the ship's own frame.
    const th = Math.PI - hr;
    const xl = wind.dir.x * Math.cos(th) - wind.dir.y * Math.sin(th);
    const zl = wind.dir.x * Math.sin(th) + wind.dir.y * Math.cos(th);
    const fa = Math.atan2(-xl, -zl);
    shipRig.ensign.rotation.y = fa;
    shipRig.burgee.rotation.y = fa;
  }
  washMaterial.uniforms.uSpeed.value = clamp01(ship.speed / SHIP.baseSpeed);

  updateWake(t, count, ship.x - fx * L, ship.z - fz * L, fx, fz, rx, rz, ship.speed, dt);
  shipSailMaterial.uniforms.uWindStrength.value = Math.min(wind.strength, CONFIG.weather.swayMax);

  followTarget.x = ship.x;
  followTarget.y = ship.heave;
  followTarget.z = ship.z;
  followTarget.heading = ship.heading;
}

// Keyboard steering. Ignored while the settings sheet is open, so the arrow keys and Esc still work there.
document.addEventListener('keydown', (e) => {
  if (settingsOpen || journalOpen || atlasOpen || shipCustomOpen || sightOpen || photoMode) return;
  if (e.code === SHIP.steerLeftKeys) steerInput.keyLeft = true;
  else if (e.code === SHIP.steerRightKeys) steerInput.keyRight = true;
});
document.addEventListener('keyup', (e) => {
  if (e.code === SHIP.steerLeftKeys) steerInput.keyLeft = false;
  else if (e.code === SHIP.steerRightKeys) steerInput.keyRight = false;
});
function onSteerPointerDown(e) {

// ===== WORLD =====
// The sea is a seeded grid of 400 m cells. A cell holds nothing or one island (sand cay or atoll). Islands near the
// ship are built, islands far behind are freed. Same seed, same world. Each island is ONE smooth polar mesh whose
// rings follow its shoreline, so the beach, the waterline and the shallows line up with the ocean shader.
const WORLD = CONFIG.world;
const islandGroup = new THREE.Group();

let worldTimer = 0;

// ----- Seeded random numbers -----
function mulberry32(a) {
  return function () {

  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);

// Decides what lives in cell (i, j). Pure: the same cell always gives the same answer.
function planCell(i, j) {

  let forced = null;
  for (let k = 0; k < WORLD.forced.length; k++) if (WORLD.forced[k].i === i && WORLD.forced[k].j === j) forced = WORLD.forced[k];
  const roll = rnd(), typeRoll = rnd(), sizeRoll = rnd(), ox = rnd(), oz = rnd(), hRoll = rnd();
  const lm = mulberry32(cellHash(i, j, 3));
  const lmRoll = lm(), lmA = lm();

  if (forced) {
    type = forced.type; R = forced.R; cx = forced.x; cz = forced.z; hMax = forced.h;
  } else {
    if (roll > WORLD.occupancy) return null;
    const LS = WORLD.landmarkShare;
    if (typeRoll < WORLD.atollShare) type = 1;
    else if (lmRoll < LS.lighthouse) type = 2;
    else if (lmRoll < LS.lighthouse + LS.cliff) type = 3;
    else if (lmRoll < LS.lighthouse + LS.cliff + LS.ruins) type = 4;
    else if (lmRoll < LS.lighthouse + LS.cliff + LS.ruins + LS.arch) type = 5;
    else type = 0;

  const plan = {
    key: i + ',' + j, i: i, j: j, cx: cx, cz: cz, R: R, type: type, hMax: hMax, goal: !!(forced && forced.goal),
    slope: type === 5 ? 0.35 : type >= 2 ? WORLD.rockShelf : WORLD.shelfSlope, pw: PW[type],
    ph: [rnd() * TWO_PI, rnd() * TWO_PI, rnd() * TWO_PI, rnd() * TWO_PI],
    gap: rnd() * TWO_PI,
    seedF: rnd() * 100,
    seedI: cellHash(i, j, 2) | 0,
    mesh: null, lod: 0, tris: 0, parent: null, mate: null, lmk: null, keepOut: null,
  };

    const ang = lmA * TWO_PI, mR = R * 0.85, mH = hMax * 0.85;

      ph: [rnd() * TWO_PI, rnd() * TWO_PI, rnd() * TWO_PI, rnd() * TWO_PI], gap: 0, seedF: rnd() * 100, seedI: cellHash(i, j, 4) | 0,
      mesh: null, lod: 0, tris: 0, parent: plan, mate: null, lmk: null, keepOut: null,

// ----- Relief noise (JavaScript only; never touches the waterline) -----
function hash2JS(ix, iz, seed) {

}

function rockRelief(I, x, z, base, k) {

// ----- Island material -----
const ISLAND_VERT = `
  attribute float aU;
  varying vec3 vW;
  varying vec3 vN;
  varying float vU;
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vW = wp.xyz;
    vN = normalize(mat3(modelMatrix) * normal);
    vU = aU;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }

// Colour comes from the shader: height, slope, wetness and noise decide sand, wet sand, grass and rock.
// Three scales of detail: the large shape (mesh), medium relief (grass patches, dunes) and fine grain (sand ripples).
const ISLAND_FRAG = SKY_CHUNK + `
  uniform float uTime;
  uniform float uDetail;
  uniform float uFogDensity;
  uniform vec2 uWindDir;
  uniform vec3 uSandDry;
  uniform vec3 uSandWet;
  uniform vec3 uGrassA;
  uniform vec3 uGrassB;
  uniform vec3 uRock;
  uniform vec3 uRockDark;
  varying vec3 vW;
  varying vec3 vN;
  varying float vU;

  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p) {

    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);

  void main() {

    vec3 toCam = cameraPosition - vW;
    float dist = length(toCam);
    vec3 V = toCam / max(dist, 0.001);
    float h = vW.y;
    vec2 wp = vW.xz;
    float slope = length(N.xz);
    float nearF = 1.0 - smoothstep(30.0, 150.0, dist);

    // Wetness: a band that the sea reaches, drifting a little as if with the tide.
    float wetLine = 0.75 + 0.1 * sin(uTime * 0.4 + wp.x * 0.03);
    float wet = max(1.0 - smoothstep(wetLine - 0.45, wetLine + 0.3, h), uWet * 0.55);
    float damp = 1.0 - smoothstep(wetLine, wetLine + 1.3, h);

    float rockM = smoothstep(0.30, 0.50, slope);
    float gn = fbm2(wp * 0.045 + 11.0);
    float grassM = smoothstep(0.40, 0.56, gn + (h - 2.0) * 0.07) * smoothstep(1.4, 2.4, h) * (1.0 - smoothstep(0.22, 0.42, slope));

const islandMaterial = new THREE.ShaderMaterial({
  vertexShader: ISLAND_VERT,
  fragmentShader: ISLAND_FRAG,
  uniforms: Object.assign(sharedSkyUniforms(), {
    uTime: timeUniform,
    uDetail: { value: currentQuality().islandDetail },
    uFogDensity: { value: WORLD.fogDensity },
    uWindDir: { value: DUNE_DIR },
    uSandDry: { value: toLinear(WORLD.colours.sandDry) },
    uSandWet: { value: toLinear(WORLD.colours.sandWet) },

    uGrassB: { value: toLinear(WORLD.colours.grassB) },

// Landmark islands use the same shader with thinner haze, so they stay visible from far away.
const islandRockMaterial = new THREE.ShaderMaterial({

// ----- Terrain mesh -----
// A polar grid: ring k sits at u = k / nIn inside the shoreline (so one ring lies exactly on the waterline) and
// the rings beyond it run out under the water. Normals are smoothed over the whole mesh, wrapped across the seam.
function makeIslandMesh(I) {

    let h = isleBedJS(I);
    h += reliefAt(I, wx, wz, h);
    h -= 6 * smoothstepJS(1.18, uMax, uVal);   // the outer rim drops away, deep under the water

    const u = r <= nIn ? (I.type >= 2 ? 1 - Math.pow(1 - tt, 1.4) : tt) : 1 + (uMax - 1) * (r - nIn) / nOut;
    for (let sct = 0; sct < sectors; sct++) {
      const th = (sct / sectors) * Math.PI * 2;
      const shp = 0.12 * Math.sin(2 * th + p[0]) + 0.09 * Math.sin(3 * th + p[1]) + 0.06 * Math.sin(5 * th + p[2]) + 0.04 * Math.sin(8 * th + p[3]);
      const rad = u * I.R * (1 + shp);
      setVertex(1 + (r - 1) * sectors + sct, Math.cos(th) * rad, Math.sin(th) * rad, u);
    }

  const idx = new Uint16Array((sectors + (rings - 1) * sectors * 2) * 3);
  let n = 0;
  const vi = (r, sct) => 1 + (r - 1) * sectors + ((sct % sectors) + sectors) % sectors;
  for (let sct = 0; sct < sectors; sct++) { idx[n++] = 0; idx[n++] = vi(1, sct + 1); idx[n++] = vi(1, sct); }
  for (let r = 1; r < rings; r++) {
    for (let sct = 0; sct < sectors; sct++) {
      const a = vi(r, sct), b = vi(r, sct + 1), c = vi(r + 1, sct + 1), d = vi(r + 1, sct);

    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];

  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));

  geo.setIndex(new THREE.BufferAttribute(idx, 1));
