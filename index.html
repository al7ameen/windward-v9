<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Windward — Phase 9 Polish & Release Candidate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Alegreya Sans', system-ui, sans-serif;

    --fs-title: clamp(44px, 9vw, 104px);
    --fs-sheet: 34px;
    --fs-lead: 20px;
    --fs-ui: 17px;
    --fs-small: 14px;

    --s1: 4px;
    --s2: 8px;
    --s3: 12px;
    --s4: 16px;
    --s5: 24px;
    --s6: 40px;
    --s7: 64px;

    --radius: 14px;
    --ease: cubic-bezier(.22, .8, .24, 1);
    --t-fast: 240ms;
    --t-slow: 900ms;

    --sheet-w: min(400px, 88vw);
    --sheet-max-h: 82vh;

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);

    /* Default colours (noon). applyUiPalette() replaces these from CONFIG.ui.palettes. */
    --text-rgb: 255 255 255;
    --accent-rgb: 198 236 247;
    --scrim-rgb: 14 58 93;
  }

  /* Anything marked hidden stays hidden, even when a class sets display. */
  [hidden] {
    display: none !important;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #071a24;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--font);
  }
  canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* If the GPU briefly loses its context, show an ocean-toned fallback rather than a black flash. */
  body.is-context-lost::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, #123b49 0%, #0b2936 48%, #071a24 100%);
  }

  /* Visually hidden, but still read by screen readers. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* Soft scrim behind the heading tape, at the top of the screen. */
  #tapeScrim {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: var(--tape-scrim-h);
    background: linear-gradient(to bottom, rgb(var(--scrim-rgb) / .55), transparent);
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-slow) var(--ease), background-color 600ms var(--ease);
  }
  #tapeScrim.is-in {
    opacity: 1;
  }

  /* Heading tape: the signature element of the interface. Sits at the top centre. */
  #tapeMount {
    position: fixed;
    left: 50%;
    top: calc(var(--safe-t) + var(--s3));
    transform: translateX(-50%);
    width: var(--tape-w-landscape);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--t-slow) var(--ease);
  }
  #tapeMount.is-in {
    opacity: 1;
  }
  .tape-wrap {
    width: 100%;
  }
  .tape {
    position: relative;
    height: var(--tape-h);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
  }
  .tape-strip {
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    width: var(--strip-w);
    will-change: transform;
    /* Minor ticks every 5 degrees, major ticks every 45 degrees, both sitting on the bottom edge. */
    background:
      repeating-linear-gradient(to right, rgb(var(--text-rgb) / var(--tick-minor-alpha)) 0 var(--tick-minor-w), transparent var(--tick-unit-minor-w) var(--tick-minor)) bottom / 100% var(--tick-minor-h) no-repeat,
      repeating-linear-gradient(to right, rgb(var(--text-rgb)) 0 var(--tick-major-w), transparent var(--tick-major-w) var(--tick-major)) bottom / 100% var(--tick-major-h) no-repeat;
  }
  .tape-letter {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font: 500 var(--fs-small)/1 var(--font);
    color: rgb(var(--text-rgb));
    white-space: nowrap;
    transition: color 600ms var(--ease);
  }
  .tape-letter.is-north {
    color: rgb(var(--accent-rgb));
  }
  .tape-sun {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--sun-size);
    height: var(--sun-size);
    margin: calc(var(--sun-size) / -2) 0 0 calc(var(--sun-size) / -2);
    border-radius: 50%;
    background: rgb(var(--accent-rgb));
    opacity: 0;
    transition: background-color 600ms var(--ease);
  }
  /* Moon: a hollow ring. Wind: a small triangle on the bearing the wind comes from. */
  .tape-moon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--moon-size);
    height: var(--moon-size);
    margin: calc(var(--moon-size) / -2) 0 0 calc(var(--moon-size) / -2);
    box-sizing: border-box;
    border-radius: 50%;
    border: 2px solid rgb(var(--accent-rgb));
    opacity: 0;
    transition: border-color 600ms var(--ease);
  }
  .tape-wind {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    margin: calc(var(--wind-size) * -0.35) 0 0 calc(var(--wind-size) / -2);
    border-left: calc(var(--wind-size) / 2) solid transparent;
    border-right: calc(var(--wind-size) / 2) solid transparent;
    border-top: calc(var(--wind-size) * 0.7) solid rgb(var(--text-rgb) / .85);
    opacity: 0;
    transition: border-top-color 600ms var(--ease);
  }
  .tape-marker {
    width: 0;
    height: 0;
    margin: 0 auto;
    border-left: calc(var(--marker-w) / 2) solid transparent;
    border-right: calc(var(--marker-w) / 2) solid transparent;
    border-top: var(--marker-h) solid rgb(var(--accent-rgb));
    transition: border-top-color 600ms var(--ease);
  }
  .tape-readout {
    margin-top: var(--s1);
    text-align: center;
    font: 500 var(--fs-small)/1 var(--font);
    font-variant-numeric: tabular-nums;
    color: rgb(var(--text-rgb));
    transition: color 600ms var(--ease);
  }
  @media (orientation: portrait) {
    #tapeMount {
      top: calc(var(--safe-t) + var(--tape-top-portrait));
      width: var(--tape-w-portrait);
    }
  }

  /* Text button: underline in the accent colour, no box. */
  .btn-text {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: 0;
    color: rgb(var(--text-rgb));
    font: 500 var(--fs-ui)/1.2 var(--font);
    min-height: 44px;
    padding: 0 var(--s2);
    text-decoration: underline;
    text-decoration-color: rgb(var(--accent-rgb));
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
    cursor: pointer;
    transition: color 600ms var(--ease), text-decoration-color 600ms var(--ease);
  }
  .btn-text:active {
    opacity: .6;
  }
  .btn-text:focus-visible {
    outline: 2px solid rgb(var(--accent-rgb));
    outline-offset: 4px;
  }

  /* Menu button: top-left, shown after Start, fades out when idle. */
  #menuBtn, #journalBtn, #atlasBtn, #shipBtn, #sightBtn {
    position: fixed;
    top: calc(var(--safe-t) + var(--s2));
    left: calc(var(--safe-l) + var(--s4));
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-fast) var(--ease), color 600ms var(--ease), text-decoration-color 600ms var(--ease);
  }
  #menuBtn.is-shown, #journalBtn.is-shown, #atlasBtn.is-shown, #shipBtn.is-shown, #sightBtn.is-shown {
    opacity: 1;
    pointer-events: auto;
  }
  #menuBtn.is-shown:active, #journalBtn.is-shown:active, #atlasBtn.is-shown:active, #shipBtn.is-shown:active, #sightBtn.is-shown:active {
    opacity: .6;
  }
  #journalBtn {
    left: calc(var(--safe-l) + var(--s4) + 84px);
  }
  #atlasBtn {
    left: calc(var(--safe-l) + var(--s4) + 176px);
  }
  #shipBtn { left: calc(var(--safe-l) + var(--s4) + 250px); }
  #sightBtn { left: calc(var(--safe-l) + var(--s4) + 310px); }
  #starCompass {
    position: fixed; right: calc(var(--safe-r) + 18px); bottom: calc(var(--safe-b) + 20px);
    z-index: 4; width: 126px; padding: 10px 10px 8px; box-sizing: border-box;
    border: 1px solid rgb(var(--text-rgb) / .22); border-radius: 13px;
    background: rgb(var(--scrim-rgb) / .64); color: rgb(var(--text-rgb));
    opacity: 0; visibility: hidden; pointer-events: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity 350ms var(--ease), background-color 600ms var(--ease), color 600ms var(--ease);
  }
  body.is-night #starCompass { opacity: 1; visibility: visible; }
  .star-compass-head { display: flex; flex-direction: column; gap: 2px; text-align: center; font-size: 10px; letter-spacing: .12em; }
  .star-compass-head strong { font-size: 12px; font-weight: 500; letter-spacing: .04em; }
  .star-rose-wrap { position: relative; width: 76px; height: 76px; margin: 8px auto 5px; }
  .star-rose { position: absolute; inset: 0; border: 1px solid rgb(var(--text-rgb) / .48); border-radius: 50%; transition: transform 220ms linear; }
  .star-rose::before, .star-rose::after { content: ''; position: absolute; background: rgb(var(--text-rgb) / .18); }
  .star-rose::before { left: 50%; top: 7px; bottom: 7px; width: 1px; }
  .star-rose::after { top: 50%; left: 7px; right: 7px; height: 1px; }
  .star-rose span { position: absolute; font: 500 11px/1 var(--font); }
  .rose-n { top: 5px; left: 50%; transform: translateX(-50%); color: rgb(var(--accent-rgb)); }
  .rose-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .rose-s { bottom: 5px; left: 50%; transform: translateX(-50%); }
  .rose-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .rose-tick { position: absolute; display: block; width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--accent-rgb)); }
  .rose-tick-n { top: 0; left: calc(50% - 2.5px); }
  .rose-tick-e { right: 0; top: calc(50% - 2.5px); }
  .rose-tick-s { bottom: 0; left: calc(50% - 2.5px); }
  .rose-tick-w { left: 0; top: calc(50% - 2.5px); }
  .rose-heading-marker { position: absolute; left: calc(50% - 1px); top: -3px; width: 2px; height: 16px; background: rgb(var(--accent-rgb)); box-shadow: 0 0 8px rgb(var(--accent-rgb) / .45); }
  .star-compass-hint { text-align: center; font-size: 11px; line-height: 1.25; opacity: .78; }
  body.is-photo #starCompass, body.is-photo #shipBtn, body.is-photo #sightBtn { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  .atlas-chart {
    position: static;
    touch-action: auto;
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    margin: var(--s2) 0 var(--s5);
  }
  .atlas-pages {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--s4);
    margin-top: var(--s3);
  }
  .atlas-page {
    display: grid;
    gap: 2px;
  }
  .atlas-page canvas {
    position: static;
    touch-action: auto;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    border-radius: 8px;
    margin-bottom: var(--s2);
  }
  /* Anchor button: bottom centre, only near a place or while anchored. */
  #anchorBtn {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-b) + var(--controls-h, 0px) + 76px);
    transform: translateX(-50%);
    z-index: 5;
    padding: 0 var(--s5);
    border-radius: var(--radius);
    background: rgb(var(--scrim-rgb) / .78);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-fast) var(--ease), color 600ms var(--ease), background-color 600ms var(--ease);
  }
  #anchorBtn.is-shown {
    opacity: 1;
    pointer-events: auto;
  }
  .journal-list {
    list-style: none;
    margin: var(--s4) 0 0;
    padding: 0;
  }
  .journal-list li {
    display: grid;
    gap: 2px;
    padding: var(--s3) 0;
    border-bottom: 1px solid rgb(var(--text-rgb) / .14);
  }
  .j-name { font: 500 var(--fs-lead)/1.2 var(--font); }
  .j-type, .j-where { font: 400 var(--fs-small)/1.3 var(--font); color: rgb(var(--text-rgb) / .72); }

  /* Frame-rate readout: top-right, no box, only when turned on in Settings. */
  #frameRate {
    position: fixed;
    top: calc(var(--safe-t) + var(--s2));
    right: calc(var(--safe-r) + var(--s4));
    z-index: 5;
    display: flex;
    align-items: center;
    height: 44px;
    font: 500 var(--fs-small)/1 var(--font);
    font-variant-numeric: tabular-nums;
    color: rgb(var(--text-rgb));
    opacity: .7;
    pointer-events: none;
    transition: color 600ms var(--ease);
  }

  /* Title screen: available immediately while the first scene frame is prepared. */
  #title {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: linear-gradient(to top, rgb(var(--scrim-rgb) / .72), transparent 60%);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-slow) var(--ease), background-color 600ms var(--ease);
  }
  #title.is-in {
    opacity: 1;
    pointer-events: auto;
  }
  .title-block {
    position: absolute;
    left: calc(var(--safe-l) + var(--s6));
    bottom: calc(var(--safe-b) + var(--s6));
    max-width: 22em;
    text-align: left;
  }
  #titleText,
  #noWebglTitle {
    margin: 0;
    font: 300 var(--fs-title)/.95 var(--font);
    letter-spacing: -0.02em;
    color: rgb(var(--text-rgb));
    transition: color 600ms var(--ease);
  }
  .lead {
    margin: var(--s4) 0 0;
    font: 400 var(--fs-lead)/1.4 var(--font);
    color: rgb(var(--text-rgb) / .8);
    transition: color 600ms var(--ease);
  }
  #startBtn {
    margin-top: var(--s5);
  }
  /* Portrait-hint line under the Start button (touch devices in portrait only). */
  .hint {
    margin: var(--s2) 0 0;
    font: 400 var(--fs-small)/1.3 var(--font);
    color: rgb(var(--text-rgb) / .7);
    transition: color 600ms var(--ease);
  }
  /* Portrait phones: the same block, raised a little. */
  @media (orientation: portrait) {
    .title-block {
      bottom: calc(var(--safe-b) + var(--s6) + var(--s7));
    }
  }

  /* No-WebGL screen: full cover in the scrim colour. Shown only when the sea cannot be drawn. */
  #noWebgl {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: rgb(var(--scrim-rgb));
  }
  body.is-fallback > *:not(#noWebgl) {
    display: none !important;
  }

  /* Toast: a short message above the controls zone. Fades in and out. */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-b) + var(--controls-h, 0px) + var(--s4));
    z-index: 6;
    transform: translateX(-50%);
    max-width: min(88vw, 360px);
    padding: var(--s3) var(--s4);
    border-radius: var(--radius);
    background: rgb(var(--scrim-rgb) / .88);
    color: rgb(var(--text-rgb));
    font: 500 var(--fs-ui)/1.3 var(--font);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-fast) var(--ease), background-color 600ms var(--ease), color 600ms var(--ease);
  }
  #toast.is-shown {
    opacity: 1;
  }

  /* Controls zone: empty for now. Later phases put steering controls here (they set pointer-events on themselves). */
  #controlsZone {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    height: var(--controls-h, 0px);
    pointer-events: none;
  }

  /* Photo mode: a bottom scrim with two text buttons. Fades out when idle. */
  #photoBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: var(--s6);
    padding: var(--s6) var(--s4) calc(var(--safe-b) + var(--s5));
    background: linear-gradient(to top, rgb(var(--scrim-rgb) / .72), transparent 60%);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--t-fast) var(--ease);
  }
  body.is-photo #photoBar {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  body.is-photo.is-photo-idle #photoBar {
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-slow) var(--ease);
  }

  /* Photo mode hides the tape, the menu, the readout and the controls zone. */
  body.is-photo #tapeMount,
  body.is-photo #tapeScrim,
  body.is-photo #controlsZone {
    opacity: 0;
  }
  body.is-photo #menuBtn,
  body.is-photo #journalBtn,
  body.is-photo #atlasBtn,
  body.is-photo #anchorBtn,
  body.is-photo #frameRate {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Settings scrim: tapping it closes the sheet. */
  #settingsScrim, #journalScrim, #atlasScrim, #shipScrim, #sightScrim {
    position: fixed;
    inset: 0;
    z-index: 7;
    background: rgb(var(--scrim-rgb) / .4);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-fast) var(--ease), background-color 600ms var(--ease);
  }
  #settingsScrim.is-open, #journalScrim.is-open, #atlasScrim.is-open, #shipScrim.is-open, #sightScrim.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Settings sheet: a right-hand drawer in landscape, a bottom sheet in portrait. */
  .sheet {
    position: fixed;
    z-index: 8;
    top: 0;
    right: 0;
    bottom: 0;
    width: var(--sheet-w);
    box-sizing: border-box;
    padding: calc(var(--safe-t) + var(--s5)) calc(var(--safe-r) + var(--s5)) calc(var(--safe-b) + var(--s5)) calc(var(--safe-l) + var(--s5));
    background: rgb(var(--scrim-rgb) / .94);
    color: rgb(var(--text-rgb));
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    visibility: hidden;
    transform: translateX(100%);
    transition: transform var(--t-fast) var(--ease), visibility 0s linear var(--t-fast), background-color 600ms var(--ease);
  }
  .sheet.is-open {
    visibility: visible;
    transform: none;
    transition: transform var(--t-fast) var(--ease), visibility 0s, background-color 600ms var(--ease);
  }
  @media (orientation: portrait) {
    .sheet {
      top: auto;
      left: 0;
      right: 0;
      width: auto;
      max-height: var(--sheet-max-h);
      border-radius: var(--radius) var(--radius) 0 0;
      transform: translateY(100%);
    }
  }
  .cosmetic-options { justify-content: flex-start; flex-wrap: wrap; }
  .national-flag-preview { justify-content: flex-start; gap: var(--s3); }
  .national-flag-preview svg { display: block; width: 96px; height: 48px; flex: 0 0 auto; border-radius: 2px; box-shadow: 0 0 0 1px rgb(255 255 255 / .2); }
  .national-flag-preview span { font: 400 var(--fs-ui)/1.3 var(--font); color: rgb(var(--text-rgb)); }
  .cosmetic-choice { max-width: 100%; text-align: left; white-space: normal; }
  .cosmetic-choice::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; border: 1px solid currentColor; background: var(--swatch, transparent); vertical-align: 0; }
  .cosmetic-choice[disabled] { opacity: .35; text-decoration: none; cursor: default; }
  .custom-summary { margin: var(--s5) 0 0; font-size: var(--fs-small); line-height: 1.4; color: rgb(var(--text-rgb) / .72); }
  .sight-intro { line-height: 1.5; font-size: var(--fs-ui); }
  .sight-targets { justify-content: flex-start; flex-wrap: wrap; }
  .sight-status, .sight-result { font-size: var(--fs-ui); line-height: 1.45; }
  .sight-status { color: rgb(var(--text-rgb) / .72); }
  .sight-result { min-height: 3.5em; margin-top: var(--s3); }
  .sight-range-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .sight-range-head output { font-size: 18px; font-variant-numeric: tabular-nums; color: rgb(var(--accent-rgb)); }
  .sight-range { width: 100%; accent-color: rgb(var(--accent-rgb)); margin: var(--s4) 0 var(--s2); }
  .sight-range-scale { display: flex; justify-content: space-between; color: rgb(var(--text-rgb) / .65); font-size: var(--fs-small); }
  .sight-action { margin-top: var(--s4); border: 1px solid rgb(var(--accent-rgb) / .5); border-radius: 8px; text-decoration: none; min-height: 46px; }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s4);
    margin-bottom: var(--s6);
  }
  .sheet-title {
    margin: 0;
    font: 300 var(--fs-sheet)/1.1 var(--font);
    color: rgb(var(--text-rgb));
    transition: color 600ms var(--ease);
  }
  .sheet-section + .sheet-section {
    margin-top: var(--s6);
  }
  .sheet-heading {
    margin: 0 0 var(--s2);
    font: 500 var(--fs-small)/1.2 var(--font);
    color: rgb(var(--text-rgb) / .7);
    transition: color 600ms var(--ease);
  }
  .settings-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--s2) var(--s4);
    min-height: 56px;
  }
  .settings-row + .settings-row {
    margin-top: var(--s2);
  }
  .settings-label {
    font: 400 var(--fs-ui)/1.3 var(--font);
    color: rgb(var(--text-rgb));
    transition: color 600ms var(--ease);
  }
  .settings-control {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: var(--s1);
    margin-left: auto;
  }
  .settings-value {
    font: 400 var(--fs-ui)/1.3 var(--font);
    color: rgb(var(--text-rgb));
    opacity: .6;
  }
  /* Choice options: text only. Selected is full strength with an underline; the rest sit at 62%. */
  .choice-opt {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: 0;
    min-height: 44px;
    padding: 0 var(--s2);
    color: rgb(var(--text-rgb));
    font: 500 var(--fs-ui)/1.2 var(--font);

  .survival-hud {
    position: fixed; left: calc(var(--safe-l) + var(--s4)); bottom: calc(var(--safe-b) + var(--s4)); z-index: 5;

  .survival-gauge-fill { width: 100%; height: 100%; border-radius: inherit; background: rgb(var(--accent-rgb)); transition: width 250ms linear, background-color 250ms linear; }
  .survival-gauge-fill.is-warn { background: #e6b66a; }

<script>
/* ============================================================
   WINDWARD: project status (keep this block up to date)
   Rules: no living beings anywhere (people, animals, birds, fish, insects,
   or their shapes). Plants are fine. Natural sounds only, no music.
   Nothing blocky: smooth, procedural, no texture files. Three.js r128.
   Always deliver COMPLETE working files, never snippets.

   Phases: 0 cleanup DONE | 1 islands DONE | 2 plants+rocks DONE | 3 landmarks DONE |
           4 weather+sky DONE | 5 natural sound DONE | 6 navigator loop (split in 3: 6a anchor+discoveries+Journal DONE, 6b Atlas+chart DONE, 6c star compass+Kamal sighting DONE) |
           G5 GRAPHICS PIPELINE: ocean/ship materials, procedural terrain/foliage/ruins, unified shading and adaptive render resolution (GPU validation pending) | 7 saved hull/trim colours and procedural sail/flag patterns DONE | 8 SURVIVAL MODE IMPLEMENTED (browser/GPU validation pending) | 9 polish: reduced-motion setting, drag steering, language-ready UI hook, background-tab timing and accessibility tuning
   File map (search for "// =====" markers): CONFIG, SAVED SETTINGS, RENDERER,
   SKY, ISLAND MATH, OCEAN, SHIP, WORLD (islands), PLANTS, LANDMARKS, ENVIRONMENT, CAMERA, UI, SETTINGS SHEET,
   AUTO GRAPHICS, PHOTO MODE, TITLE/START, WIRE UP, LOOP.
   Phase 1 notes: an island is {cx, cz, R, type (0 cay, 1 atoll), ph[4], gap, hMax, slope}.
   The shoreline is r = R*(1+wobble(angle)); u = r/that radius is exactly 1 on the waterline.
   ISLAND MATH exists twice and MUST stay in step: GLSL (ocean shader) and JS (ship, meshes).
   Interface for later phases: islands[] (built islands), islandBedAt(x, z) (ground height
   under a point, -999 if none), WORLD config, planCell(i, j), updateWorld(dt, force).
   Phase 2 notes: each island has I.plants = { group, palm, grass, props, counts }. Palms and grass are InstancedBufferGeometry
   meshes (one template, many copies); shrubs, rocks and driftwood are baked into one merged mesh (props). One shader (PLANT_VERT /
   PLANT_FRAG) draws all of them, picks the surface by the aPart attribute and sways in the vertex shader from the shared wind.
   Placement comes from the island seed (placePlants) and uses groundH(I, x, z), the same height the terrain mesh has. Counts and
   detail per graphics level live in CONFIG.quality.levels[n].plants; sizes and colours in CONFIG.plants. Grass is only placed
   where the island shader paints grass (grassMaskJS mirrors it; h21JS/vnoise2JS/fbm2JS mirror the GLSL noise: keep in step).
   Phase 3 notes: island types are 0 sand cay, 1 atoll, 2 lighthouse isle, 3 cliff island, 4 ruins isle, 5 sea arch (two stacks: the plan
   plus I.mate; the rock bridge is a mesh). Rock islands (2 to 5) use the cay branch of the island math with a profile exponent I.pw
   (isleB.w in GLSL) and a flat top (v*1.3 soft-clamped), in BOTH copies of ISLAND MATH. rockRelief() adds crags, ledges (cliff island)
   and flat ground under the tower and the ruins. Landmarks are built from CONFIG.world.landmarkBuild (1750 m) so they show on the
   horizon. I.lmk holds the landmark group; I.keepOut keeps plants off towers and ruins. One shader (LM_VERT / LM_FRAG) draws all solid
   landmark parts by aPart; the beam and the glows are additive and follow lmNight (from the sun's height: the beam shows at dusk, and
   at full strength once Phase 4 adds a night sky). Lantern buoys are instanced and bob on waveHeightAt in updateLandmarks().
   Phase 4 notes: ENVIRONMENT runs first every frame (updateEnvironment) and is the ONLY writer of horizonColor, topColor, sunColor,
   cloudColor, sunDir, moonDir, the key light (lightDir / lightColor), wind, waveScale, weather fog and the night sky. Lit shaders
   use uLightDir / uLightColor (sun by day, moon by night; both dark at the swap) and never uSunDir, which only places the sky's
   sun. The sun and moon sit on a sky sphere (celX/celY/celZ rows, world -> sky) that turns with env.hour; north is -z, the pole
   star stands env.lat degrees up, and env.lat grows as the ship sails north. Star patterns are in CONFIG.sky.stars.patterns.
   Weather: weather.mode 'changing' or a held state; wxNow holds the blended values of CONFIG.weather.states. waveScale (JS) and
   uWaveScale (ocean) MUST stay equal: they scale wave height and slope, not the sideways push. Fog = each object's own density

// ===== SAVED SETTINGS =====
// Loads the saved choices (Graphics, Time of day, Weather, Frame rate). Storage can be blocked or hold junk, so anything wrong counts as "not saved".
function loadPrefs() {
  const none = { quality: null, time: null, frameRate: null, weather: null, sound: null, volume: null, reducedMotion: null, dragSteer: null };
  try {
    const raw = window.localStorage.getItem(CONFIG.ui.storageKey);
    if (!raw) return none;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return none;
    const quality = Number.isInteger(data.quality)
      && data.quality >= 0 && data.quality < CONFIG.quality.levels.length ? data.quality : null;
    const time = typeof data.time === 'string'
      && (data.time === 'cycle' || Object.prototype.hasOwnProperty.call(CONFIG.sky.presets, data.time)) ? data.time : null;
    const frameRate = typeof data.frameRate === 'boolean' ? data.frameRate : null;
    const weather = typeof data.weather === 'string'
      && CONFIG.ui.settings.weatherOrder.indexOf(data.weather) >= 0 ? data.weather : null;
    const sound = typeof data.sound === 'boolean' ? data.sound : null;
    const volume = Number.isInteger(data.volume) && data.volume >= 0 && data.volume < CONFIG.audio.volumes.length ? data.volume : null;
    const reducedMotion = typeof data.reducedMotion === 'boolean' ? data.reducedMotion : null;
    const dragSteer = typeof data.dragSteer === 'boolean' ? data.dragSteer : null;
    return { quality, time, frameRate, weather, sound, volume, reducedMotion, dragSteer };
  } catch (e) {
    return none;
  }
}
const prefs = loadPrefs();
let reducedMotionEnabled = prefs.reducedMotion !== null ? prefs.reducedMotion : !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let dragSteerEnabled = prefs.dragSteer === true;

// Writes the current choices. If storage is blocked or full, the game keeps running without saving.
function savePrefs() {
  try {
    window.localStorage.setItem(CONFIG.ui.storageKey, JSON.stringify(prefs));
  } catch (e) {
    // Storage blocked or full: nothing else to do.
  }
}

// ===== RENDERER =====
// Index of the active quality level. A saved choice wins over the default. Changed by setQuality().
let qualityIndex = prefs.quality !== null ? prefs.quality : CONFIG.quality.startIndex;

// True while the browser has lost the picture. The loop stops drawing until it is restored.
let contextLost = false;

// Returns the settings object for the active quality level.
function currentQuality() {
  return CONFIG.quality.levels[qualityIndex];
}

// Creates the WebGL renderer. It throws when WebGL is missing; if Three.js did not load, THREE is undefined and it throws too.
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({
    antialias: true,                   // on for smoother edges; the ocean is the main cost
    powerPreference: 'high-performance',
  });
} catch (e) {
  renderer = null;
}

// No WebGL: show the full-screen message and stop here. Nothing below runs.
if (!renderer) {
  showUnsupported();
  return;
}

renderer.setClearColor(CONFIG.renderer.clearColor, 1);
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', onContextLost, false);
renderer.domElement.addEventListener('webglcontextrestored', onContextRestored, false);

const scene = new THREE.Scene();

// Current render scale is adaptive only above Low quality; geometry/detail presets stay under player control.
let adaptiveResolutionScale = 1.0;

// Applies the capped pixel ratio for the current quality and sizes the drawing buffer to the window.
function applyRendererSize() {
  const q = currentQuality();
  const ratio = Math.min(window.devicePixelRatio || 1, q.maxPixelRatio) * adaptiveResolutionScale;
  renderer.setPixelRatio(ratio);
  // false = do not touch the canvas CSS size; the stylesheet already fills the screen.
  renderer.setSize(window.innerWidth, window.innerHeight, false);
}
applyRendererSize();

// The browser lost the picture. Stop drawing, keep the page, and tell the player. Calling preventDefault
// lets the browser restore the picture later.
function onContextLost(event) {
  event.preventDefault();
  contextLost = true;
  document.body.classList.add('is-context-lost');
  showToast(CONFIG.ui.toastContextLost);
}

// Three.js rebuilds its GPU resources when the browser restores WebGL. Resume the existing voyage
// instead of forcing a full page reload, which used to cause a black flash and reset the scene.
function onContextRestored() {
  contextLost = false;
  document.body.classList.remove('is-context-lost');
  const now = performance.now();
  lastTime = now;
  fpsFrames = 0;
  fpsLastTime = now;
  if (autoProbe) autoProbe = { start: now, frames: 0 };
  showToast(CONFIG.ui.toastContextRestored);
}

// Shows the full-screen message when the sea cannot be drawn. Hides everything else on the page.
function showUnsupported() {
  document.body.classList.add('is-fallback');
  document.getElementById('noWebglTitle').textContent = CONFIG.ui.noWebglTitle;
  document.getElementById('noWebglLead').textContent = CONFIG.ui.noWebglLead;
  document.getElementById('noWebgl').hidden = false;
  const p = prefs.time || CONFIG.sky.startPreset;
  applyUiPalette(CONFIG.ui.palettes[p] ? p : 'golden');
}

// ===== SKY =====
// Converts a CONFIG hex colour from sRGB to linear. Used for every colour that goes into a shader.
function toLinear(hex) {
  return new THREE.Color(hex).convertSRGBToLinear();
}

// One shared clock for all animated shaders. The loop writes to .value every frame.
const timeUniform = { value: 0 };

// Live sky colours, sun and moon. The environment update (see ENVIRONMENT) writes into these every frame, so every shader that
// reads them follows the day cycle and the weather together. They are created once and never replaced.
const horizonColor = new THREE.Color();
const topColor = new THREE.Color();
const sunColor = new THREE.Color();
const cloudColor = new THREE.Color();
const cloudShadowColor = new THREE.Color();
const sunDir = new THREE.Vector3(0, 1, 0);       // the real sun (the sky draws its disc here)
const moonDir = new THREE.Vector3(0, -1, 0);
const lightDir = new THREE.Vector3(0, 1, 0);     // the key light every surface is lit by: the sun by day, the moon by night
const lightColor = new THREE.Color(1, 1, 1);     // colour and strength of the key light (zero when neither is up)
const fogTint = new THREE.Color();               // the pale grey thick fog and haze fade towards

// Fixed values that do not change with the time of day.
const cloudShadowBase = toLinear(CONFIG.sky.clouds.shadowColor);
const warmGlowColor = toLinear(CONFIG.sky.warmGlowColor);
// Live wind: the clouds and the sails both read this object, so they always agree. The weather turns and scales it.
const windDir = new THREE.Vector2(...CONFIG.wind.direction).normalize();
const wind = { dir: windDir, strength: CONFIG.wind.strength };
// The wind's starting direction, kept fixed. Island dunes and sand ripples use it, so the same seed always gives the same islands.
const DUNE_DIR = windDir.clone();

// Uniform objects shared by every shader that includes SKY_CHUNK. The environment update writes to their .value.
const sharedSky = {
  uSunGlow: { value: 1.0 },
  uExposure: { value: 1.0 },
  uLightDir: { value: lightDir },
  uLightColor: { value: lightColor },
  uFogExtra: { value: 0 },        // extra fog density from the weather, added to every object's own fog
  uSkyFog: { value: 0 },          // 0..1, how far the sky fades into fog and haze
  uFogTint: { value: fogTint },
  uWet: { value: 0 },             // 0..1, rain-wet surfaces (deck, sails, sand, stone)
};

// Time of day: 'cycle' runs the clock; a preset name locks the clock at that preset's hour. The Settings sheet reads it.
let currentPreset = prefs.time || CONFIG.sky.startPreset;

// The clock and the sky sphere. Plain numbers only; ENVIRONMENT fills in the rest every frame.
const env = {
  hour: currentPreset === 'cycle' ? CONFIG.sky.dayCycle.startHour : CONFIG.sky.dayCycle.lockHours[currentPreset],
  day: 0,
  lat: CONFIG.sky.stars.latitude,
  lst: 0,
  starVis: 0,
  moonPhase: CONFIG.sky.moon.startPhase,
};

// Locks the time of day to a preset, or ('cycle') lets the clock run on from where it is.
function setTimePreset(name) {
  if (name !== 'cycle' && !CONFIG.sky.presets[name]) {
    console.warn('Unknown time preset: ' + name);
    return;
  }
  currentPreset = name;
  if (name !== 'cycle') env.hour = CONFIG.sky.dayCycle.lockHours[name];
}

// Shared GLSL: the sky colour function and the final tone map. Every lit shader includes this chunk, so colours always match.
// uSunDir is the real sun (for the sky). uLightDir / uLightColor are the key light surfaces are lit by (sun by day, moon by night).
const SKY_CHUNK = `
  uniform vec3 uHorizonColor;
  uniform vec3 uTopColor;
  uniform vec3 uSunColor;
  uniform vec3 uSunDir;
  uniform vec3 uLightDir;
  uniform vec3 uLightColor;
  uniform float uSkyCurve;
  uniform float uZenithDarken;
  uniform float uHazeStrength;
  uniform float uHazeFalloff;
  uniform float uHazeBrighten;
  uniform float uSunRadius;
  uniform float uSunDiscBoost;
  uniform float uSunGlow;
  uniform float uHaloAngle;
  uniform float uHaloWidth;
  uniform float uHaloStrength;
  uniform vec3 uWarmGlow;
  uniform float uWarmStrength;
  uniform float uExposure;
  uniform float uFogExtra;
  uniform float uSkyFog;
  uniform vec3 uFogTint;
  uniform float uWet;

  // 0 when the sun is high, 1 when it is low. Turns the glow warm at dawn, golden hour and dusk.
  float sunWarmth() {
    return uWarmStrength * (1.0 - smoothstep(0.1, 0.4, uSunDir.y));
  }

  // How much the weather's fog and haze cover the sky in a direction (strongest at the horizon).
  float skyFogAmount(float up) {
    return uSkyFog * (1.0 - 0.55 * smoothstep(0.0, 0.6, up));
  }

  // Sky colour for a view direction: gradient, haze band, sun glow, halo ring, sharp disc, weather haze. No clouds or stars.
  vec3 skyColor(vec3 dir) {
    float up = max(dir.y, 0.0);

    // Gradient from horizon to top, with a slightly darker, richer zenith.
    vec3 col = mix(uHorizonColor, uTopColor, pow(up, uSkyCurve));
    col *= 1.0 - uZenithDarken * smoothstep(0.2, 1.0, up);

    // Soft, bright haze band along the horizon.
    float haze = exp(-up * uHazeFalloff) * uHazeStrength;
    col = mix(col, uHorizonColor * uHazeBrighten, haze);

    // Sun glow: a wide soft glow, a tighter core and a faint halo ring. Warmer when the sun is low.
    float cosSun = clamp(dot(dir, uSunDir), 0.0, 1.0);
    float sunAngle = acos(cosSun);
    vec3 glowCol = mix(uSunColor, uWarmGlow, sunWarmth());
    float hd = (sunAngle - uHaloAngle) / uHaloWidth;
    float wide = pow(cosSun, 6.0) * 0.35;
    float core = pow(cosSun, 80.0) * 0.8;
    float halo = exp(-hd * hd) * uHaloStrength;
    col += glowCol * (wide + core + halo) * uSunGlow;

    // Sharp sun disc on top. Clouds and fog dim it with the glow.
    float disc = 1.0 - smoothstep(uSunRadius * 0.8, uSunRadius, sunAngle);
    col = mix(col, uSunColor * uSunDiscBoost, disc * clamp(uSunGlow, 0.0, 1.0));

    // Weather haze and fog: the sky fades to a pale grey, most strongly near the horizon.
    col = mix(col, uFogTint, skyFogAmount(up));
    return col;
  }

  // ACES filmic tone curve (fitted).
  vec3 acesTone(vec3 x) {
    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
  }

  // Final step shared by every lit shader: exposure, ACES highlight roll-off, restrained saturation/contrast,
  // then gamma. This is deliberately subtle because sky, water, terrain and props already share this function.
  vec3 finishColor(vec3 c) {
    vec3 mapped = acesTone(c * uExposure);
    float luminance = dot(mapped, vec3(0.2126, 0.7152, 0.0722));
    mapped = mix(vec3(luminance), mapped, 1.025);
    mapped = (mapped - vec3(0.5)) * 1.012 + vec3(0.5);
    return pow(clamp(mapped, 0.0, 1.0), vec3(1.0 / 2.2));
  }
`;

// Sky sphere, drawn from inside. Passes the view direction to the fragment shader.
const SKY_VERT = `
  varying vec3 vDir;
  void main() {
    // The sphere is centred on the origin, so its local position is the view direction.
    vDir = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const MAX_PATTERN_STARS = 64;

// Sky fragment shader: sky colour, then the night sky (stars, star patterns, aurora, moon, shooting stars), two cloud layers lit
// by the key light, rainbow and lightning, and the weather's fog last.
const SKY_FRAG = SKY_CHUNK + `
  uniform float uTime;
  uniform vec3 uCloudColor;
  uniform vec3 uCloudShadow;
  uniform vec2 uWindDir;
  uniform float uSilverStrength;
  uniform int uCloudOctaves;
  uniform float uLowCover;
  uniform float uLowScale;
  uniform vec2 uLowOffset;
  uniform float uLowEdge;
  uniform float uLowLightOffset;
  uniform float uHighCover;
  uniform float uHighScale;
  uniform float uHighOffset;
  uniform float uHighStretch;
  uniform float uHighOpacity;
  uniform vec3 uCelX;
  uniform vec3 uCelY;
  uniform vec3 uCelZ;
  uniform float uStarVis;
  uniform float uStarDensity;
  uniform float uStarBright;
  uniform float uTwinkle;
  uniform int uStarLayers;
  uniform vec4 uPattern[${MAX_PATTERN_STARS}];
  uniform int uPatternCount;
  uniform vec3 uMoonDir;
  uniform float uMoonRadius;
  uniform float uMoonVis;
  uniform float uMoonGlow;
  uniform float uEarthshine;
  uniform vec3 uMoonCol;
  uniform vec3 uMeteorA;
  uniform vec3 uMeteorB;
  uniform vec2 uMeteor;
  uniform float uAurora;
  uniform int uAuroraLayers;
  uniform float uRainbow;
  uniform float uRainbowAngle;
  uniform float uRainbowWidth;
  uniform float uRainbow2;
  uniform float uFlash;
  uniform vec3 uFlashDir;
  uniform vec3 uFlashCol;
  varying vec3 vDir;

  // Cheap pseudo-random value for a grid corner.
  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }
  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

  // Smooth value noise.
  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }

  // Layered noise with a runtime octave count (at most 4). Normalised to about 0..1.
  float fbm(vec2 p, int octaves) {
    float v = 0.0;
    float amp = 0.5;
    for (int i = 0; i < 4; i++) {
      if (i >= octaves) break;
      v += amp * noise(p);
      p *= 2.0;
      amp *= 0.5;
    }
    return v / (1.0 - pow(0.5, float(octaves)));
  }

  // One layer of stars. The sky sphere is wrapped in a cube; each face is cut into cells and some cells hold one star.
  vec3 starLayer(vec3 c, float cells, float density, float size, float salt) {
    vec3 a = abs(c);
    vec2 uv;
    float face;
    if (a.x >= a.y && a.x >= a.z) { uv = c.yz / a.x; face = c.x > 0.0 ? 0.0 : 1.0; }
    else if (a.y >= a.z) { uv = c.xz / a.y; face = c.y > 0.0 ? 2.0 : 3.0; }
    else { uv = c.xy / a.z; face = c.z > 0.0 ? 4.0 : 5.0; }
    vec2 g = uv * cells;
    vec2 id = floor(g);
    vec2 seed = id + vec2(face * 157.0 + salt, salt * 0.37);
    float pick = h21(seed);
    if (pick > density) return vec3(0.0);
    vec2 pos = 0.25 + 0.5 * vec2(h21(seed + 1.7), h21(seed + 4.3));
    float d = length(g - id - pos) / cells;
    float mag = 0.12 + 0.88 * pow(h21(seed + 3.7), 5.0);
    float tw = 1.0 - uTwinkle * (0.5 + 0.5 * sin(uTime * (1.5 + 4.0 * h21(seed + 9.1)) + pick * 60.0));
    float tint = h21(seed + 6.6);
    vec3 col = mix(vec3(0.75, 0.85, 1.0), vec3(1.0, 0.88, 0.72), tint);
    return col * smoothstep(size, size * 0.15, d) * mag * tw;
  }

  // Our own geometric star patterns and the pole star: a short list of fixed bright points.
  vec3 patternStars(vec3 c) {
    vec3 col = vec3(0.0);
    for (int i = 0; i < ${MAX_PATTERN_STARS}; i++) {
      if (i >= uPatternCount) break;
      vec4 s = uPattern[i];
      float d = length(c - s.xyz);
      if (d > 0.03) continue;
      float tw = 1.0 - uTwinkle * 0.6 * (0.5 + 0.5 * sin(uTime * 2.3 + float(i) * 7.1));
      col += vec3(0.95, 0.97, 1.0) * s.w * tw * (smoothstep(0.0034, 0.0004, d) * 1.6 + exp(-d * d / 0.00004) * 0.35);
    }
    return col;
  }

  // Aurora: soft curtains of light over the north horizon, drifting slowly. Green at the foot, violet at the top.
  vec3 aurora(vec3 dir) {
    if (dir.y <= 0.0) return vec3(0.0);
    float az = atan(dir.x, -dir.z);               // 0 = north
    float el = asin(clamp(dir.y, 0.0, 1.0));
    float face = exp(-az * az / 1.3);
    if (face < 0.01) return vec3(0.0);
    vec3 col = vec3(0.0);
    for (int k = 0; k < 3; k++) {
      if (k >= uAuroraLayers) break;
      float fk = float(k);
      float x = az * (2.0 + fk * 0.7) + fk * 3.1;
      float foot = 0.06 + 0.05 * fk + 0.05 * sin(x * 1.3 + uTime * 0.05 + fk) + 0.04 * noise(vec2(x * 2.0, uTime * 0.03 + fk * 5.0));
      float h = el - foot;
      if (h < -0.03) continue;
      float rays = noise(vec2(az * (60.0 + fk * 23.0) + uTime * 0.12, fk * 9.0));
      float along = noise(vec2(x * 2.6 - uTime * 0.04, uTime * 0.02 + fk * 3.0));
      float vert = smoothstep(-0.03, 0.01, h) * exp(-max(h, 0.0) * (6.0 - fk));
      float a = vert * (0.25 + 0.75 * along * along) * (0.55 + 0.45 * rays) * (1.0 - 0.3 * fk);
      vec3 c = mix(vec3(0.12, 1.0, 0.5), vec3(0.55, 0.22, 0.95), smoothstep(0.02, 0.25, h));
      col += c * a;
    }
    return col * face;
  }

  // The moon: a sphere lit by the sun, so the lit part (the phase) faces wherever the sun is. cover = how much of the disc is here.
  vec3 moonDisc(vec3 dir, out float cover) {
    cover = 0.0;
    float md = dot(dir, uMoonDir);
    if (md < 0.9) return vec3(0.0);
    vec3 q = (dir - uMoonDir * md) / uMoonRadius;
    float r2 = dot(q, q);
    float ang = acos(clamp(md, -1.0, 1.0));
    vec3 col = uMoonCol * uMoonGlow * (exp(-ang * ang / 0.003) * 0.5 + exp(-ang * 9.0) * 0.12);
    if (r2 < 1.0) {
      vec3 n = q - uMoonDir * sqrt(1.0 - r2);
      float lit = smoothstep(-0.05, 0.09, dot(n, uSunDir));
      vec2 mp = vec2(q.x + q.z * 0.6, q.y - q.z * 0.4) * 2.2;
      float seas = noise(mp * 1.7 + 3.0) * 0.6 + noise(mp * 4.3 + 1.0) * 0.4;
      vec3 surf = vec3(0.96, 0.95, 0.9) * (0.68 + 0.4 * smoothstep(0.32, 0.72, seas));
      float limb = 0.72 + 0.28 * sqrt(1.0 - r2);
      cover = smoothstep(1.0, 0.9, r2);
      col += surf * limb * (lit * 1.7 + uEarthshine) * cover;
    }
    return col;
  }

  // Rainbow colour across the band: x = -1 inner edge (violet) .. +1 outer edge (red).
  vec3 rainbowColour(float x) {
    float h = (1.0 - clamp(x * 0.5 + 0.5, 0.0, 1.0)) * 0.78;
    return clamp(abs(fract(h + vec3(0.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0) - 1.0, 0.0, 1.0);
  }

  void main() {
    vec3 dir = normalize(vDir);
    float up = max(dir.y, 0.0);
    vec3 base = skyColor(dir);
    vec3 col = base;
    float above = smoothstep(-0.01, 0.07, dir.y);

    // Moon (worked out first so its disc can hide the stars behind it).
    float moonCover = 0.0;
    vec3 moonCol = vec3(0.0);
    if (uMoonVis > 0.001) moonCol = moonDisc(dir, moonCover);

    // Night sky: stars on the turning sky sphere, our geometric star patterns, a faint band of distant stars, the aurora.
    if (uStarVis > 0.002) {
      vec3 c = vec3(dot(dir, uCelX), dot(dir, uCelY), dot(dir, uCelZ));
      vec3 stars = starLayer(c, 70.0, uStarDensity, 0.0042, 0.0);
      if (uStarLayers > 1) stars += starLayer(c, 160.0, uStarDensity * 0.8, 0.0026, 11.0) * 0.6;
      vec3 bandN = normalize(vec3(0.35, 0.6, 0.72));
      float band = exp(-pow(dot(c, bandN), 2.0) / 0.03);
      stars += vec3(0.55, 0.6, 0.8) * band * (0.25 + 0.75 * noise(c.xy * 9.0 + c.z * 4.0)) * 0.05;
      stars += patternStars(c);
      float extinction = smoothstep(0.0, 0.25, dir.y);
      // A bright moon washes out the fainter stars, most of all close to it.
      float moonAng = acos(clamp(dot(dir, uMoonDir), -1.0, 1.0));
      float wash = 1.0 - clamp(uMoonGlow * 2.2 * (0.3 + exp(-moonAng * 3.0)), 0.0, 0.85);
      col += stars * uStarBright * uStarVis * above * extinction * (1.0 - moonCover) * wash;
    }
    if (uAurora > 0.002) col += aurora(dir) * uAurora * above;

    // Moon: by day only its lit part shows, faintly; at night it covers the sky behind it.
    if (uMoonVis > 0.001) col = mix(col, max(col, col * (1.0 - moonCover) + moonCol), uMoonVis);

    // Shooting star: a short bright streak with a fading tail, drawn behind the clouds.
    if (uMeteor.y > 0.001) {
      vec3 head = normalize(mix(uMeteorA, uMeteorB, uMeteor.x));
      vec3 tail = normalize(mix(uMeteorA, uMeteorB, max(uMeteor.x - 0.35, 0.0)));
      vec3 ab = head - tail;
      float t = clamp(dot(dir - tail, ab) / max(dot(ab, ab), 1e-7), 0.0, 1.0);
      float d = length(dir - (tail + ab * t));
      col += vec3(1.0, 0.95, 0.86) * uMeteor.y * t * t * smoothstep(0.0022, 0.0, d) * 2.2 * above;
    }

    // Clouds fade out near the horizon, so they melt into the haze with no hard line.
    float horizonFade = smoothstep(0.02, 0.3, dir.y);

    // Key light direction on the flat cloud plane, and tint for the warm glow near the sun.
    vec2 litXZ = uLightDir.xz / max(length(uLightDir.xz), 0.0001);
    float sunNear = pow(max(dot(dir, uSunDir), 0.0), 6.0) * clamp(uSunGlow, 0.0, 1.0);
    vec3 sunGlowTint = mix(uSunColor, uWarmGlow, sunWarmth());

    // Layer 1 (behind): high, thin wisps stretched along the wind. Always 2 octaves.
    vec2 hp0 = dir.xz / (up + 0.1) * uHighScale;
    vec2 across = vec2(-uWindDir.y, uWindDir.x);
    vec2 hp = vec2(dot(hp0, uWindDir) / uHighStretch + uHighOffset, dot(hp0, across));
    float wisp = fbm(hp, 2);
    float highMask = smoothstep(uHighCover, uHighCover + 0.2, wisp) * uHighOpacity * smoothstep(0.1, 0.5, dir.y);
    vec3 highCol = mix(uCloudColor, sunGlowTint, sunNear * 0.6);
    col = mix(col, highCol, highMask);

    // Layer 2 (front): low, puffy clouds. Octave count comes from the quality level.
    vec2 lp = dir.xz / (up + 0.2) * uLowScale + uLowOffset;
    float lowD = fbm(lp, uCloudOctaves);
    // Second sample, nudged towards the light. If that point is thinner, this spot faces the light.
    float lowSun = fbm(lp + litXZ * uLowLightOffset, uCloudOctaves);
    float lightDiff = (lowD - lowSun) * uLowEdge;
    float lowLit = clamp(0.5 + lightDiff, 0.0, 1.0);     // 0 = shade side, 1 = lit side
    float rim = smoothstep(0.0, 0.25, lightDiff);        // silver rim on the lit side
    float lowMask = smoothstep(uLowCover, uLowCover + 0.22, lowD) * horizonFade;
    vec3 lowCol = mix(uCloudShadow, uCloudColor, lowLit); // shaded bases, bright tops
    lowCol += uLightColor * rim * uSilverStrength * 0.8;  // silver edges (moonlit at night)
    lowCol += sunGlowTint * sunNear * 0.35 * uSunGlow;    // warm glow near the sun
    col = mix(col, lowCol, lowMask);

    // Rainbow: a ring 42 degrees from the point opposite the sun, red outside, with a faint second bow outside it.
    if (uRainbow > 0.001) {
      float ang = acos(clamp(dot(dir, -uSunDir), -1.0, 1.0));
      float x = (ang - uRainbowAngle) / uRainbowWidth;
      float band = smoothstep(1.25, 0.75, abs(x));

// Everything the sea needs to know about islands lives here, in two matching copies: GLSL (the ocean
// shader) and JavaScript (ship motion, grounding, terrain meshes). KEEP THEM IN STEP.
// An island: centre (cx, cz), radius R, type (0 sand cay, 1 atoll), four wobble phases, and for atolls a
// channel angle. The shoreline is the curve r = R * (1 + wobble(angle)), so u = r / that radius is exactly

const MAX_ISLES = 8;

// Converts the CONFIG wave list into the two vec4 arrays the shader reads (always 8 entries).
// uWaveA: (dirX, dirZ, wave number k, amplitude). uWaveB: (phase speed, steepness, unused, unused).
function buildWaveUniforms() {
  const oc = CONFIG.ocean;
  const waveA = [];
  const waveB = [];
  for (let i = 0; i < 8; i++) {
    const w = oc.waves[i];
    const len = Math.hypot(w.dirX, w.dirZ) || 1;
    const k = (2 * Math.PI) / w.wavelength;
    waveA.push(new THREE.Vector4(w.dirX / len, w.dirZ / len, k, w.amplitude * oc.waveHeight));
    waveB.push(new THREE.Vector4(w.speed * oc.waveSpeed, w.steepness, 0, 0));
  }
  return { waveA, waveB };
}

  uniform vec4 uWaveB[8];
  uniform int uWaveCount;
  uniform float uHalfSize;
  uniform float uGridPower;
  uniform float uWaveScale;   // weather swell: scales wave height and slope (mirrored in JS by waveScale)
  varying vec3 vWorldPos;
  varying vec3 vNormal;
  varying float vHeight;   // normalised wave height, roughly -1..1
  varying float vFold;     // Gerstner pinch term: high on sharp crests, drives foam

  void main() {
    // Warp the grid: dense near the centre, sparse at the edges.
    vec2 p = position.xz;
    p = sign(p) * pow(abs(p) / uHalfSize, vec2(uGridPower)) * uHalfSize;

    // Move to WORLD space first, so wave phases stay fixed while the mesh follows the camera.
    vec2 w = (modelMatrix * vec4(p.x, 0.0, p.y, 1.0)).xz;

    float dx = 0.0;
    float dy = 0.0;
    float dz = 0.0;
    float sx = 0.0;
    float sy = 0.0;
    float sz = 0.0;
    float ampSum = 0.0;

    // Sum the active Gerstner waves: they push points sideways as well as up, giving sharp, realistic crests.
    for (int i = 0; i < 8; i++) {
      if (i >= uWaveCount) break;
      vec2 dir = uWaveA[i].xy;
      float k = uWaveA[i].z;
      float a = uWaveA[i].w;
      float c = uWaveB[i].x;
      float steep = uWaveB[i].y;

      float phase = k * (dot(dir, w) - c * uTime);
      float cosP = cos(phase);
      float sinP = sin(phase);
      float q = steep / (k * a * 4.0 + 0.0001);  // limits sideways push so crests do not fold over

      dx += q * a * dir.x * cosP;
      dz += q * a * dir.y * cosP;
      dy += a * sinP;

      sx += dir.x * k * a * cosP;
      sz += dir.y * k * a * cosP;
      sy += q * k * a * sinP;

      ampSum += a;
    }

    float shelter = isleShelter(w);

    vec3 n = normalize(vec3(-sx, 1.0 - sy, -sz));

    vWorldPos = worldPos;
    vNormal = n;

    vFold = sy;

    gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);

    float c = dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
    float d = dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }

  // Tilt (x, z) from procedural ripples scrolling in different directions. Fewer octaves on Low.
  vec2 detailTilt(vec2 w, float t) {
    vec2 g = vec2(0.0);
    float amp = 1.0;
    float freq = uDetailScale;
    for (int i = 0; i < 3; i++) {
      if (i >= uDetailOctaves) break;
      vec2 scroll = (i == 0)
        ? vec2(t * uDetailSpeed, t * uDetailSpeed * 0.6)
        : vec2(-t * uDetailSpeed * 0.8, t * uDetailSpeed * 0.5);
      vec2 p = w * freq + scroll;
      float e = 0.1;
      float hx = gnoise(p + vec2(e, 0.0)) - gnoise(p - vec2(e, 0.0));
      float hz = gnoise(p + vec2(0.0, e)) - gnoise(p - vec2(0.0, e));
      g += vec2(hx, hz) * (amp / (2.0 * e));
      amp *= 0.5;
      freq *= 2.1;
    }
    return g;
  }

  // Rain rings: each small cell holds one ring that grows and fades at its own time. Returns (tilt x, tilt z, brightness).
  vec3 rainRings(vec2 w, float t) {
    vec3 acc = vec3(0.0);
    for (int k = 0; k < 2; k++) {
      if (k >= uRainRings) break;
      vec2 g = w * (k == 0 ? 0.9 : 1.7) + float(k) * 7.3;
      vec2 id = floor(g);
      vec2 f = fract(g) - 0.5;
      vec2 hs = hash2(id + float(k) * 19.0) * 0.5 + 0.5;
      vec2 c = (hs - 0.5) * 0.4;
      float ph = fract(t * (0.8 + 0.6 * hs.x) + hs.y);
      vec2 d = f - c;
      float l = length(d);
      float ring = smoothstep(0.05, 0.0, abs(l - ph * 0.42)) * (1.0 - ph) * (1.0 - ph);
      acc.xy += d / max(l, 0.001) * ring;
      acc.z += ring;
    }
    return acc;
  }

  void main() {
    vec3 camPos = cameraPosition;
    vec3 toCam = camPos - vWorldPos;
    float dist = length(toCam);
    vec3 V = toCam / max(dist, 0.0001);
    vec3 L = uLightDir;
    vec2 w = vWorldPos.xz;
    float lightLum = dot(uLightColor, vec3(0.3, 0.55, 0.15));
    // Foam takes the light of the scene (white by day, dim blue under the moon).
    vec3 foamC = uFoamColor * min(uHorizonColor * 0.55 + uTopColor * 0.15 + uLightColor * 0.55, vec3(1.15));

    // a) Detail normals: ripples fade with distance so far water stays smooth and does not shimmer.
    float detailFade = 1.0 - smoothstep(uDetailFadeNear, uDetailFadeFar, dist);
    vec2 tilt = detailTilt(w, uTime) * (uDetailStrength * detailFade);
    vec3 N = normalize(vec3(vNormal.x - tilt.x, vNormal.y, vNormal.z - tilt.y));

    // Rain: small rings spread on the water close to the camera.
    float ringGlow = 0.0;
    if (uRain > 0.01 && uRainRings > 0) {
      float rf = uRain * (1.0 - smoothstep(18.0, 60.0, dist));
      if (rf > 0.001) {
        vec3 rr = rainRings(w, uTime);
        N = normalize(N + vec3(rr.x, 0.0, rr.y) * rf * 0.35);
        ringGlow = rr.z * rf;
      }
    }

    // k) Large-scale colour variation: one noise sample on Low, a finer layer added on High.
    float colourN = gnoise(w * uColourScale + vec2(uTime * uColourDrift, uTime * uColourDrift * 0.5));
    float varT = clamp(0.5 + colourN * uColourStrength, 0.0, 1.0);
    if (uVariationSamples >= 3) {
      float fineN = gnoise(w * uFineScale + vec2(-uTime * uFineDrift, uTime * uFineDrift * 0.75));
      varT = clamp(varT + fineN * uFineStrength, 0.0, 1.0);
    }

    // Body colour: deep in troughs, lighter on crests. The deep blue shifts towards blue-green.
    float tBody = smoothstep(-0.5, 0.7, vHeight);
    vec3 deepVar = mix(uDeepColor, uTealColor, varT);
    vec3 body = mix(deepVar, uShallowColor, tBody) * uBodyLight * (1.0 - 0.15 * uRain);

    // Soft darker patches, like cloud shadows on the sea (Med and High only).
    if (uVariationSamples >= 2) {
      float shadowN = gnoise(w * uShadowScale + vec2(uTime * uShadowDrift, -uTime * uShadowDrift * 0.4));
      float shadow = smoothstep(uShadowThreshold, uShadowThreshold + uShadowSoftness, shadowN);
      body *= mix(1.0, uShadowDarken, shadow);
    }

    // l) Shallows and shoreline. The sea floor near islands shows through the water, fading to deep blue,
    //    and foam breaks in bands that travel towards the beach.
    float shoreD = isleDepth(w);
    float shoreFoam = 0.0;
    if (shoreD < 14.0) {
      float dw = max(shoreD, 0.0);
      vec3 absorb = exp(-dw * vec3(0.42, 0.14, 0.10));
      float rip = 0.0;
      if (uShoreDetail > 0) {
        rip = 0.08 * sin(dot(w, vec2(0.83, 0.55)) * 1.9 + gnoise(w * 0.15) * 7.0) + 0.1 * gnoise(w * 0.8);
      }
      vec3 lightCol = uHorizonColor * 0.45 + uLightColor * 0.55;
      vec3 bedLit = uSandColor * (0.92 + rip) * lightCol;
      vec3 seen = bedLit * absorb + uShoreTint * lightCol * (1.0 - absorb);
      body = mix(body, seen, exp(-dw * 0.38) * 0.95);

      float ed = shoreD * 9.0;
      float ph = ed * 0.34 - uTime * 1.05 + gnoise(w * 0.035) * 5.0;
      float band = smoothstep(0.55, 0.95, sin(ph)) * exp(-max(ed, 0.0) * 0.06);
      float lace2 = 1.0;
      if (uShoreDetail > 0) lace2 = smoothstep(-0.25, 0.3, gnoise(w * 0.9 + vec2(uTime * 0.12, 0.0)));
      float edgeFoam = smoothstep(0.6, 0.0, shoreD) * smoothstep(-0.5, -0.05, shoreD);
      shoreFoam = clamp(band * (0.45 + 0.55 * lace2) + edgeFoam * (0.55 + 0.45 * lace2), 0.0, 1.0)
                * (1.0 - smoothstep(140.0, 380.0, dist));
    }

    // b) Sky reflection, from the same sky function the sky shader uses.
    vec3 reflection = skyColor(reflect(-V, N));

    // c) Fresnel (Schlick): grazing angles reflect more sky.
    float cosV = max(dot(N, V), 0.0);
    float fres = uF0 + (1.0 - uF0) * pow(1.0 - cosV, 5.0);
    vec3 col = mix(body, reflection, clamp(fres, 0.0, 1.0));

    // d) Subsurface glow: turquoise light through the wave tops when looking towards the sun.
    float sss = pow(clamp(dot(V, -L + N * 0.6), 0.0, 1.0), 4.0)
              * smoothstep(0.0, 1.0, vHeight + 0.3);
    col += uSssColor * sss * uSssStrength * min(lightLum, 1.0);

    // e) Sun reflection: a microfacet GGX lobe gives the sea a more plausible, compact highlight.
    // Roughness increases in rain and under low sun; the existing broad/sharp lobes remain as a stylised accent.
    vec3 H = normalize(L + V);
    float nh = max(dot(N, H), 0.0);
    float ndlSpec = max(dot(N, L), 0.0);
    float ndvSpec = max(dot(N, V), 0.0);
    float vdhSpec = max(dot(V, H), 0.0);
    float roughness = mix(0.14, 0.31, clamp(uRain * 0.82 + (1.0 - smoothstep(0.05, 0.45, uSunDir.y)) * 0.12, 0.0, 1.0));
    float alpha = roughness * roughness;
    float alpha2 = alpha * alpha;
    float dTerm = nh * nh * (alpha2 - 1.0) + 1.0;
    float distribution = alpha2 / max(3.14159265 * dTerm * dTerm, 0.0001);
    float geomK = (roughness + 1.0);
    geomK = geomK * geomK * 0.125;
    float geomV = ndvSpec / max(ndvSpec * (1.0 - geomK) + geomK, 0.0001);
    float geomL = ndlSpec / max(ndlSpec * (1.0 - geomK) + geomK, 0.0001);
    float fresnelSpec = uF0 + (1.0 - uF0) * pow(1.0 - vdhSpec, 5.0);
    float ggxSpecular = distribution * geomV * geomL * fresnelSpec / max(4.0 * ndvSpec * ndlSpec, 0.001);
    col += uLightColor * ggxSpecular * ndlSpec * 0.075 * (1.0 - 0.65 * uRain);

    float glintSharp = pow(nh, uSunShininess) * uSunStrength;
    float glintBroad = pow(nh, uSunBroadShininess) * uSunBroadStrength;
    col += uLightColor * (glintSharp + glintBroad) * (1.0 - 0.6 * uRain);

    // j) Sun sparkle: tiny twinkling points inside the sun path, faded with distance (Med and High only).
    if (uSparkleAmount > 0.0) {
      float pathMask = pow(nh, uSunBroadShininess);   // broad lobe: keeps sparkles near the sun path
      vec2 sk = w * uSparkleScale + vec2(uTime * uSparkleSpeed * 0.3, -uTime * uSparkleSpeed * 0.2);
      float sn = gnoise(sk);
      float spark = smoothstep(uSparkleThreshold, uSparkleThreshold + uSparkleSoftness, sn);
      float twinkle = 0.5 + 0.5 * sin(uTime * uTwinkleRate + gnoise(sk * 1.7) * 12.0);
      float sparkFade = 1.0 - smoothstep(uSparkleFadeNear, uSparkleFadeFar, dist);
      col += uLightColor * (spark * twinkle * pathMask * sparkFade * uSparkleStrength) * (1.0 - uRain);
    }

    // f) Foam: starts where the fold passes the threshold, broken up by drifting world-space noise.
    float fold = smoothstep(uFoamThreshold, uFoamThreshold + uFoamSoftness, vFold);
    vec2 fp = w * uFoamNoiseScale + vec2(uTime * uFoamDrift, uTime * uFoamDrift * 0.7);
    float foamPatch = 0.6 * gnoise(fp) + 0.4 * gnoise(fp * 2.3 + vec2(4.1, 1.7));
    float lace = smoothstep(-0.1, 0.35, foamPatch);
    // Faint streaks running along the wave faces.
    vec2 sp = vec2(dot(w, vec2(0.9, 0.4)) * 0.3, dot(w, vec2(-0.4, 0.9)) * 2.2);
    float streak = smoothstep(0.1, 0.6, gnoise(sp + vec2(uTime * 0.05, 0.0)))
                 * clamp(vHeight + 0.5, 0.0, 1.0) * uStreakStrength;
    float foam = clamp(fold * lace + streak, 0.0, 1.0);
    foam = max(foam, shoreFoam);
    col = mix(col, foamC, foam * 0.9);

    // i) Gentle whitecaps on the crests of the two largest waves, with a soft trail behind each crest.
    // The crest phase is recalculated here with the same formula as the vertex shader.
    float cap = 0.0;
    float trail = 0.0;
    for (int i = 0; i < 2; i++) {
      vec2 wd = uWaveA[i].xy;
      float wk = uWaveA[i].z;
      float ph = wk * (dot(wd, w) - uWaveB[i].x * uTime);
      float s = sin(ph);      // 1 at the crest
      float c = cos(ph);      // positive just behind the crest
      cap = max(cap, smoothstep(uCapThreshold, uCapThreshold + uCapSoftness, s));
      trail = max(trail, smoothstep(0.0, uTrailSpread, c) * smoothstep(uTrailHeight, 1.0, s));
    }
    // Lacy erosion: drifting noise breaks the caps into patches.
    vec2 ep = w * uErosionScale + vec2(uTime * uErosionDrift, -uTime * uErosionDrift * 0.6);
    float capLace = smoothstep(uErosionEdge, uErosionEdge + uErosionSoftness, gnoise(ep));
    float whitecap = (cap * uCapStrength + trail * uTrailStrength) * capLace;
    col = mix(col, foamC, clamp(whitecap, 0.0, 1.0));
    col = mix(col, foamC, clamp(ringGlow * 0.22, 0.0, 0.4));

    // g) Exponential-squared fog. Forced fully on before the plane edge, and tinted with the sky
    //    in the view direction so the horizon blends with no seam.
    float fogAmt = 1.0 - exp(-pow(dist * (uFogDensity + uFogExtra), 2.0));
    fogAmt = max(fogAmt, smoothstep(uFogFar * 0.75, uFogFar, dist));
    vec3 fogCol = skyColor(normalize(vWorldPos - camPos));
    col = mix(col, fogCol, clamp(fogAmt, 0.0, 1.0));

    // h) Exposure, ACES tone map, gamma.
    gl_FragColor = vec4(finishColor(col), 1.0);
  }
`;

// Builds a flat square of water with the given number of segments per side, lying in the XZ plane.
function buildOceanGeometry(segments) {
  const geo = new THREE.PlaneGeometry(CONFIG.ocean.size, CONFIG.ocean.size, segments, segments);
  geo.rotateX(-Math.PI / 2);
  return geo;
}

const ocean = new THREE.Mesh(buildOceanGeometry(currentQuality().gridSegments), oceanMaterial);
ocean.frustumCulled = false;  // vertices move, so the flat bounds box is not reliable
scene.add(ocean);

// Swaps the ocean grid for a new resolution and frees the old geometry.
function setOceanSegments(segments) {
  const old = ocean.geometry;
  ocean.geometry = buildOceanGeometry(segments);
  old.dispose();
}

const COSMETICS = CONFIG.customization;
function loadCosmeticPrefs() {
  const defaults = { hull: 'ocean', trim: 'brass', sailPattern: 'plain', flagPattern: 'plain', unlockedHulls: ['ocean'], unlockedTrims: ['brass'], unlockedPatterns: ['plain'] };
  try {
    const raw = window.localStorage.getItem(COSMETICS.storageKey);
    if (!raw) return defaults;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return defaults;
    for (const key of ['hull', 'trim', 'sailPattern', 'flagPattern']) {
      const list = key === 'hull' ? COSMETICS.hulls : key === 'trim' ? COSMETICS.trims : COSMETICS.patterns;
      if (typeof data[key] === 'string' && list.some((item) => item.id === data[key])) defaults[key] = data[key];
    }
    const validArray = (value, items, fallback) => Array.isArray(value)
      ? Array.from(new Set(value.filter((id) => typeof id === 'string' && items.some((item) => item.id === id))).values())
      : fallback.slice();
    defaults.unlockedHulls = validArray(data.unlockedHulls, COSMETICS.hulls, defaults.unlockedHulls);
    defaults.unlockedTrims = validArray(data.unlockedTrims, COSMETICS.trims, defaults.unlockedTrims);
    defaults.unlockedPatterns = validArray(data.unlockedPatterns, COSMETICS.patterns, defaults.unlockedPatterns);
    ['ocean'].forEach((id) => { if (!defaults.unlockedHulls.includes(id)) defaults.unlockedHulls.push(id); });
    ['brass'].forEach((id) => { if (!defaults.unlockedTrims.includes(id)) defaults.unlockedTrims.push(id); });
    ['plain'].forEach((id) => { if (!defaults.unlockedPatterns.includes(id)) defaults.unlockedPatterns.push(id); });
    return defaults;
  } catch (e) { return defaults; }
}
