  const mesh = new THREE.Mesh(geo, I.type >= 2 ? islandRockMaterial : islandMaterial);
  mesh.position.set(I.cx, 0, I.cz);
  I.tris = idx.length / 3;
  return mesh;
}

function freeIsland(I) {
  disposeLandmark(I);
  disposeIslandMesh(I);
  disposePlants(I);
  const k = islands.indexOf(I);
  if (k >= 0) islands.splice(k, 1);
}

function buildIsland(I) {
  const dist = Math.hypot(I.cx - ship.x, I.cz - ship.z);
  I.lod = dist > WORLD.lodFar ? 1 : 0;
  I.mesh = makeIslandMesh(I);
  islandGroup.add(I.mesh);
  if (islands.indexOf(I) < 0) islands.push(I);
  buildLandmark(I);
  buildPlants(I);
  if (I.mate) buildIsland(I.mate);
}
function disposeIslandMesh(I) {
  if (!I.mesh) return;
  islandGroup.remove(I.mesh);
  I.mesh.geometry.dispose();
  I.mesh = null;
}

// Copies the nearest islands into the arrays the ocean shader reads.
function syncIslandUniforms() {
  const near = islands.slice().sort((a, b) =>
    Math.hypot(a.cx - ship.x, a.cz - ship.z) - Math.hypot(b.cx - ship.x, b.cz - ship.z));
  for (let i = 0; i < MAX_ISLES; i++) {
    const I = near[i];
    if (!I) { isleA[i].set(0, 0, 0, -1); continue; }
    isleA[i].set(I.cx, I.cz, I.R, I.type);
    isleP[i].set(I.ph[0], I.ph[1], I.ph[2], I.ph[3]);
    isleB[i].set(I.gap, I.hMax, I.slope, I.pw);
  }
}

// Builds islands near the ship and frees far ones. force = build everything now (start-up).
function updateWorld(dt, force) {
  worldTimer -= dt;
  if (!force && worldTimer > 0) return;
  worldTimer = 0.25;
  const cs = WORLD.cellSize, range = WORLD.cellRange;
  const ci = Math.round(ship.x / cs), cj = Math.round(ship.z / cs);
  let changed = false;
  const lr = WORLD.landmarkRange;
  for (let di = -lr; di <= lr; di++) {
    for (let dj = -lr; dj <= lr; dj++) {
      const i = ci + di, j = cj + dj, key = i + ',' + j;
      if (cellPlans.has(key)) continue;
      const plan = planCell(i, j);
      if (!plan) { cellPlans.set(key, null); continue; }
      const lmk = plan.type >= 2;
      if (!lmk && (Math.abs(di) > range || Math.abs(dj) > range)) continue;
      if (Math.hypot(plan.cx - ship.x, plan.cz - ship.z) > (lmk ? WORLD.landmarkBuild : WORLD.buildDistance)) continue;   // planned again later
      cellPlans.set(key, plan);
      worldQueue.push(plan);
    }
  }
  // Free islands that are far behind. The plan stays, so coming back rebuilds the same island.
  for (let n = islands.length - 1; n >= 0; n--) {
    const I = islands[n];
    if (I.parent) continue;   // a mate goes with its first stack
    if (Math.hypot(I.cx - ship.x, I.cz - ship.z) > (I.type >= 2 ? WORLD.landmarkKeep : WORLD.keepDistance)) {
      freeIsland(I);
      if (I.mate) freeIsland(I.mate);
      cellPlans.delete(I.key);
      changed = true;
    }
  }
  // Rebuild one island whose level of detail no longer fits its distance.
  if (!force) {
    for (let n = 0; n < islands.length; n++) {
      const I = islands[n];
      const dist = Math.hypot(I.cx - ship.x, I.cz - ship.z);
      if ((I.lod === 0 && dist > WORLD.lodFar) || (I.lod === 1 && dist < WORLD.lodNear)) {
        disposeIslandMesh(I);
        I.lod = I.lod === 0 ? 1 : 0;
        I.mesh = makeIslandMesh(I);
        islandGroup.add(I.mesh);
        break;
      }
    }
  }
  updatePlantVisibility();
  const perTick = force ? worldQueue.length : 1;
  for (let n = 0; n < perTick && worldQueue.length; n++) {
    const I = worldQueue.shift();
    if (!cellPlans.has(I.key)) continue;
    buildIsland(I);
    changed = true;
  }
  if (changed) syncIslandUniforms();
}

// Graphics level changed: rebuild every island with the new grid size.
function rebuildIslands() {
  islandMaterial.uniforms.uDetail.value = currentQuality().islandDetail;
  oceanMaterial.uniforms.uShoreDetail.value = currentQuality().shoreDetail;
  for (let n = 0; n < islands.length; n++) {
    disposeIslandMesh(islands[n]);
    islands[n].mesh = makeIslandMesh(islands[n]);
    islandGroup.add(islands[n].mesh);
  }
  rebuildLandmarks();
  rebuildPlants();
}

// Would a ship at this position (heading forward fx, fz) touch the sea floor? Checks bow, middle, stern and both sides.
function shoalDepth(x, z, fx, fz, rx, rz) {
  const L = SHIP_HALF_L, B = SHIP_HALF_B, lim = -WORLD.groundDepth;
  let m = islandBedAt(x + fx * (L + 1.0), z + fz * (L + 1.0));
  m = Math.max(m, islandBedAt(x + fx * L * 0.5, z + fz * L * 0.5));
  m = Math.max(m, islandBedAt(x, z));
  m = Math.max(m, islandBedAt(x - fx * L, z - fz * L));
  m = Math.max(m, islandBedAt(x + rx * B, z + rz * B));
  m = Math.max(m, islandBedAt(x - rx * B, z - rz * B));
  return m - lim;   // above 0: the hull touches the sea floor. The bigger, the further onto the island.
}
function shoalAt(x, z, fx, fz, rx, rz) { return shoalDepth(x, z, fx, fz, rx, rz) > 0; }
let lastShoalToast = -1e9;

// ===== PLANTS =====
// Phase 2: palms, grass tufts, shrubs, rocks and driftwood on every island.
// Everything is placed from the island's own seed (same seed = same island) and built from smooth curves.
// Palms and grass are INSTANCED (one template, many copies); shrubs, rocks and driftwood are baked into one
// merged mesh per island. So each island adds only three draw calls. Wind sway runs in the vertex shader.
// Colour comes from the shader (height, slope, wetness, noise); there are no texture files.
const PL = CONFIG.plants;
const PLANT_COL_KEYS = Object.keys(PL.colours);
const PART_TRUNK = 0, PART_FROND = 1, PART_GRASS = 2, PART_SHRUB = 3, PART_ROCK = 4, PART_WOOD = 5, PART_NUT = 6;

// ----- Mesh builder for plants -----
// Collects vertices with the attributes the plant shader needs: normal, part id, sway (metres), height gradient, seed, UV.
function PB() {
  this.pos = []; this.nrm = []; this.part = []; this.sway = []; this.g = []; this.seed = []; this.uv = []; this.idx = [];
}
PB.prototype.vert = function (p, n, part, sway, g, seed, u, v) {
  this.pos.push(p[0], p[1], p[2]);
  this.nrm.push(n[0], n[1], n[2]);
  this.part.push(part); this.sway.push(sway); this.g.push(g); this.seed.push(seed); this.uv.push(u, v);
  return this.part.length - 1;
};
PB.prototype.tri = function (a, b, c) { this.idx.push(a, b, c); };
PB.prototype.quad = function (a, b, c, d) { this.idx.push(a, b, c, a, c, d); };
// Smooth normals for the vertices added since v0, from the triangles added since i0. With a centre, normals point away from it.
PB.prototype.smooth = function (v0, i0, cen) {
  const pos = this.pos, nrm = this.nrm, idx = this.idx;
  for (let i = v0 * 3; i < nrm.length; i++) nrm[i] = 0;
  for (let t = i0; t < idx.length; t += 3) {
    const a = idx[t] * 3, b = idx[t + 1] * 3, c = idx[t + 2] * 3;
    const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
    const fx = uy * vz - uz * vy, fy = uz * vx - ux * vz, fz = ux * vy - uy * vx;
    nrm[a] += fx; nrm[a + 1] += fy; nrm[a + 2] += fz;
    nrm[b] += fx; nrm[b + 1] += fy; nrm[b + 2] += fz;
    nrm[c] += fx; nrm[c + 1] += fy; nrm[c + 2] += fz;
  }
  for (let i = v0 * 3; i < nrm.length; i += 3) {
    let x = nrm[i], y = nrm[i + 1], z = nrm[i + 2];
    const l = Math.hypot(x, y, z) || 1;
    x /= l; y /= l; z /= l;
    if (cen && x * (pos[i] - cen[0]) + y * (pos[i + 1] - cen[1]) + z * (pos[i + 2] - cen[2]) < 0) { x = -x; y = -y; z = -z; }
    nrm[i] = x; nrm[i + 1] = y; nrm[i + 2] = z;
  }
};
// Tilts the normals of the vertices added since v0 towards "up", so thin blades light like a soft carpet.
PB.prototype.lift = function (v0, amt) {
  const nrm = this.nrm;
  for (let i = v0 * 3; i < nrm.length; i += 3) {
    const y = nrm[i + 1] + amt;
    const l = Math.hypot(nrm[i], y, nrm[i + 2]) || 1;
    nrm[i] /= l; nrm[i + 1] = y / l; nrm[i + 2] /= l;
  }
};
PB.prototype.pack = function () {
  const n = this.part.length;
  const Idx = n > 65535 ? Uint32Array : Uint16Array;
  return {
    pos: new Float32Array(this.pos), nrm: new Float32Array(this.nrm), part: new Float32Array(this.part),
    sway: new Float32Array(this.sway), g: new Float32Array(this.g), seed: new Float32Array(this.seed),
    uv: new Float32Array(this.uv), idx: new Idx(this.idx), count: n,
  };
};

function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm3(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

// A smooth round tube along a list of points. Radial normals, rings wrap round (no seam). ref picks the frame's reference
// direction (up for a lying log, the z axis for a standing trunk). caps closes the two ends.
function plantTube(b, pts, rad, sides, part, sway, gArr, seed, ref, caps) {
  const n = pts.length;
  const rings = [];
  let along = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(i - 1, 0)], c = pts[Math.min(i + 1, n - 1)];
    const T = norm3([c[0] - a[0], c[1] - a[1], c[2] - a[2]]);
    let B = cross3(T, ref);
    if (Math.hypot(B[0], B[1], B[2]) < 1e-4) B = cross3(T, [1, 0, 0]);
    B = norm3(B);
    const U = cross3(T, B);
    if (i > 0) along += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]);
    const ring = [];
    for (let s = 0; s < sides; s++) {
      const an = (s / sides) * Math.PI * 2, cs = Math.cos(an), sn = Math.sin(an);
      const d = [cs * B[0] + sn * U[0], cs * B[1] + sn * U[1], cs * B[2] + sn * U[2]];
      ring.push(b.vert([pts[i][0] + d[0] * rad[i], pts[i][1] + d[1] * rad[i], pts[i][2] + d[2] * rad[i]], d, part, sway[i], gArr[i], seed, s / sides, along));
    }
    rings.push(ring);
  }
  for (let i = 0; i < n - 1; i++) {
    for (let s = 0; s < sides; s++) {
      const s1 = (s + 1) % sides;
      b.quad(rings[i][s], rings[i][s1], rings[i + 1][s1], rings[i + 1][s]);
    }
  }
  if (caps) {
    for (const end of [0, n - 1]) {
      const dirv = end === 0 ? [pts[0][0] - pts[1][0], pts[0][1] - pts[1][1], pts[0][2] - pts[1][2]] : [pts[n - 1][0] - pts[n - 2][0], pts[n - 1][1] - pts[n - 2][1], pts[n - 1][2] - pts[n - 2][2]];
      const nn = norm3(dirv);
      const ci = b.vert(pts[end], nn, part, sway[end], gArr[end], seed, 0.5, along);
      for (let s = 0; s < sides; s++) b.tri(ci, rings[end][s], rings[end][(s + 1) % sides]);
    }
  }
}

// A smooth, noise-bent blob: used for shrubs, rocks and coconuts. Poles are single vertices; rings wrap round.
// o = { amp, freq, seed, part, sway, flat, yaw, ridge }
function plantBlob(b, cx, cy, cz, rx, ry, rz, rings, sectors, o) {
  const v0 = b.part.length, i0 = b.idx.length;
  const cw = Math.cos(o.yaw || 0), sw = Math.sin(o.yaw || 0);
  const ox = o.seed * 7.31, oz = o.seed * 3.17;
  const sid = Math.floor(o.seed * 1000) & 255;
  const vertex = (dx, dy, dz) => {
    const nz = fbmJS(dx * o.freq + dy * o.freq * 0.57 + ox, dz * o.freq - dy * o.freq * 0.33 + oz, sid, 2);
    const rg = 1 - Math.abs(2 * nz - 1);
    const f = 1 + o.amp * ((mixJS(nz, rg, o.ridge || 0) - 0.5) * 2);
    let px = dx * rx * f, py = dy * ry * f, pz = dz * rz * f;
    if (dy < 0 && o.flat !== undefined) py *= o.flat;
    const g = (dy + 1) / 2;
    return b.vert([cx + cw * px + sw * pz, cy + py, cz - sw * px + cw * pz], [dx, dy, dz], o.part, o.sway * g * g, g, o.seed, 0, 0);
  };
  const top = vertex(0, 1, 0);
  for (let r = 1; r < rings; r++) {
    const th = (r / rings) * Math.PI;
    for (let s = 0; s < sectors; s++) {
      const ph = (s / sectors) * Math.PI * 2;
      vertex(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph));
    }
  }
  const bottom = vertex(0, -1, 0);
  const ringAt = (r, s) => v0 + 1 + (r - 1) * sectors + (s % sectors);
  for (let s = 0; s < sectors; s++) b.tri(top, ringAt(1, s), ringAt(1, s + 1));
  for (let r = 1; r < rings - 1; r++) {
    for (let s = 0; s < sectors; s++) b.quad(ringAt(r, s), ringAt(r, s + 1), ringAt(r + 1, s + 1), ringAt(r + 1, s));
  }
  for (let s = 0; s < sectors; s++) b.tri(bottom, ringAt(rings - 1, s + 1), ringAt(rings - 1, s));
  b.smooth(v0, i0, [cx, cy, cz]);
}

// ----- Palm template -----
// A curved, tapered trunk with ring bumps and a crown of bent frond ribbons (each a V-folded midrib strip; the shader cuts
// the leaflet gaps). Built once per quality level and shared by every palm.
function buildPalmTemplate(qp) {
  const P = PL.palm, b = new PB();
  const rings = qp.trunkRings, sides = qp.trunkSides, H = P.height;
  const pts = [], rad = [], sw = [], gg = [];
  for (let i = 0; i <= rings; i++) {
    const t = i / rings;
    pts.push([P.bend * t * t, t * H, P.sBend * Math.sin(t * 3.1) * t]);
    rad.push(mixJS(P.baseRadius, P.topRadius, t) * (1 + 0.07 * (i % 2)) * (1 + P.flare * Math.pow(1 - t, 7)));
    sw.push(P.sway * t * t);
    gg.push(t);
  }
  plantTube(b, pts, rad, sides, PART_TRUNK, sw, gg, 0, [0, 0, 1], false);
  const crown = pts[rings];

  const n = qp.fronds, S = qp.frondSegs;
  const rnd = mulberry32(777);
  for (let k = 0; k < n; k++) {
    const f = n > 1 ? k / (n - 1) : 0;
    const phi = k * 2.39996 + rnd() * 0.3;
    const e0 = mixJS(1.25, -0.05, Math.pow(f, 0.9));
    const droop = mixJS(1.15, 1.55, f) + (rnd() - 0.5) * 0.2;
    const L = P.frondLength * (0.9 + 0.2 * rnd());
    const curl = (rnd() - 0.5) * 0.8;
    const seed = k * 0.137 + 0.05;
    const v0 = b.part.length, i0 = b.idx.length;
    let p = [crown[0], crown[1] + 0.05, crown[2]];
    const ds = L / S;
    const rowsIdx = [];
    for (let j = 0; j <= S; j++) {
      const t = j / S;
      const e = e0 - droop * Math.pow(t, 1.6);
      const ph = phi + curl * t;
      const dir = [Math.cos(ph) * Math.cos(e), Math.sin(e), Math.sin(ph) * Math.cos(e)];
      const w = P.frondHalfWidth * Math.pow(Math.sin(Math.PI * Math.pow(Math.max(t, 0.0001), 0.75)), 0.85) + 0.025 * (1 - t);
      const side = norm3([-dir[2], 0, dir[0]]);
      const fold = w * (0.30 + 0.25 * t);
      const s2 = P.sway + 0.55 * Math.pow(t, 1.4);
      const row = [];
      row.push(b.vert([p[0] - side[0] * w, p[1] - fold, p[2] - side[2] * w], [0, 1, 0], PART_FROND, s2, t, seed, 0, t));
      row.push(b.vert([p[0], p[1], p[2]], [0, 1, 0], PART_FROND, s2, t, seed, 0.5, t));
      row.push(b.vert([p[0] + side[0] * w, p[1] - fold, p[2] + side[2] * w], [0, 1, 0], PART_FROND, s2, t, seed, 1, t));
      rowsIdx.push(row);
      if (j < S) p = [p[0] + dir[0] * ds, p[1] + dir[1] * ds, p[2] + dir[2] * ds];
    }
    for (let j = 0; j < S; j++) {
      for (let c = 0; c < 2; c++) b.quad(rowsIdx[j][c], rowsIdx[j][c + 1], rowsIdx[j + 1][c + 1], rowsIdx[j + 1][c]);
    }
    b.smooth(v0, i0, null);
  }
  // Coconuts in a cluster under the crown.
  for (let k = 0; k < qp.coconuts; k++) {
    const a = k * 2.2 + 0.4;
    plantBlob(b, crown[0] + Math.cos(a) * 0.2, crown[1] - 0.22, crown[2] + Math.sin(a) * 0.2, 0.13, 0.15, 0.13, 4, 6,
      { amp: 0.06, freq: 2, seed: 0.3 + k * 0.17, part: PART_NUT, sway: 0.1 });
  }
  return b.pack();
}

// ----- Grass tuft template -----
// A fan of curved blades that narrow to a point. Normals lean towards up so a field lights softly.
function buildGrassTemplate(qp) {
  const G = PL.grass, b = new PB();
  const rnd = mulberry32(4242);
  const S = qp.bladeSegs;
  const v0 = b.part.length, i0 = b.idx.length;
  for (let k = 0; k < qp.blades; k++) {
    const a = k * 2.4 + rnd() * 0.5;
    const off = G.tuftRadius * (0.3 + 0.7 * rnd());
    const h = G.height * (0.6 + 0.4 * rnd()) + G.heightVar * 0.3 * rnd();
    const bend = G.bend * (0.4 + 0.6 * rnd());
    const dx = Math.cos(a), dz = Math.sin(a);
    const sx = -dz, sz = dx;
    const seed = k * 0.173;
    const rows = [];
    for (let j = 0; j <= S; j++) {
      const t = j / S;
      const out = bend * h * t * t;
      const cx = dx * (off + out), cz = dz * (off + out), cy = h * t * (1 - 0.12 * t);
      const w = G.width * (1 - Math.pow(t, 1.3)) + 0.002;
      const sway = 0.3 * h * t * t;
      rows.push([
        b.vert([cx - sx * w, cy, cz - sz * w], [0, 1, 0], PART_GRASS, sway, t, seed, 0, t),
        b.vert([cx + sx * w, cy, cz + sz * w], [0, 1, 0], PART_GRASS, sway, t, seed, 1, t),
      ]);
    }
    for (let j = 0; j < S; j++) b.quad(rows[j][0], rows[j][1], rows[j + 1][1], rows[j + 1][0]);
  }
  b.smooth(v0, i0, null);
  b.lift(v0, 0.8);
  return b.pack();
}

let plantTemplates = null;
function getPlantTemplates() {
  if (!plantTemplates) {
    const qp = currentQuality().plants;
    plantTemplates = { palm: buildPalmTemplate(qp), grass: buildGrassTemplate(qp) };
  }
  return plantTemplates;
}

// ----- Plant shader -----
const PLANT_VERT = `
  attribute float aPart;
  attribute float aSway;
  attribute float aG;
  attribute float aSeed;
  attribute vec2 aUV;
  #ifdef INSTANCED
  attribute vec3 iPos;
  attribute vec4 iRotS;     // yaw, horizontal scale, vertical scale, seed offset
  attribute vec2 iLean;
  #endif
  uniform float uTime;
  uniform vec2 uWindDir;
  uniform float uWindStrength;
  varying vec3 vW;
  varying vec3 vN;
  varying float vPart;
  varying float vG;
  varying float vSeed;
  varying vec2 vUV;
  varying vec3 vL;

  void main() {
    vec3 p = position;
    vec3 n = normal;
    float seed = aSeed;
    vL = p;
    #ifdef INSTANCED
      p.xz += iLean * p.y * p.y * 0.025;
      p.xz *= iRotS.y;
      p.y *= iRotS.z;
      float cyw = cos(iRotS.x);
      float syw = sin(iRotS.x);
      p = vec3(cyw * p.x + syw * p.z, p.y, -syw * p.x + cyw * p.z);
      n = vec3(cyw * n.x + syw * n.z, n.y, -syw * n.x + cyw * n.z);
      p += iPos;
      seed += iRotS.w;
    #endif
    vec4 wp = modelMatrix * vec4(p, 1.0);

    // Wind: a slow push downwind with gusts rolling across the island, plus a quick flutter on leaves and blades.
    vec2 wd = uWindDir;
    vec2 pd = vec2(-wd.y, wd.x);
    float ph = uTime * 1.7 + dot(wp.xz, vec2(0.09, 0.06)) + seed * 6.2831;
    float gust = 0.55 + 0.3 * sin(ph) + 0.15 * sin(ph * 2.7 + 1.3);
    float k = aSway * (0.35 + 0.8 * uWindStrength);
    vec2 off = wd * gust * k + pd * sin(ph * 1.31 + 2.0) * k * 0.25;
    float leafy = (aPart > 0.5 && aPart < 2.5) ? 1.0 : 0.0;
    off += pd * sin(uTime * 4.7 + aG * 8.0 + seed * 17.0) * aSway * 0.12 * leafy * (0.4 + uWindStrength);
    wp.xz += off;
    wp.y -= dot(off, off) * 0.12;

    vW = wp.xyz;
    vN = normalize(mat3(modelMatrix) * n);
    vPart = aPart;
    vG = aG;
    vSeed = seed;
    vUV = aUV;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const PLANT_FRAG = SKY_CHUNK + PLANT_COL_KEYS.map((k) => 'uniform vec3 uc_' + k + ';\n').join('') + `
  uniform float uTime;
  uniform float uFogDensity;
  uniform float uLeaflets;
  varying vec3 vW;
  varying vec3 vN;
  varying float vPart;
  varying float vG;
  varying float vSeed;
  varying vec2 vUV;
  varying vec3 vL;

  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
  }

  // Small GGX/Trowbridge-Reitz direct-light lobe for foliage, bark and masonry.
  // Existing broad highlights remain to retain Windward's established visual style.
  float ggxSurfaceTerm(vec3 nrm, vec3 lightDir, vec3 viewDir, float roughness, float f0) {
    float ndlG = max(dot(nrm, lightDir), 0.0);
    float ndvG = max(dot(nrm, viewDir), 0.0001);
    if (ndlG <= 0.0) return 0.0;
    vec3 halfVec = normalize(lightDir + viewDir);
    float ndhG = max(dot(nrm, halfVec), 0.0);
    float vdhG = max(dot(viewDir, halfVec), 0.0);
    float alphaG = roughness * roughness;
    float alpha2G = alphaG * alphaG;
    float denomG = ndhG * ndhG * (alpha2G - 1.0) + 1.0;
    float distG = alpha2G / max(3.14159265 * denomG * denomG, 0.0001);
    float kG = (roughness + 1.0);
    kG = kG * kG * 0.125;
    float geomVG = ndvG / max(ndvG * (1.0 - kG) + kG, 0.0001);
    float geomLG = ndlG / max(ndlG * (1.0 - kG) + kG, 0.0001);
    float fresnelG = f0 + (1.0 - f0) * pow(1.0 - vdhG, 5.0);
    return distG * geomVG * geomLG * fresnelG / max(4.0 * ndvG * ndlG, 0.0001);
  }

  void main() {
    int pt = int(vPart + 0.5);
    vec3 N = normalize(vN);
    vec3 toCam = cameraPosition - vW;
    float dist = length(toCam);
    vec3 V = toCam / max(dist, 0.001);
    vec3 L = uLightDir;
    vec3 base = vec3(0.5);
    float shin = 16.0;
    float specA = 0.05;
    float trans = 0.0;
    float ao = 1.0;

    if (pt == 0) {
      // Trunk: pale ridged bark with ring grooves and streaks.
      float ringv = 0.5 + 0.5 * sin(vL.y * 11.0 + vSeed * 3.0);
      float streak = vnoise(vec2(vUV.x * 16.0, vUV.y * 2.2 + vSeed * 9.0));
      float barkFine = vnoise(vec2(vUV.x * 52.0 + vSeed * 13.0, vUV.y * 4.5));
      base = mix(uc_trunkA, uc_trunkB, streak * 0.8 + 0.1);
      base *= (0.72 + 0.34 * ringv) * (0.95 + 0.11 * barkFine);
      ao = 0.55 + 0.45 * smoothstep(0.0, 1.6, vL.y);
      shin = 14.0; specA = 0.06;
    } else if (pt == 1) {
      // Frond: a midrib with leaflets cut into the ribbon. Leaflets angle towards the tip.
      float edge = abs(vUV.x - 0.5) * 2.0;
      float t = vUV.y;
      float lf = fract(t * uLeaflets - edge * 1.7);
      float rib = 1.0 - smoothstep(0.06, 0.12, edge);
      if (rib < 0.5 && lf > 0.72) discard;
      float lt = lf / 0.72;
      base = mix(uc_frondBase, uc_frondTip, smoothstep(0.0, 0.9, t));
      float dry = smoothstep(0.55, 0.9, vnoise(vec2(vSeed * 7.0, 2.0))) * smoothstep(0.5, 1.0, t);
      base = mix(base, uc_frondDry, dry * 0.8);
      base *= 0.82 + 0.3 * (1.0 - lt) * (1.0 - rib);
      base = mix(base, uc_rib, rib * 0.55);
      // Subtle lengthwise veins catch sunlight without turning the fronds into striped plastic.
      float veinLine = 1.0 - smoothstep(0.0, 0.045, abs(sin((vUV.x - 0.5) * 25.0 + t * 0.65)));
      base = mix(base, uc_rib, veinLine * 0.12 * (1.0 - rib));
      trans = 0.9; shin = 30.0; specA = 0.25;
      ao = 0.6 + 0.4 * smoothstep(0.0, 0.35, t);
    } else if (pt == 2) {
      // Grass blade: dark root, green middle, sun-dried tip.
      float t = vG;
      vec3 c1 = mix(uc_grassRoot, uc_grassMid, smoothstep(0.0, 0.55, t));
      base = mix(c1, uc_grassTip, smoothstep(0.55, 1.0, t));
      base *= 0.82 + 0.36 * vnoise(vec2(vSeed * 13.0, 1.3));
      base *= 0.96 + 0.08 * vnoise(vec2(vUV.x * 34.0 + vSeed * 9.0, t * 5.0));
      ao = 0.5 + 0.5 * smoothstep(0.0, 0.4, t);
      trans = 0.8; shin = 24.0; specA = 0.12;
    } else if (pt == 3) {
      // Shrub: patchy green, darker inside, a few tiny flowers.
      float nn = vnoise(vW.xz * 3.1 + vSeed * 5.0) * 0.6 + vnoise(vW.xz * 9.0) * 0.4;
      base = mix(uc_shrubA, uc_shrubB, nn);
      base *= 0.7 + 0.45 * vG;
      ao = 0.45 + 0.55 * vG;
      float fl = smoothstep(0.88, 0.93, vnoise(vW.xz * 28.0 + vW.y * 19.0)) * step(0.72, fract(vSeed * 3.7)) * smoothstep(0.35, 0.6, vG);
      base = mix(base, mix(uc_flowerA, uc_flowerB, fract(vSeed * 11.0)), fl);
      trans = 0.35; shin = 14.0; specA = 0.05;
    } else if (pt == 4) {
      // Rock: strata lines, grain, moss on top faces, a dark wet base.
      float strata = 0.5 + 0.5 * sin(vW.y * 6.2 + vnoise(vW.xz * 0.8) * 3.2 + vSeed * 4.0);
      float grain = vnoise(vW.xz * 6.0 + vW.y * 6.0) * 0.6 + vnoise(vW.xz * 17.0) * 0.4;
      float grainFine = vnoise(vW.xz * 31.0 + vW.y * 17.0 + vSeed * 3.0);
      base = mix(uc_rockDark, uc_rockLight, strata * 0.7 + 0.15) * (0.8 + 0.4 * grain) * (0.95 + 0.12 * grainFine);
      float pits = smoothstep(0.70, 0.91, vnoise(vW.xz * 9.0 + vW.y * 8.0 + vSeed));
      base *= 1.0 - 0.07 * pits;
      float moss = smoothstep(0.6, 0.9, N.y) * smoothstep(0.35, 0.72, vnoise(vW.xz * 0.9 + vSeed * 8.0)) * smoothstep(0.5, 1.2, vW.y);
      base = mix(base, uc_moss, moss * 0.85);
      float wet = 1.0 - smoothstep(0.1, 0.9, vW.y);
      base *= 1.0 - 0.38 * wet;
      base = mix(base, base * vec3(0.8, 1.0, 0.9), wet * 0.5);
      ao = 0.55 + 0.45 * smoothstep(-0.3, 0.8, vW.y);
      shin = 40.0; specA = 0.1 + 0.5 * wet;
    } else if (pt == 5) {
      // Driftwood: silvered wood grain, darker where the sea reaches it.
      float gr = vnoise(vec2(vUV.x * 9.0, vUV.y * 0.9 + vSeed * 5.0)) * 0.6 + vnoise(vec2(vUV.x * 30.0, vUV.y * 3.0)) * 0.4;
      float fibers = vnoise(vec2(vUV.x * 58.0 + vSeed * 8.0, vUV.y * 5.0));
      base = mix(uc_woodDark, uc_wood, gr) * (0.95 + 0.10 * fibers);
      float wet = 1.0 - smoothstep(0.1, 0.7, vW.y);
      base *= 1.0 - 0.3 * wet;
      ao = 0.6 + 0.4 * smoothstep(0.1, 0.5, vW.y);
      shin = 18.0; specA = 0.08 + 0.2 * wet;
    } else {
      // Coconut.
      base = uc_coconut * (0.85 + 0.3 * vnoise(vW.xz * 12.0 + vW.y * 8.0));
      shin = 30.0; specA = 0.35;
    }

    // Thin leaves and blades are lit from whichever side faces the eye.
    if (pt == 1 || pt == 2) { if (dot(N, V) < 0.0) N = -N; }

    // Lighting: same key light, sky and haze as the island terrain and the sea.
    float sunUp = 1.0;
    float ndl = dot(N, L);
    float wrapD = clamp((ndl + 0.3) / 1.3, 0.0, 1.0);
    vec3 skyAmb = mix(uHorizonColor, uTopColor, 0.45) * 0.6;
    vec3 gnd = vec3(0.04, 0.06, 0.06) + uHorizonColor * 0.1;
    vec3 amb = mix(gnd, skyAmb, N.y * 0.5 + 0.5);
    vec3 sunC = uLightColor;
    vec3 col = base * (amb * 1.25 * ao + sunC * wrapD * wrapD * 1.05 * sunUp);
    col += base * sunC * max(-ndl, 0.0) * trans * 0.8 * sunUp;
    col += base * sunC * pow(max(dot(-V, L), 0.0), 4.0) * trans * 0.5 * sunUp;
    vec3 Hh = normalize(L + V);
    col += sunC * pow(max(dot(N, Hh), 0.0), shin) * specA * sunUp * max(ndl, 0.0);
    float roughMat = clamp(sqrt(2.0 / (shin + 2.0)), 0.12, 0.86);
    float dielectricF0 = clamp(0.025 + specA * 0.06, 0.025, 0.10);
    col += sunC * ggxSurfaceTerm(N, L, V, roughMat, dielectricF0) * specA * sunUp * max(ndl, 0.0) * 0.22;

    float fogAmt = 1.0 - exp(-pow(dist * (uFogDensity + uFogExtra), 2.0));
    vec3 fogCol = skyColor(normalize(vW - cameraPosition));
    col = mix(col, fogCol, clamp(fogAmt, 0.0, 1.0));
    gl_FragColor = vec4(finishColor(col), 1.0);
  }
`;

const plantUniforms = Object.assign(sharedSkyUniforms(), {
  uTime: timeUniform,
  uWindDir: { value: wind.dir },
  uWindStrength: { value: wind.strength },
  uFogDensity: { value: WORLD.fogDensity },
  uLeaflets: { value: currentQuality().plants.leaflets },
});
for (let i = 0; i < PLANT_COL_KEYS.length; i++) plantUniforms['uc_' + PLANT_COL_KEYS[i]] = { value: toLinear(PL.colours[PLANT_COL_KEYS[i]]) };

// Static meshes (shrubs, rocks, driftwood) and instanced meshes (palms, grass) share one shader and one set of uniforms.
const plantStaticMaterial = new THREE.ShaderMaterial({
  vertexShader: PLANT_VERT, fragmentShader: PLANT_FRAG, uniforms: plantUniforms, side: THREE.DoubleSide,
});
const plantInstMaterial = new THREE.ShaderMaterial({
  vertexShader: PLANT_VERT, fragmentShader: PLANT_FRAG, uniforms: plantUniforms, side: THREE.DoubleSide, defines: { INSTANCED: 1 },
});

function updatePlantUniforms() {
  plantUniforms.uWindStrength.value = Math.min(wind.strength, CONFIG.weather.swayMax);
}

// ----- Noise that matches the island shader, so grass tufts land on the painted grass patches -----
function h21JS(x, y) {
  let px = x * 123.34, py = y * 456.21;
  px -= Math.floor(px); py -= Math.floor(py);
  const d = px * (px + 45.32) + py * (py + 45.32);
  px += d; py += d;
  const r = px * py;
  return r - Math.floor(r);
}
function vnoise2JS(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = h21JS(ix, iy), b = h21JS(ix + 1, iy), c = h21JS(ix, iy + 1), d = h21JS(ix + 1, iy + 1);
  return mixJS(mixJS(a, b, fx), mixJS(c, d, fx), fy);
}
function fbm2JS(x, y) {
  return vnoise2JS(x, y) * 0.55 + vnoise2JS(x * 2.07 + 3.1, y * 2.07 + 3.1) * 0.3 + vnoise2JS(x * 4.3 + 7.7, y * 4.3 + 7.7) * 0.15;
}
// Same grass mask as the island shader (patches of grass on gentle high ground).
function grassMaskJS(wx, wz, h, slopeN) {
  const gn = fbm2JS(wx * 0.045 + 11.0, wz * 0.045 + 11.0);
  return smoothstepJS(0.40, 0.56, gn + (h - 2.0) * 0.07) * smoothstepJS(1.4, 2.4, h) * (1 - smoothstepJS(0.22, 0.42, slopeN));
}

// ----- Ground sampling -----
// Same height the terrain mesh has (shoreline bed plus relief), so plants sit exactly on the ground.
function groundH(I, x, z) {
  isleFrameJS(I, x, z);
  const h = isleBedJS(I);
  return h + reliefAt(I, x, z, h);
}
const gs = { h: 0, u: 1, g: 0, slope: 0 };
// Fills gs with height, u, channel weight and slope (shader-style: length of the normal's horizontal part).
function groundInfo(I, x, z, needSlope) {
  gs.h = groundH(I, x, z);
  gs.u = isleFr.u; gs.g = isleFr.g;
  if (needSlope) {
    const e = 0.8;
    const gx = (groundH(I, x + e, z) - groundH(I, x - e, z)) / (2 * e);
    const gz = (groundH(I, x, z + e) - groundH(I, x, z - e)) / (2 * e);
    gs.slope = Math.hypot(gx, gz) / Math.sqrt(1 + gx * gx + gz * gz);
  } else gs.slope = 0;
  return gs;
}

// ----- Placement -----
// Decides where everything goes, from the island's seed. Every candidate draws the same random numbers whether or not it is
// accepted, so the layout never depends on the graphics level (Low is simply a prefix of High).
function placePlants(I) {
  const rng = mulberry32((I.seedI ^ 0x51ed270b) >>> 0);
  const caps = CONFIG.quality.levels[CONFIG.quality.levels.length - 1].plants;
  const A = PL.attempts, TWO_PI = Math.PI * 2;
  const R = I.R * 1.2;
  const out = { palms: [], grass: [], shrubs: [], rocks: [], wood: [] };
  if (I.type === 5) return out;   // bare sea stacks
  const disc = () => { const r = Math.sqrt(rng()) * R, a = rng() * TWO_PI; return [Math.cos(a) * r, Math.sin(a) * r]; };

  // Palms: on the dry ground, thicker towards the beach, never too close together.
  const palmCap = I.type === 1 ? caps.palmAtoll : I.type >= 2 ? Math.ceil(caps.palmCay * 0.4) : caps.palmCay;
  for (let att = 0; att < A.palm && out.palms.length < palmCap; att++) {
    const [lx, lz] = disc();
    if (plantBlocked(I, lx, lz)) continue;
    const roll = rng(), yaw = rng() * TWO_PI, sc = rng(), seed = rng(), l1 = rng(), l2 = rng();
    const s = groundInfo(I, I.cx + lx, I.cz + lz, false);
    if (s.h < PL.palm.minH || s.h > I.hMax * PL.palm.maxHShare || s.g > 0.35 || s.u > 0.96) continue;
    if (roll > 0.3 + 0.7 * smoothstepJS(0.45, 0.92, s.u)) continue;
    groundInfo(I, I.cx + lx, I.cz + lz, true);
    if (gs.slope > 0.32) continue;
    let ok = true;
    for (let k = 0; k < out.palms.length; k++) {
      const q = out.palms[k];
      if ((q.x - lx) * (q.x - lx) + (q.z - lz) * (q.z - lz) < PL.palm.spacing * PL.palm.spacing) { ok = false; break; }
    }
    if (!ok) continue;
    const k = mixJS(PL.palm.scaleMin, PL.palm.scaleMax, sc);
    out.palms.push({ x: lx, y: s.h - 0.15, z: lz, yaw: yaw, sxz: k * (0.9 + 0.2 * seed), sy: k, seed: seed, l1: (l1 - 0.5) * 1.2, l2: (l2 - 0.5) * 1.2 });
  }

  // Grass tufts: only inside the painted grass patches.
  for (let att = 0; att < A.grass && out.grass.length < caps.grass; att++) {
    const [lx, lz] = disc();
    if (plantBlocked(I, lx, lz)) continue;
    const roll = rng(), yaw = rng() * TWO_PI, sc = rng(), seed = rng();
    const wx = I.cx + lx, wz = I.cz + lz;
    const s = groundInfo(I, wx, wz, false);
    if (s.h < PL.grass.minH || s.g > 0.35 || s.u > 0.97) continue;
    groundInfo(I, wx, wz, true);
    const gm = grassMaskJS(wx, wz, gs.h, gs.slope);
    if (roll > gm) continue;
    const k = mixJS(PL.grass.scaleMin, PL.grass.scaleMax, sc);
    out.grass.push({ x: lx, y: gs.h - 0.03, z: lz, yaw: yaw, sxz: k, sy: k * (0.8 + 0.4 * seed), seed: seed });
  }

  // Shrubs: low mounds on the dunes.
  for (let att = 0; att < A.shrub && out.shrubs.length < caps.shrubs; att++) {
    const [lx, lz] = disc();
    if (plantBlocked(I, lx, lz)) continue;
    const roll = rng(), yaw = rng() * TWO_PI, sc = rng(), seed = rng();
    const s = groundInfo(I, I.cx + lx, I.cz + lz, false);
    if (s.h < PL.shrub.minH || s.g > 0.35 || s.u > 0.95) continue;
    if (roll > 0.25 + 0.75 * smoothstepJS(0.2, 0.7, 1 - s.u)) continue;
    groundInfo(I, I.cx + lx, I.cz + lz, true);
    if (gs.slope > 0.4) continue;
    out.shrubs.push({ x: lx, y: gs.h, z: lz, yaw: yaw, r: PL.shrub.radius + PL.shrub.radiusVar * sc, seed: seed });
  }

  // Rocks: along the shore and on steeper ground, with a few smaller ones beside each.
  for (let att = 0; att < A.rock && out.rocks.length < caps.rocks; att++) {
    const [lx, lz] = disc();
    if (plantBlocked(I, lx, lz)) continue;
    const roll = rng(), yaw = rng() * TWO_PI, sc = rng(), seed = rng(), c1 = rng(), c2 = rng();
    const s = groundInfo(I, I.cx + lx, I.cz + lz, false);
    if (s.h < -0.7 || s.u > 1.12 || s.g > 0.5) continue;
    const shore = s.u > 0.86;
    if (!shore) { groundInfo(I, I.cx + lx, I.cz + lz, true); if (gs.slope < 0.26 || s.h < 1.0) continue; }
    if (roll > (shore ? 0.2 : 0.5)) continue;
    out.rocks.push({ x: lx, y: gs.h, z: lz, yaw: yaw, r: PL.rock.radius + PL.rock.radiusVar * sc * sc, seed: seed, c1: c1, c2: c2 });
  }

  // Driftwood: on the beach, lying along the ground.
  for (let att = 0; att < A.wood && out.wood.length < caps.wood; att++) {
    const [lx, lz] = disc();
    if (plantBlocked(I, lx, lz)) continue;
    const roll = rng(), yaw = rng() * TWO_PI, sc = rng(), seed = rng(), bend = rng();
    const s = groundInfo(I, I.cx + lx, I.cz + lz, false);
    if (s.u < 0.86 || s.u > 1.0 || s.h < 0.3 || s.h > 1.1 || s.g > 0.35) continue;
    if (roll > 0.5) continue;
    out.wood.push({ x: lx, z: lz, yaw: yaw, len: PL.wood.length + PL.wood.lengthVar * sc, r: PL.wood.radius + PL.wood.radiusVar * seed, seed: seed, bend: (bend - 0.5) * 0.9 });
  }
  return out;
}

// ----- Baked props: shrubs, rocks and driftwood merged into one mesh -----
function plantWoodLog(b, I, w) {
  const N = 8, pts = [], rad = [], sw = [], gg = [];
  const dx = Math.cos(w.yaw), dz = Math.sin(w.yaw), px = -dz, pz = dx;
  for (let i = 0; i <= N; i++) {
    const t = i / N, along = (t - 0.5) * w.len, bo = Math.sin(t * Math.PI) * w.bend;
    const x = w.x + dx * along + px * bo, z = w.z + dz * along + pz * bo;
    const r = w.r * (1 - 0.5 * t) * (1 + 0.36 * (vnoiseJS(i * 1.7, w.seed * 5, 3) - 0.5));
    pts.push([x, groundH(I, I.cx + x, I.cz + z) + r * 0.55, z]);
    rad.push(r); sw.push(0); gg.push(t);
  }
  plantTube(b, pts, rad, 6, PART_WOOD, sw, gg, w.seed, [0, 1, 0], true);
  // A short broken branch stub.
  const k = 2 + Math.floor(w.seed * 4);
  const base = pts[k], r0 = rad[k];
  const sx = px * (w.seed > 0.5 ? 1 : -1);
  const sp = [base, [base[0] + sx * 0.18, base[1] + 0.22, base[2] + pz * 0.18 * (w.seed > 0.5 ? 1 : -1)], [base[0] + sx * 0.32, base[1] + 0.4, base[2] + pz * 0.3 * (w.seed > 0.5 ? 1 : -1)]];
  plantTube(b, sp, [r0 * 0.5, r0 * 0.38, r0 * 0.25], 5, PART_WOOD, [0, 0, 0], [0, 0.5, 1], w.seed, [0, 1, 0], true);
}

function bakeProps(I, placed, qp) {
  const b = new PB();
  for (let i = 0; i < placed.shrubs.length && i < qp.shrubs; i++) {
    const s = placed.shrubs[i];
    const parts = 3;
    for (let k = 0; k < parts; k++) {
      const a = s.seed * 20 + k * 2.1, off = k === 0 ? 0 : s.r * 0.6;
      const r = s.r * (k === 0 ? 1 : 0.72);
      plantBlob(b, s.x + Math.cos(a) * off, s.y + r * 0.28, s.z + Math.sin(a) * off, r, r * 0.72, r, qp.blobRings, qp.blobSectors,
        { amp: 0.2, freq: 2.2, seed: s.seed + k * 0.31, part: PART_SHRUB, sway: PL.shrub.sway, flat: 0.5, yaw: s.yaw, ridge: 0 });
    }
  }
  for (let i = 0; i < placed.rocks.length && i < qp.rocks; i++) {
    const r = placed.rocks[i];
    plantBlob(b, r.x, r.y - r.r * 0.18, r.z, r.r * (1 + 0.3 * r.c1), r.r * 0.7, r.r * (1.1 - 0.3 * r.c2), qp.blobRings, qp.blobSectors,
      { amp: 0.34, freq: 1.6, seed: r.seed, part: PART_ROCK, sway: 0, flat: 0.45, yaw: r.yaw, ridge: 0.5 });
    if (r.c1 > 0.45) {
      const a = r.yaw + 2.4, d = r.r * 1.15, rr = r.r * 0.4;
      const cx = r.x + Math.cos(a) * d, cz = r.z + Math.sin(a) * d;
      plantBlob(b, cx, groundH(I, I.cx + cx, I.cz + cz) - rr * 0.1, cz, rr * 1.2, rr * 0.7, rr, qp.blobRings, qp.blobSectors,
        { amp: 0.3, freq: 2.2, seed: r.seed + 0.5, part: PART_ROCK, sway: 0, flat: 0.45, yaw: r.yaw + 1, ridge: 0.5 });
    }
  }
  for (let i = 0; i < placed.wood.length && i < qp.wood; i++) plantWoodLog(b, I, placed.wood[i]);
  return b.part.length ? b.pack() : null;
}

// ----- Meshes -----
function plantAttr(a, size) { return new THREE.BufferAttribute(a, size); }
function setPlantAttrs(geo, t) {
  geo.setAttribute('position', plantAttr(t.pos, 3));
  geo.setAttribute('normal', plantAttr(t.nrm, 3));
  geo.setAttribute('aPart', plantAttr(t.part, 1));
  geo.setAttribute('aSway', plantAttr(t.sway, 1));
  geo.setAttribute('aG', plantAttr(t.g, 1));
  geo.setAttribute('aSeed', plantAttr(t.seed, 1));
  geo.setAttribute('aUV', plantAttr(t.uv, 2));
  geo.setIndex(plantAttr(t.idx, 1));
}
function instancedPlantMesh(tpl, list, I) {
  const n = list.length;
  const ip = new Float32Array(n * 3), ir = new Float32Array(n * 4), il = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    const p = list[i];
    ip[i * 3] = p.x; ip[i * 3 + 1] = p.y; ip[i * 3 + 2] = p.z;
    ir[i * 4] = p.yaw; ir[i * 4 + 1] = p.sxz; ir[i * 4 + 2] = p.sy; ir[i * 4 + 3] = p.seed;
    il[i * 2] = p.l1 || 0; il[i * 2 + 1] = p.l2 || 0;
  }
  const geo = new THREE.InstancedBufferGeometry();
  setPlantAttrs(geo, tpl);
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(ip, 3));
  geo.setAttribute('iRotS', new THREE.InstancedBufferAttribute(ir, 4));
  geo.setAttribute('iLean', new THREE.InstancedBufferAttribute(il, 2));
  geo.instanceCount = n;
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 3, 0), I.R * 1.5 + 12);
  const m = new THREE.Mesh(geo, plantInstMaterial);
  m.position.set(I.cx, 0, I.cz);
  return m;
}

// Builds every plant on an island. Called with the island, and again when the graphics level changes.
function buildPlants(I) {
  disposePlants(I);
  const qp = currentQuality().plants;
  const placed = placePlants(I);
  const tpl = getPlantTemplates();
  const group = new THREE.Group();
  const P = { group: group, palm: null, grass: null, props: null, counts: { palms: 0, grass: 0, shrubs: 0, rocks: 0, wood: 0 } };

  const palms = placed.palms.slice(0, I.type === 1 ? qp.palmAtoll : I.type >= 2 ? Math.ceil(qp.palmCay * 0.4) : qp.palmCay);
  if (palms.length) { P.palm = instancedPlantMesh(tpl.palm, palms, I); group.add(P.palm); }
  const grass = placed.grass.slice(0, qp.grass);
  if (grass.length) { P.grass = instancedPlantMesh(tpl.grass, grass, I); group.add(P.grass); }
  const baked = bakeProps(I, placed, qp);
  if (baked) {
    const geo = new THREE.BufferGeometry();
    setPlantAttrs(geo, baked);
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 2, 0), I.R * 1.5 + 12);
    P.props = new THREE.Mesh(geo, plantStaticMaterial);
    P.props.position.set(I.cx, 0, I.cz);
    group.add(P.props);
  }
  P.counts = { palms: palms.length, grass: grass.length, shrubs: Math.min(placed.shrubs.length, qp.shrubs), rocks: Math.min(placed.rocks.length, qp.rocks), wood: Math.min(placed.wood.length, qp.wood) };
  I.plants = P;
  islandGroup.add(group);
  setPlantVisibility(I);
}

function disposePlants(I) {
  if (!I.plants) return;
  islandGroup.remove(I.plants.group);
  I.plants.group.traverse((c) => { if (c.geometry) c.geometry.dispose(); });
  I.plants = null;
}

// Far islands do not draw their small things: grass first, then rocks and shrubs, then palms.
function setPlantVisibility(I) {
  const P = I.plants;
  if (!P) return;
  const d = Math.hypot(I.cx - ship.x, I.cz - ship.z);
  if (P.palm) {
    P.palm.visible = d < PL.far.palm;
    const n = P.counts.palms;
    P.palm.geometry.instanceCount = d > PL.far.palmHalf ? Math.max(1, Math.ceil(n / 2)) : n;   // fewer palms on far islands
  }
  if (P.grass) P.grass.visible = d < PL.far.grass;
  if (P.props) P.props.visible = d < PL.far.props;
}
function updatePlantVisibility() {
  for (let i = 0; i < islands.length; i++) setPlantVisibility(islands[i]);
}

// Graphics level changed: new templates, new leaflet count, plants rebuilt on every island.
function rebuildPlants() {
  plantTemplates = null;
  plantUniforms.uLeaflets.value = currentQuality().plants.leaflets;
  for (let i = 0; i < islands.length; i++) buildPlants(islands[i]);
}

// ===== LANDMARKS =====
// Phase 3: lighthouse isle (tower, lantern room, night beam), cliff island (terrain only, see rockRelief), ruins isle
// (arches, domes, observatory, geometric tilework), sea arch (two stacks and a rock bridge) and lantern buoys.
// Built from smooth curves: lathe-turned towers and domes, stone beams with rounded edges, noise-bent rock. One shader draws all
// the solid parts (picked by the aPart attribute); the beam and the lamp glow have their own additive shaders.
// No living beings: ruins and harbours feel lived-in through lamps and stone only.
const LM = CONFIG.landmarks;
const LM_COL_KEYS = Object.keys(LM.colours);
const LM_TOWER = 0, LM_GLASS = 1, LM_ROOF = 2, LM_LAMP = 3, LM_STONE = 4, LM_TILE = 5, LM_ROCK = 6, LM_BUOY = 7, LM_LANTERN = 8, LM_IRON = 9, LM_PLINTH = 10;
const lmNight = { value: 0 };     // 0 by day, 1 at night, from the sun's height (Phase 4 adds a true night sky)
const lmBeams = [];               // every beam that is built: { mesh, flare, ang, speed, I }
const lmBuoyList = [];            // every buoy group that is built

function lmNightFromSun() {
  const t = clamp01((sunDir.y + 0.10) / 0.22);
  return 1 - t * t * (3 - 2 * t);
}

const LM_VERT = `
  attribute float aPart;
  attribute float aG;
  attribute float aSeed;
  attribute vec2 aUV;
  #ifdef INSTANCED
  attribute vec3 iPos;
  attribute vec4 iRot;      // roll about x, roll about z, yaw, seed offset
  #endif
  varying vec3 vW;
  varying vec3 vN;
  varying vec3 vL;
  varying float vPart;
  varying float vG;
  varying float vSeed;
  varying vec2 vUV;
  void main() {
    vec3 p = position;
    vec3 n = normal;
    float seed = aSeed;
    vL = position;
    #ifdef INSTANCED
      float cx = cos(iRot.x), sx = sin(iRot.x), cz = cos(iRot.y), sz = sin(iRot.y);
      p = vec3(p.x, cx * p.y - sx * p.z, sx * p.y + cx * p.z);
      n = vec3(n.x, cx * n.y - sx * n.z, sx * n.y + cx * n.z);
      p = vec3(cz * p.x - sz * p.y, sz * p.x + cz * p.y, p.z);
      n = vec3(cz * n.x - sz * n.y, sz * n.x + cz * n.y, n.z);
      float cy = cos(iRot.z), sy = sin(iRot.z);
      p = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
      n = vec3(cy * n.x + sy * n.z, n.y, -sy * n.x + cy * n.z);
      p += iPos;
      seed += iRot.w;
    #endif
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vW = wp.xyz;
    vN = normalize(mat3(modelMatrix) * n);
    vPart = aPart; vG = aG; vSeed = seed; vUV = aUV;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const LM_FRAG = SKY_CHUNK + LM_COL_KEYS.map((k) => 'uniform vec3 uc_' + k + ';\n').join('') + `
  uniform float uTime;
  uniform float uNight;
  uniform float uFogDensity;
  varying vec3 vW;
  varying vec3 vN;
  varying vec3 vL;
  varying float vPart;
  varying float vG;
  varying float vSeed;
  varying vec2 vUV;

  float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
  }

  // Geometric tile: an eight-pointed star made of two overlapping squares, an inner octagon and a small rosette.
  vec3 tilePattern(vec2 uv, float wear) {
    vec2 cell = floor(uv);
    vec2 p = fract(uv) - 0.5;
    vec2 a = abs(p);
    float sq = max(a.x, a.y);
    float dm = (a.x + a.y) * 0.70711;
    float star = min(sq, dm);
    float oct = max(sq, dm);
    float alt = mod(cell.x + cell.y, 2.0);
    vec3 field = mix(uc_tileA, uc_tileB, alt);
    vec3 col = field;
    col = mix(col, uc_tileC, 1.0 - smoothstep(0.255, 0.275, star));          // the star
    col = mix(col, mix(uc_tileB, uc_tileA, alt), 1.0 - smoothstep(0.155, 0.17, oct));   // inner octagon
    float rose = length(p);
    col = mix(col, uc_tileGold, 1.0 - smoothstep(0.05, 0.065, rose));
    col = mix(col, uc_tileGold, (1.0 - smoothstep(0.0, 0.014, abs(star - 0.265))) * 0.9);   // outline of the star
    col *= 0.45 + 0.55 * smoothstep(0.5, 0.455, max(a.x, a.y));              // dark grout between tiles
    float worn = smoothstep(0.45, 0.75, vnoise(uv * 0.7 + vSeed * 9.0) + wear);
    return mix(col, uc_sand * 0.85, worn * 0.9);
  }

  // Small GGX/Trowbridge-Reitz direct-light lobe for foliage, bark and masonry.
  // Existing broad highlights remain to retain Windward's established visual style.
  float ggxSurfaceTerm(vec3 nrm, vec3 lightDir, vec3 viewDir, float roughness, float f0) {
    float ndlG = max(dot(nrm, lightDir), 0.0);
    float ndvG = max(dot(nrm, viewDir), 0.0001);
    if (ndlG <= 0.0) return 0.0;
    vec3 halfVec = normalize(lightDir + viewDir);
    float ndhG = max(dot(nrm, halfVec), 0.0);
    float vdhG = max(dot(viewDir, halfVec), 0.0);
    float alphaG = roughness * roughness;
    float alpha2G = alphaG * alphaG;
    float denomG = ndhG * ndhG * (alpha2G - 1.0) + 1.0;
    float distG = alpha2G / max(3.14159265 * denomG * denomG, 0.0001);
    float kG = (roughness + 1.0);
    kG = kG * kG * 0.125;
    float geomVG = ndvG / max(ndvG * (1.0 - kG) + kG, 0.0001);
    float geomLG = ndlG / max(ndlG * (1.0 - kG) + kG, 0.0001);
    float fresnelG = f0 + (1.0 - f0) * pow(1.0 - vdhG, 5.0);
    return distG * geomVG * geomLG * fresnelG / max(4.0 * ndvG * ndlG, 0.0001);
  }

  void main() {
    int pt = int(vPart + 0.5);
    vec3 N = normalize(vN);
    vec3 toCam = cameraPosition - vW;
    float dist = length(toCam);
    vec3 V = toCam / max(dist, 0.001);
    vec3 L = uLightDir;
    vec3 base = vec3(0.5);
    vec3 emis = vec3(0.0);
    float shin = 16.0;
    float specA = 0.05;
    float ao = 1.0;
    float alpha = 1.0;

    if (pt == 0) {
      // Lighthouse wall: lime wash with a red band, a pointed doorway and slit windows, streaked by weather.
      float g = vG;
      base = uc_lime;
      float band = smoothstep(0.34, 0.37, g) * (1.0 - smoothstep(0.55, 0.58, g));
      base = mix(base, uc_red, band);
      float arc = (fract(vUV.x + 0.5) - 0.5) * 6.2832 * max(length(vL.xz), 0.5);
      float yy = vL.y - 1.1;
      float dw = yy < 1.5 ? 0.78 : 0.78 * sqrt(max(1.0 - (yy - 1.5) * (yy - 1.5) / 1.0, 0.0));
      float door = (1.0 - smoothstep(dw - 0.04, dw + 0.04, abs(arc))) * step(0.0, yy) * step(yy, 2.5);
      float frame = (1.0 - smoothstep(dw + 0.08, dw + 0.14, abs(arc))) * step(-0.1, yy) * step(yy, 2.65);
      base = mix(base, uc_plinth * 1.1, frame * 0.8);
      base = mix(base, vec3(0.03, 0.02, 0.02), door);
      for (int k = 0; k < 4; k++) {
        float wy = 6.0 + float(k) * 4.6;
        float wu = fract(0.18 + 0.23 * float(k));
        float wa = (fract(vUV.x - wu + 0.5) - 0.5) * 6.2832 * max(length(vL.xz), 0.5);
        float slit = (1.0 - smoothstep(0.1, 0.16, abs(wa))) * (1.0 - smoothstep(0.5, 0.58, abs(vL.y - wy)));
        base = mix(base, vec3(0.04, 0.04, 0.05), slit);
      }
      float streak = vnoise(vec2(vUV.x * 24.0, vL.y * 0.35 + vSeed * 7.0));
      base *= 0.8 + 0.25 * streak;
      base *= 1.0 - 0.4 * smoothstep(3.0, 0.0, vL.y);
      shin = 20.0; specA = 0.05;
    } else if (pt == 1) {
      // Lantern glass: dark by day with a bright lamp inside, glowing at night.
      float nt = uNight;
      base = mix(vec3(0.12, 0.2, 0.24), uc_lamp * 1.1, 0.25 + 0.7 * nt);
      emis = uc_lamp * (0.25 + 2.2 * nt);
      shin = 80.0; specA = 0.6;
    } else if (pt == 2) {
      base = mix(uc_roof, uc_roof * vec3(1.3, 1.4, 1.1), vnoise(vL.xz * 3.0 + vSeed) * 0.6);
      shin = 40.0; specA = 0.35;
    } else if (pt == 3) {
      base = uc_lamp;
      emis = uc_lamp * (1.2 + 4.0 * uNight);
    } else if (pt == 4) {
      // Weathered sandstone in courses, with lichen on the top faces.
      float course = smoothstep(0.02, 0.06, abs(fract(vL.y * 0.9) - 0.5) * 2.0 - 0.9 + 0.1);
      float grain = vnoise(vW.xz * 2.2 + vW.y * 2.2) * 0.55 + vnoise(vW.xz * 8.0 + vW.y * 8.0) * 0.45;
      float pitting = vnoise(vW.xz * 28.0 + vW.y * 19.0 + vSeed * 5.0);
      base = mix(uc_stoneDark, uc_stone, grain) * (0.95 + 0.10 * pitting);
      base *= 0.86 + 0.14 * (1.0 - course);
      float wornEdge = smoothstep(0.74, 0.93, vnoise(vW.xz * 4.5 + vW.y * 3.2 + vSeed));
      base *= 1.0 - 0.035 * wornEdge;
      float lichen = smoothstep(0.62, 0.92, N.y) * smoothstep(0.5, 0.75, vnoise(vW.xz * 1.1 + vSeed * 8.0));
      base = mix(base, uc_moss, lichen * 0.7);
      base *= 1.0 - 0.3 * smoothstep(1.2, 0.0, vL.y);
      ao = 0.6 + 0.4 * smoothstep(-0.6, 1.4, vL.y);
      shin = 12.0; specA = 0.04;
    } else if (pt == 5) {
      base = tilePattern(vUV, 0.0);
      shin = 40.0; specA = 0.2;
    } else if (pt == 6) {
      // Sea rock: strata, grain, moss on top faces, dark wet base.
      float strata = mix(0.5 + 0.5 * sin(vW.y * 1.3 + vnoise(vW.xz * 0.2) * 12.0 + vSeed * 5.0), vnoise(vW.xz * 0.3 + vec2(0.0, vW.y * 0.15)), 0.45);
      float grain = vnoise(vW.xz * 3.0 + vW.y * 3.0) * 0.6 + vnoise(vW.xz * 11.0 + vW.y * 9.0) * 0.4;
      float grainFine = vnoise(vW.xz * 29.0 + vW.y * 16.0 + vSeed * 3.0);
      base = mix(uc_rockDark, uc_rockLight, strata * 0.7 + 0.15) * (0.8 + 0.4 * grain) * (0.95 + 0.10 * grainFine);
      float pitMask = smoothstep(0.72, 0.92, vnoise(vW.xz * 8.0 + vW.y * 7.0 + vSeed));
      base *= 1.0 - 0.06 * pitMask;
      float moss = smoothstep(0.55, 0.9, N.y) * smoothstep(0.35, 0.7, vnoise(vW.xz * 0.6 + vSeed * 8.0)) * smoothstep(2.5, 6.0, vW.y);
      base = mix(base, uc_moss, moss * 0.8);
      float wet = 1.0 - smoothstep(0.2, 2.6, vW.y);
      base *= 1.0 - 0.4 * wet;
      ao = 0.55 + 0.45 * smoothstep(0.0, 4.0, vW.y);
      shin = 30.0; specA = 0.08 + 0.4 * wet;
    } else if (pt == 7) {
      float stripe = step(0.5, fract(vUV.x * 4.0 + vSeed));
      base = mix(uc_red, vec3(0.88, 0.86, 0.8), stripe);
      base *= 1.0 - 0.4 * smoothstep(0.1, -0.5, vL.y) - 0.15 * vnoise(vL.xz * 8.0 + vL.y * 6.0);
      shin = 30.0; specA = 0.2;
    } else if (pt == 8) {
      float flick = 0.85 + 0.15 * sin(uTime * 3.1 + vSeed * 40.0);
      base = uc_lamp * vec3(0.75, 0.55, 0.3);
      emis = uc_lamp * (0.12 + 3.4 * uNight * flick);
    } else if (pt == 9) {
      base = vec3(0.07, 0.07, 0.08) * (0.9 + 0.2 * vnoise(vW.xz * 9.0));
      shin = 40.0; specA = 0.3;
    } else {
      float grain = vnoise(vL.xz * 2.0 + vL.y * 1.5);
      base = uc_plinth * (0.85 + 0.25 * grain);
      base *= 1.0 - 0.3 * smoothstep(1.2, -1.0, vL.y);
      shin = 14.0; specA = 0.05;
    }

    // Lighting: the same key light, sky and haze as the sea and the terrain.
    float sunUp = 1.0;
    if (pt == 4 || pt == 6 || pt == 10) base *= 1.0 - 0.28 * uWet;   // rain-dark stone
    float ndl = dot(N, L);
    float wrapD = clamp((ndl + 0.25) / 1.25, 0.0, 1.0);
    vec3 skyAmb = mix(uHorizonColor, uTopColor, 0.45) * 0.6;
    vec3 gnd = vec3(0.04, 0.06, 0.06) + uHorizonColor * 0.1;
    vec3 amb = mix(gnd, skyAmb, N.y * 0.5 + 0.5);
    vec3 sunC = uLightColor;
    vec3 col = base * (amb * 1.25 * ao + sunC * wrapD * wrapD * 1.05 * sunUp);
    vec3 Hh = normalize(L + V);
    col += sunC * pow(max(dot(N, Hh), 0.0), shin) * specA * sunUp * max(ndl, 0.0);
    float roughMat = clamp(sqrt(2.0 / (shin + 2.0)), 0.12, 0.86);
    float dielectricF0 = clamp(0.025 + specA * 0.06, 0.025, 0.10);
    col += sunC * ggxSurfaceTerm(N, L, V, roughMat, dielectricF0) * specA * sunUp * max(ndl, 0.0) * 0.22;
    col += emis;

    float fogAmt = 1.0 - exp(-pow(dist * (uFogDensity + uFogExtra), 2.0));
    vec3 fogCol = skyColor(normalize(vW - cameraPosition));
    col = mix(col, fogCol, clamp(fogAmt, 0.0, 1.0));
    gl_FragColor = vec4(finishColor(col), alpha);
  }
`;

const lmUniforms = Object.assign(sharedSkyUniforms(), {
  uTime: timeUniform,
  uNight: lmNight,
  uFogDensity: { value: WORLD.rockFogDensity },
});
for (let i = 0; i < LM_COL_KEYS.length; i++) lmUniforms['uc_' + LM_COL_KEYS[i]] = { value: toLinear(LM.colours[LM_COL_KEYS[i]]) };
const lmStaticMaterial = new THREE.ShaderMaterial({ vertexShader: LM_VERT, fragmentShader: LM_FRAG, uniforms: lmUniforms, side: THREE.DoubleSide });
const lmInstMaterial = new THREE.ShaderMaterial({ vertexShader: LM_VERT, fragmentShader: LM_FRAG, uniforms: lmUniforms, side: THREE.DoubleSide, defines: { INSTANCED: 1 } });

// ----- Beam: a long soft cone of light. Two opposite cones sweep round like a real lens. Additive, brighter where we look along it. -----
const LM_BEAM_VERT = `
  attribute float aT;
  varying float vT;
  varying vec3 vN;
  varying vec3 vW;
  void main() {
    vT = aT;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vW = wp.xyz;
    vN = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;
const LM_BEAM_FRAG = `
  uniform float uNight;
  uniform float uStrength;
  varying float vT;
  varying vec3 vN;
  varying vec3 vW;
  void main() {
    vec3 V = normalize(cameraPosition - vW);
    float ndv = abs(dot(normalize(vN), V));
    float along = pow(1.0 - vT, 1.4) * smoothstep(0.0, 0.03, vT);
    float a = pow(ndv, 1.6) * along * uNight * uStrength;
    gl_FragColor = vec4(vec3(1.0, 0.9, 0.66), a);
  }
`;
const LM_FLARE_VERT = `
  uniform vec3 uCenter;
  varying vec2 vP;
  varying float vSize;
  void main() {
    float d = distance(cameraPosition, uCenter);
    float size = 3.0 + d * 0.02;
    vec4 mv = viewMatrix * vec4(uCenter, 1.0);
    mv.xy += position.xy * size;
    mv.z += 7.0;
    vP = position.xy * 2.0;
    vSize = size;
    gl_Position = projectionMatrix * mv;
  }
`;
const LM_FLARE_FRAG = `
  uniform float uNight;
  uniform float uAng;
  uniform vec3 uCenter;
  varying vec2 vP;
  varying float vSize;
  void main() {
    vec2 toCam = normalize(cameraPosition.xz - uCenter.xz);
    vec2 d0 = vec2(cos(uAng), -sin(uAng));
    float al = pow(max(dot(d0, toCam), 0.0), 5.0) + pow(max(dot(-d0, toCam), 0.0), 5.0);
    float r = length(vP);
    float glow = exp(-r * r * 6.0) + 0.3 * exp(-r * 2.2);
    float k = uNight * (0.22 + 0.9 * al) + 0.03;
    gl_FragColor = vec4(vec3(1.0, 0.86, 0.55) * glow * k, glow * k);
  }
`;
const LM_FLARE_BUOY_VERT = `
  attribute vec3 iPos;
  attribute vec4 iRot;
  varying vec2 vP;
  varying float vSeed;
  void main() {
    vec4 wp = modelMatrix * vec4(iPos + vec3(0.0, 2.1, 0.0), 1.0);
    float d = distance(cameraPosition, wp.xyz);
    float size = 0.9 + d * 0.012;
    vec4 mv = viewMatrix * wp;
    mv.xy += position.xy * size;
    mv.z += 1.5;
    vP = position.xy * 2.0;
    vSeed = iRot.w;
    gl_Position = projectionMatrix * mv;
  }
`;
const LM_FLARE_BUOY_FRAG = `
  uniform float uNight;
  uniform float uTime;
  varying vec2 vP;
  varying float vSeed;
  void main() {
    float r = length(vP);
    float glow = exp(-r * r * 7.0) + 0.25 * exp(-r * 2.5);
    float flick = 0.8 + 0.2 * sin(uTime * 2.3 + vSeed * 40.0);
    float k = uNight * flick * 0.9 + 0.02;
    gl_FragColor = vec4(vec3(1.0, 0.72, 0.38) * glow * k, glow * k);
  }
`;

// ----- Mesh helpers (they fill a PB, the same mesh builder the plants use) -----
function lmSgn(x) { return x < 0 ? -1 : 1; }

// Lathe: turns a profile of [radius, height] pairs round the y axis. Normals come straight from the profile, so it is smooth
// all round with no seam. Call it once per smooth section; a new call makes a hard edge.
function lmLathe(b, prof, sides, part, seed, uS, vS, gScale) {
  const n = prof.length, rows = [];
  const nrm = [];
  for (let i = 0; i < n; i++) {
    const a = prof[Math.max(i - 1, 0)], c = prof[Math.min(i + 1, n - 1)];
    let dr = c[0] - a[0], dy = c[1] - a[1];
    const l = Math.hypot(dr, dy) || 1;
    nrm.push([dy / l, -dr / l]);
  }
  let acc = 0;
  for (let i = 0; i < n; i++) {
    if (i > 0) acc += Math.hypot(prof[i][0] - prof[i - 1][0], prof[i][1] - prof[i - 1][1]);
    const row = [];
    for (let s = 0; s < sides; s++) {
      const an = (s / sides) * Math.PI * 2, cs = Math.cos(an), sn = Math.sin(an);
      row.push(b.vert([cs * prof[i][0], prof[i][1], sn * prof[i][0]], [cs * nrm[i][0], nrm[i][1], sn * nrm[i][0]], part, 0, prof[i][1] * (gScale || 0), seed, (s / sides) * uS, acc * vS));
    }
    rows.push(row);
  }
  for (let i = 0; i < n - 1; i++) {
    for (let s = 0; s < sides; s++) {
      const s1 = (s + 1) % sides;
      b.quad(rows[i][s], rows[i + 1][s], rows[i + 1][s1], rows[i][s1]);
    }
  }
}

// A ring (torus) round the y axis, for rails and rims.
function lmRing(b, R, r, y, segs, sides, part, seed) {
  const rows = [];
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    const row = [];
    for (let s = 0; s < sides; s++) {
      const t = (s / sides) * Math.PI * 2, ct = Math.cos(t), st = Math.sin(t);
      row.push(b.vert([ca * (R + r * ct), y + r * st, sa * (R + r * ct)], [ca * ct, st, sa * ct], part, 0, 0, seed, i / segs, s / sides));
    }
    rows.push(row);
  }
  for (let i = 0; i < segs; i++) {
    for (let s = 0; s < sides; s++) {
      const i1 = (i + 1) % segs, s1 = (s + 1) % sides;
      b.quad(rows[i][s], rows[i1][s], rows[i1][s1], rows[i][s1]);
    }
  }
}

// A stone beam along a path with a rounded-rectangle cross-section (superellipse), so the edges are chamfered, never sharp.
// side is the horizontal width direction. hw / hh are half width / half height at each path point.
function lmBeam(b, pts, hw, hh, side, expo, sides, part, seed, caps, uv, amp, sf) {
  const n = pts.length, v0 = b.part.length, i0 = b.idx.length;
  const rings = [], cen = [];
  let along = 0;
  const pw = 2 / expo;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(i - 1, 0)], c = pts[Math.min(i + 1, n - 1)];
    const T = norm3([c[0] - a[0], c[1] - a[1], c[2] - a[2]]);
    const U = norm3(cross3(T, side));
    if (i > 0) along += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]);
    const ring = [];
    for (let s = 0; s < sides; s++) {
      const t = (s / sides) * Math.PI * 2, ct = Math.cos(t), st = Math.sin(t);
      let x = hw[i] * lmSgn(ct) * Math.pow(Math.abs(ct), pw), y = hh[i] * lmSgn(st) * Math.pow(Math.abs(st), pw);
      if (amp) {   // noise-bent rock: the section swells and shrinks along the path
        const f = 1 + amp * ((fbmJS(pts[i][0] * 0.12 + sf + ct, pts[i][2] * 0.12 + pts[i][1] * 0.09 + st, 17, 3) - 0.5) * 2);
        x *= f; y *= f;
      }
      ring.push(b.vert([pts[i][0] + side[0] * x + U[0] * y, pts[i][1] + side[1] * x + U[1] * y, pts[i][2] + side[2] * x + U[2] * y],
        [0, 1, 0], part, 0, 0, seed, (s / sides) * (uv || 1), along * 0.5));
      cen.push(pts[i]);
    }
    rings.push(ring);
  }
  for (let i = 0; i < n - 1; i++) {
    for (let s = 0; s < sides; s++) {
      const s1 = (s + 1) % sides;
      b.quad(rings[i][s], rings[i][s1], rings[i + 1][s1], rings[i + 1][s]);
    }
  }
  if (caps) {
    for (const end of [0, n - 1]) {
      const ci = b.vert(pts[end], [0, 1, 0], part, 0, 0, seed, 0.5, along * 0.5);
      cen.push(pts[end]);
      for (let s = 0; s < sides; s++) {
        if (end === 0) b.tri(ci, rings[0][(s + 1) % sides], rings[0][s]);
        else b.tri(ci, rings[n - 1][s], rings[n - 1][(s + 1) % sides]);
      }
    }
  }
  b.smooth(v0, i0, null);
  for (let k = 0; k < cen.length; k++) {   // point every normal away from the beam's own axis
    const o = (v0 + k) * 3, np = b.nrm;
    let rx = b.pos[o] - cen[k][0], ry = b.pos[o + 1] - cen[k][1], rz = b.pos[o + 2] - cen[k][2];
    if (k >= rings.length * sides) { continue; }
    if (np[o] * rx + np[o + 1] * ry + np[o + 2] * rz < 0) { np[o] = -np[o]; np[o + 1] = -np[o + 1]; np[o + 2] = -np[o + 2]; }
  }
}

// A smooth upright post (rounded stone pillar or iron rod): straight beam with a round-ish section.
function lmPost(b, x, y0, y1, z, hw, part, seed, sides, expo) {
  lmBeam(b, [[x, y0, z], [x, y1, z]], [hw, hw], [hw, hw], [1, 0, 0], expo || 4, sides, part, seed, true, 1);
}

// Moves the vertices added since v0: rotate about x, then z, then y (yaw), then translate. Normals turn with them.
function lmPlace(b, v0, x, y, z, yaw, rx, rz) {
  const cx = Math.cos(rx || 0), sx = Math.sin(rx || 0), cz = Math.cos(rz || 0), sz = Math.sin(rz || 0), cy = Math.cos(yaw || 0), sy = Math.sin(yaw || 0);
  const rot = (a, o) => {
    let px = a[o], py = a[o + 1], pz = a[o + 2];
    let t = py * cx - pz * sx; pz = py * sx + pz * cx; py = t;
    t = px * cz - py * sz; py = px * sz + py * cz; px = t;
    t = px * cy + pz * sy; pz = -px * sy + pz * cy; px = t;
    a[o] = px; a[o + 1] = py; a[o + 2] = pz;
  };
  for (let v = v0; v < b.part.length; v++) {
    rot(b.pos, v * 3); rot(b.nrm, v * 3);
    b.pos[v * 3] += x; b.pos[v * 3 + 1] += y; b.pos[v * 3 + 2] += z;
  }
}
// Flat tile coordinates (cells of size cell metres) for the vertices added since v0, from their x and z.
function lmPlanarUV(b, v0, cell, ox, oz) {
  for (let v = v0; v < b.part.length; v++) { b.uv[v * 2] = (b.pos[v * 3] + (ox || 0)) / cell + 50; b.uv[v * 2 + 1] = (b.pos[v * 3 + 2] + (oz || 0)) / cell + 50; }
}

function lmMesh(b, I, y0, material, group) {
  const t = b.pack();
  const geo = new THREE.BufferGeometry();
  setPlantAttrs(geo, t);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 12, 0), I.R * 1.5 + 60);
  const m = new THREE.Mesh(geo, material || lmStaticMaterial);
  m.position.set(I.cx, y0, I.cz);
  group.add(m);
  return m;
}

// ----- Lighthouse -----
const lmBeamGeos = {};
function lmBeamGeometry(sides) {
  if (lmBeamGeos[sides]) return lmBeamGeos[sides];
  const T = LM.lighthouse, pos = [], nrm = [], aT = [], idx = [];
  for (let c = 0; c < 2; c++) {
    const sg = c === 0 ? 1 : -1, base = pos.length / 3;
    for (let j = 0; j < 2; j++) {
      for (let s = 0; s < sides; s++) {
        const a = (s / sides) * Math.PI * 2, r = j ? T.beamRadius : 0.4;
        pos.push(sg * T.beamLength * j, Math.cos(a) * r, Math.sin(a) * r);
        nrm.push(0, Math.cos(a), Math.sin(a));
        aT.push(j);
      }
    }
    for (let s = 0; s < sides; s++) {
      const s1 = (s + 1) % sides;
      idx.push(base + s, base + s1, base + sides + s1, base + s, base + sides + s1, base + sides + s);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(aT, 1));
  g.setIndex(idx);
  lmBeamGeos[sides] = g;
  return g;
}
const lmBeamMaterial = new THREE.ShaderMaterial({
  vertexShader: LM_BEAM_VERT, fragmentShader: LM_BEAM_FRAG,
  uniforms: { uNight: lmNight, uStrength: { value: LM.lighthouse.beamStrength } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});
const lmFlareGeo = new THREE.PlaneGeometry(1, 1);

function lmLighthouse(I, ql, y0, L) {

  for (let i = 0; i <= ql.towerRings; i++) {

  lmLathe(b, [[1.95, Ht + 3.05], [1.9, Ht + 3.3], [1.45, Ht + 3.85], [0.85, Ht + 4.3], [0.3, Ht + 4.6], [0.05, Ht + 4.75]], sides, LM_ROOF, sd, 1, 0.2, 0);
  lmLathe(b, [[0.001, Ht + 4.7], [0.15, Ht + 4.78], [0.2, Ht + 4.95], [0.15, Ht + 5.12], [0.001, Ht + 5.2]], 10, LM_ROOF, sd, 1, 0.2, 0);
  lmPost(b, 0, Ht + 5.1, Ht + 6.3, 0, 0.03, LM_IRON, sd, 5, 2);

  let v0 = b.part.length;

  lmLathe(b, [[3.3, 2.85], [3.0, 3.3], [2.1, 4.1], [1.0, 4.6], [0.05, 4.8]], ql.hutSides, LM_ROOF, sd, 1, 0.2, 0);
  lmPlace(b, v0, 9.5, 0, 6.0, 0);

    lmLathe(b, [[0.001, 2.0], [0.27, 2.05], [0.33, 2.35], [0.25, 2.65], [0.001, 2.7]], 10, LM_LANTERN, sd + k * 0.37, 1, 0.2, 0);

    uniforms: { uNight: lmNight, uAng: { value: 0 }, uCenter: { value: new THREE.Vector3(I.cx, lampY, I.cz) } },

  const rec = { mesh: beam, flare: flare, ang: (I.seedF * 1.7) % 6.283, speed: T.beamSpeed, I: I };
  lmBeams.push(rec);

// ----- Ruins isle -----
// A paved court with geometric tilework, a domed hall, an observatory tower with a meridian ring, and a curved colonnade of
// pointed arches, some of them broken. All stone has rounded edges. Lamp posts glow at night. Nobody is here.
function lmPointedArch(b, P0, P1, hS, ql, part, seed, broken) {
  // Points along a two-centre (pointed) arch between two pillar tops, in the plane of the two pillars.
  const dx = P1[0] - P0[0], dz = P1[2] - P0[2], w = Math.hypot(dx, dz), a = w / 2;
  const tx = dx / w, tz = dz / w;
  const mx = (P0[0] + P1[0]) / 2, mz = (P0[2] + P1[2]) / 2;
  const rad = norm3([mx - (P0[0] + P1[0]) / 2 + tz, 0, -tx]);   // horizontal, perpendicular to the span
  const Ra = a * 1.6, cxl = -a + Ra;
  const N = ql.archSegs;
  const pts = [], hw = [], hh = [];
  for (let i = 0; i <= 2 * N; i++) {
    const s = i / (2 * N);
    const x = -a + 2 * a * s;
    const xm = -Math.abs(x);
    const y = Math.sqrt(Math.max(Ra * Ra - (xm - cxl) * (xm - cxl), 0));
    // left half uses the left circle, right half mirrors it
    pts.push([mx + tx * x, P0[1] + hS + y, mz + tz * x]);
    hw.push(0.7); hh.push(0.55);
  }
  let use = pts.length;
  if (broken) use = Math.round(pts.length * 0.56);
  const sub = pts.slice(0, use);
  lmBeam(b, sub, hw.slice(0, use), hh.slice(0, use), rad, 4, ql.stoneSides, part, seed, broken, 1.5);
}

function lmRuins(I, ql, y0, L) {
  const R = LM.ruins, b = new PB(), sd = (I.seedF % 1) + 0.1, sides = ql.stoneSides;
  const rndR = mulberry32((I.seedI ^ 0x7a11) >>> 0);
  const yaw = rndR() * Math.PI * 2;
  let v0;

  // Court: a wide, softly rounded paving disc with the star tiles.
  v0 = b.part.length;
  lmLathe(b, [[0.01, -0.7], [R.courtR, -0.7], [R.courtR + 0.3, 0.05], [R.courtR + 0.05, 0.3], [R.courtR - 0.4, 0.34], [0.01, 0.34]], ql.domeSides, LM_TILE, sd, 1, 0.2, 0);
  lmPlanarUV(b, v0, 2.4, 0, 0);

  // Fountain basin in the middle (dry): a rounded stone rim round a tiled floor.
  lmLathe(b, [[1.5, 0.3], [1.9, 0.4], [2.1, 0.8], [1.95, 1.05], [1.6, 1.05], [1.45, 0.8], [1.45, 0.5]], 14, LM_STONE, sd, 1, 0.2, 0);

  }

  lmLathe(b, [[0.32, top + domeH - 0.1], [0.2, top + domeH + 0.5], [0.1, top + domeH + 1.4], [0.001, top + domeH + 2.2]], 8, LM_ROOF, sd, 1, 0.2, 0);
  lmLathe(b, [[0.001, top + domeH + 0.7], [0.22, top + domeH + 0.9], [0.3, top + domeH + 1.15], [0.2, top + domeH + 1.4], [0.001, top + domeH + 1.55]], 10, LM_LAMP, sd, 1, 0.2, 0);
  lmPlace(b, v0, 9.0, 0, -5.5, 0);

  // Observatory: a tapering round tower, a stone parapet, and a meridian ring on a polar axis pointing to the pole star.
  v0 = b.part.length;
  const OH = 12.5;
  const op = [];
  for (let i = 0; i <= ql.towerRings; i++) { const t = i / ql.towerRings; op.push([mixJS(3.5, 2.9, t) + 0.06 * Math.sin(Math.PI * t), -1.5 + t * (OH + 1.5)]); }

  lmLathe(b, [[2.0, OH + 0.6], [2.0, OH + 0.75], [0.01, OH + 0.75]], ql.domeSides, LM_TILE, sd, 6, 0.3, 0);
  // Pointed doorway at the foot (a dark panel in a rounded stone frame).
